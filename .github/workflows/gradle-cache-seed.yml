# Populate architecture-scoped Gradle User Home caches only when cache inputs change.
# The trusted main producer is NOT a redundant post-merge product build.
# Keep this separate from PR-required Build/Test/Qodana/Verifier: no duplicated
# post-merge acceptance and no cache writes from untrusted pull-request refs.
name: Gradle Cache Seed

on:
  push:
    branches:
      - main
    paths:
      # Only dependency/toolchain/build-logic inputs need a new main cache.
      # Product source and CI-only workflow edits do not change those inputs.
      - '.github/workflows/gradle-cache-seed.yml'
      - '.nvmrc'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - 'webview/package.json'
      - 'webview/package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gradle-cache-seed-${{ github.ref }}
  cancel-in-progress: true

jobs:
  seed:
    # The GitHub cache can be reused by PRs only when written in the
    # default-branch scope. Never accept a PR-head or non-main cache writer.
    if: github.repository == 'luceat-lux-vestra/MarkFlow' && github.ref == 'refs/heads/main'
    name: Gradle cache seed (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
          - arch: x64
            runner: ubuntu-24.04
    steps:
      - name: Fetch exact protected main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Verify exact protected checkout
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: zulu
          java-version: 25

      - name: Setup Gradle (default-branch cache writer)
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: false

      - name: Populate production plugin cache
        run: ./gradlew buildPlugin -PplatformVersion=2026.2.3
