name: JCEF Envelope Evidence

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jcef-envelope-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Fetch Sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: zulu
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: true

      - name: Run real JCEF envelope probe
        shell: bash
        run: |
          set -euo pipefail
          report_dir="$RUNNER_TEMP/markflow-jcef-envelope"
          report_path="$report_dir/report.json"
          mkdir -p "$report_dir"
          export JAVA_TOOL_OPTIONS="-Dmarkflow.jcefEnvelopeProbe=true -Dmarkflow.jcefEnvelopeProbe.report=$report_path"
          export DISPLAY=:99.0
          Xvfb -ac :99 -screen 0 1920x1080x16 &
          xvfb_pid=$!
          trap 'kill "$xvfb_pid" 2>/dev/null || true' EXIT
          ./gradlew runIde
          python3 .github/scripts/verify-jcef-envelope-report.py "$report_path"

      - name: Upload JCEF envelope report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: jcef-envelope-${{ github.run_id }}
          path: ${{ runner.temp }}/markflow-jcef-envelope/report.json
          if-no-files-found: warn
          retention-days: 14
