name: Normalize Migration Docs

on:
  pull_request:
    paths:
      - '.github/workflows/normalize-migration-docs.yml'

permissions:
  contents: write

concurrency:
  group: normalize-migration-docs-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  normalize:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false

      - name: Normalize current-state migration wording
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count == 1:
                  return text.replace(old, new, 1)
              if count == 0 and new in text:
                  return text
              raise SystemExit(f'{label}: expected exactly one old form, found {count}')

          inventory = Path('docs/architecture/leap-migration-inventory.md')
          text = inventory.read_text(encoding='utf-8')
          replacements = [
              (
                  'Status: repository migration authority for #141 under accepted ADR 0001 and ADR 0002; execution status reconciled through #146 target ownership',
                  'Status: repository migration authority for #141 under accepted ADR 0001 and ADR 0002; execution status reconciled through completed #153 production cutover and active #154 purge',
                  'inventory status',
              ),
              (
                  "- #146 resolves the target paste/state/representative-rich-edit ownership as platform paste/command/undo/`FileEditorState` semantics plus narrowly scoped MarkFlow payload/local-edit behavior, subject to #146's own exact-final-HEAD and post-main proof gate;\n- #153 remains the only production native-editor cutover owner, so the current browser editor/provider/protocol remain temporary until their explicit deletion criteria are met.",
                  "- #146 established target paste/state/representative-rich-edit ownership as platform paste/command/undo/`FileEditorState` semantics plus narrowly scoped MarkFlow payload/local-edit behavior;\n- #153 is completed and production editing is platform-native; #154 is actively deleting the superseded browser editor/provider/protocol machinery while retained JCEF is renderer-only.",
                  'current execution status',
              ),
              (
                  '8. Mermaid `11.17.2` and KaTeX `^0.18.5` remain supported engines during editor migration.',
                  '8. Mermaid `11.17.2` and KaTeX `^0.18.7` remain the landed renderer baselines during this purge; renderer upgrades are separately gated.',
                  'renderer invariant baseline',
              ),
              (
                  '## Responsibility-level classification\n\n| Current responsibility / mechanism | Classification | Target disposition | Temporary owner / deletion criterion |',
                  '## Responsibility-level classification\n\nThe rows below preserve the audited migration classification. A row describing a superseded mechanism does not imply that mechanism still exists after its deletion criterion has been satisfied; current execution authority is the status above and `docs/architecture/README.md`.\n\n| Audited responsibility / mechanism | Classification | Target disposition | Temporary owner / deletion criterion |',
                  'classification framing',
              ),
              (
                  '| KaTeX `^0.18.5`, CSS/fonts, compatible inline/display semantics |',
                  '| KaTeX `^0.18.7`, CSS/fonts, compatible inline/display semantics |',
                  'KaTeX classification baseline',
              ),
              (
                  '- **#153** owns the production native-editor cutover and makes the old editor unreachable as a normal authority.\n- **#154** owns mandatory deletion of superseded browser editors, source sync protocols, editor trust/resource realm, browser lease/recovery and mechanism-only tests.',
                  '- **#153 — COMPLETED**: production native-editor cutover made the old editor unreachable as a normal authority.\n- **#154 — ACTIVE**: owns mandatory deletion of superseded browser editors, source sync protocols, editor trust/resource realm, browser lease/recovery and mechanism-only tests.',
                  'temporary ownership status',
              ),
              (
                  'Historical source-native editor request/CSP/loopback/local-image mechanisms remain temporary until #154 and are not copied into the renderer boundary by default.',
                  'Historical source-native editor request/CSP/loopback/local-image mechanisms were migration-only; #154 removes them rather than copying them into the retained renderer boundary.',
                  'trust migration status',
              ),
              (
                  '- **#153** `task(leap): cut production MarkFlow editing over to the native projection architecture` — requires target evidence from #143–#152, including #150/#151 for approved product completeness.\n- **#154** `task(leap): purge superseded browser editors, sync protocols and editor trust machinery` — hard dependency on #153.',
                  '- **#153 — COMPLETED** `task(leap): cut production MarkFlow editing over to the native projection architecture` — production native ownership and post-main evidence are complete.\n- **#154 — ACTIVE** `task(leap): purge superseded browser editors, sync protocols and editor trust machinery` — deleting the now-unreachable browser editing architecture after completed #153.',
                  'backlog cutover status',
              ),
          ]
          for old, new, label in replacements:
              text = replace_once(text, old, new, label)
          inventory.write_text(text, encoding='utf-8')

          shell = Path('docs/architecture/native-editor-shell-selection.md')
          text = shell.read_text(encoding='utf-8')
          replacements = [
              (
                  'This decision does **not** cut production over. The current JCEF-backed `MarkFlowEditorProvider` and `MarkFlowEditor` remain temporary migration code until #153 performs the production cutover and #154 deletes the superseded editor/protocol/trust surface.',
                  'At the #143 decision point this proof did **not** cut production over: the JCEF-backed `MarkFlowEditorProvider` and `MarkFlowEditor` were still temporary migration code. #153 later completed production cutover, and #154 owns deletion of that superseded editor/protocol/trust surface.',
                  'shell decision status',
              ),
              (
                  'Current MarkFlow migration code still declares `com.intellij.modules.jcef` as a required plugin dependency and directly references `com.intellij.ui.jcef.*`/`org.cef.*` classes. Therefore the #143 runtime proof has a deliberately narrower meaning:',
                  'At the #143 proof point MarkFlow migration code still declared `com.intellij.modules.jcef` as a required plugin dependency and directly referenced `com.intellij.ui.jcef.*`/`org.cef.*` classes. Therefore that #143 runtime proof had a deliberately narrower meaning:',
                  'shell JCEF historical context',
              ),
              (
                  '3. `provider-and-bundled-markdown-coexistence` — the public provider EP contains at least one bundled Markdown integration that accepts the fixture, the platform text provider accepts the file with `NONE` policy, and the temporary JCEF-gated MarkFlow provider does not take over while JCEF runtime support is disabled.',
                  '3. `provider-and-bundled-markdown-coexistence` — the public provider EP contains at least one bundled Markdown integration that accepts the fixture, the platform text provider accepts the file with `NONE` policy, and post-cutover evidence rejects any remaining legacy MarkFlow browser provider registration.',
                  'shell provider evidence',
              ),
              (
                  'After #143, the shell choice is no longer `UNRESOLVED`: downstream native work targets platform text-editor augmentation. Production still remains on the temporary browser editor until the later cutover gate is satisfied.',
                  'After #143, the shell choice was no longer `UNRESOLVED`: downstream native work targeted platform text-editor augmentation. #153 later satisfied the cutover gate and moved production editing to that platform-native ownership; #154 now removes the obsolete browser implementation.',
                  'shell final status',
              ),
          ]
          for old, new, label in replacements:
              text = replace_once(text, old, new, label)
          shell.write_text(text, encoding='utf-8')
          PY

      - name: Write normalized documents to this PR branch
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail
          for path in docs/architecture/leap-migration-inventory.md docs/architecture/native-editor-shell-selection.md; do
            if git diff --quiet -- "$path"; then
              echo "$path is already normalized."
              continue
            fi
            blob_sha="$(git rev-parse HEAD:"$path")"
            encoded="$(base64 -w0 "$path")"
            gh api "repos/$GITHUB_REPOSITORY/contents/$path" \
              --method PUT \
              -f message='docs(leap): reconcile post-cutover purge status' \
              -f branch="$HEAD_REF" \
              -f sha="$blob_sha" \
              -f content="$encoded" >/dev/null
          done
