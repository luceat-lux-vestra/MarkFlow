name: MarkFlow 362 ARM Visual Proof (temporary)

# This workflow exists only to collect exact-source Starter evidence while
# PR #462 remains Draft. It MUST be removed before Ready/merge.
# No canonical gate, JUnit oracle, SHA verification or golden is bypassed.
on:
  push:
    branches:
      - ci/362-arm-visual-production-candidate

permissions:
  contents: read

concurrency:
  group: markflow-362-arm-visual-proof
  cancel-in-progress: false

jobs:
  exact-head-starter:
    name: Real Starter E2E and strict ARM visual (temporary)
    # A push event makes the existing reusable workflow's package job run
    # while the PR remains Draft. The reusable workflow computes
    # STARTER_SOURCE_SHA from the triggering push SHA and verifies checkouts,
    # immutable ZIP and original visual/Starter JUnit assertions.
    uses: ./.github/workflows/starter-driver-e2e.yml
    permissions:
      contents: read
