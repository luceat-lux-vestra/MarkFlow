name: Derived Renderer Evidence

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/derived-renderer-evidence.yml'
      - 'src/main/resources/META-INF/plugin.xml'
      - 'src/main/resources/META-INF/markflow-jcef.xml'
      - 'src/main/kotlin/com/algorist/markflow/renderer/**'
      - 'src/main/kotlin/com/algorist/markflow/browser/MarkFlowWebviewResourceManager.kt'
      - 'webview/package.json'
      - 'webview/derived-renderer.html'
      - 'webview/vite.derived-renderer.config.ts'
      - 'webview/src/renderer/**'
      - 'webview/src/app/derived-renderer-service.ts'
      - 'webview/src/app/browser-derived-renderer-backends.ts'
  pull_request:
    paths:
      - '.github/workflows/derived-renderer-evidence.yml'
      - 'src/main/resources/META-INF/plugin.xml'
      - 'src/main/resources/META-INF/markflow-jcef.xml'
      - 'src/main/kotlin/com/algorist/markflow/renderer/**'
      - 'src/main/kotlin/com/algorist/markflow/browser/MarkFlowWebviewResourceManager.kt'
      - 'webview/package.json'
      - 'webview/derived-renderer.html'
      - 'webview/vite.derived-renderer.config.ts'
      - 'webview/src/renderer/**'
      - 'webview/src/app/derived-renderer-service.ts'
      - 'webview/src/app/browser-derived-renderer-backends.ts'

permissions:
  contents: read

concurrency:
  group: derived-renderer-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: Isolated JCEF renderer probe
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          large-packages: false

      - name: Fetch Sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: zulu
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: true

      - name: Start virtual display
        shell: bash
        run: |
          set -euo pipefail
          Xvfb :99 -screen 0 1920x1080x24 >"$RUNNER_TEMP/markflow-derived-renderer-xvfb.log" 2>&1 &
          printf 'DISPLAY=:99\n' >> "$GITHUB_ENV"

      - name: Run isolated renderer probe
        shell: bash
        run: |
          set -euo pipefail
          export JAVA_TOOL_OPTIONS="-Dmarkflow.derivedRendererProbe.output=$GITHUB_WORKSPACE/build/derived-renderer-probe/evidence.json -Dide.mac.message.dialogs.as.sheets=false -Djb.privacy.policy.text=<!--999.999--> -Djb.consents.confirmation.enabled=false"
          timeout --signal=TERM --kill-after=15s 8m ./gradlew runIde --args=markflow-derived-renderer-probe --stacktrace

      - name: Validate evidence completeness
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('build/derived-renderer-probe/evidence.json')
          if not path.is_file():
              raise SystemExit('derived renderer probe did not produce evidence.json')

          evidence = json.loads(path.read_text(encoding='utf-8'))
          if evidence.get('schemaVersion') != 1:
              raise SystemExit(f"unexpected evidence schema: {evidence.get('schemaVersion')}")
          if evidence.get('selectedRuntime') != 'ISOLATED_JCEF':
              raise SystemExit(f"unexpected renderer runtime: {evidence.get('selectedRuntime')}")
          if evidence.get('verdict') != 'PASS':
              raise SystemExit(f"renderer evidence verdict is not PASS: {evidence.get('verdict')}")
          if evidence.get('baselineLiveInstances') != evidence.get('finalLiveInstances'):
              raise SystemExit('renderer live-instance count did not return to baseline')

          required = {
              'runtime-factory-registered',
              'mermaid-success',
              'mermaid-syntax-failure',
              'katex-inline-success',
              'katex-display-success',
              'katex-malformed-degradation',
              'cross-origin-navigation-blocked',
              'repeated-create-dispose',
          }
          cases = evidence.get('cases') or []
          by_id = {case.get('id'): case for case in cases}
          if len(by_id) != len(cases):
              raise SystemExit('duplicate renderer evidence case ids')
          if set(by_id) != required:
              raise SystemExit(f"renderer evidence case mismatch: {sorted(set(by_id) ^ required)}")
          failed = sorted(case_id for case_id in required if by_id[case_id].get('outcome') != 'PASS')
          if failed:
              raise SystemExit(f"renderer evidence failures: {failed}")

          print(f"Derived renderer evidence PASS on IDE {evidence.get('ideBuild')}")
          for case in cases:
              print(f"{case.get('id')}: {case.get('outcome')} - {case.get('detail')}")
          PY

      - name: Upload renderer evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: derived-renderer-evidence
          path: |
            build/derived-renderer-probe/evidence.json
            build/idea-sandbox/**/log/idea.log
            ${{ runner.temp }}/markflow-derived-renderer-xvfb.log
          if-no-files-found: warn
