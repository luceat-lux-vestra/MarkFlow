name: Native Projection Evidence

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/native-projection-evidence.yml'
      - 'build.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - 'webview/package.json'
      - 'webview/package-lock.json'
      - 'fixtures/markdown-fidelity/**'
      - 'src/main/resources/META-INF/plugin.xml'
      - 'src/main/kotlin/com/algorist/markflow/editor/native/**'
      - 'src/test/kotlin/com/algorist/markflow/editor/native/**'
      - 'docs/architecture/native-markdown-projection-foundation.md'
      - 'docs/architecture/native-editor-shell-selection.md'
      - 'docs/architecture/0001-native-authority-projection-architecture.md'
      - 'docs/architecture/README.md'
  pull_request:
    paths:
      - '.github/workflows/native-projection-evidence.yml'
      - 'build.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - 'webview/package.json'
      - 'webview/package-lock.json'
      - 'fixtures/markdown-fidelity/**'
      - 'src/main/resources/META-INF/plugin.xml'
      - 'src/main/kotlin/com/algorist/markflow/editor/native/**'
      - 'src/test/kotlin/com/algorist/markflow/editor/native/**'
      - 'docs/architecture/native-markdown-projection-foundation.md'
      - 'docs/architecture/native-editor-shell-selection.md'
      - 'docs/architecture/0001-native-authority-projection-architecture.md'
      - 'docs/architecture/README.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-projection-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: Real IntelliJ native projection probe
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          large-packages: false

      - name: Fetch Sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: zulu
          java-version: 25

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: webview/package-lock.json

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: true

      - name: Start virtual display
        shell: bash
        run: |
          set -euo pipefail
          Xvfb :99 -screen 0 1920x1080x24 >"$RUNNER_TEMP/markflow-native-projection-xvfb.log" 2>&1 &
          printf 'DISPLAY=:99\n' >> "$GITHUB_ENV"

      - name: Run real IntelliJ native projection probe with JCEF disabled
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=15s 8m ./gradlew runIdeForNativeProjectionProbe --stacktrace

      - name: Validate native projection evidence completeness
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('build/native-projection-probe/evidence.json')
          if not path.is_file():
              raise SystemExit('native projection probe did not produce evidence.json')

          evidence = json.loads(path.read_text(encoding='utf-8'))
          if evidence.get('schemaVersion') != 2:
              raise SystemExit(f"unexpected evidence schema: {evidence.get('schemaVersion')}")
          if evidence.get('selectedShell') != 'PLATFORM_TEXT_EDITOR_AUGMENTATION':
              raise SystemExit(f"unexpected selected shell: {evidence.get('selectedShell')}")
          if evidence.get('parserStrategy') != 'JETBRAINS_BUNDLED_MARKDOWN':
              raise SystemExit(f"unexpected parser strategy: {evidence.get('parserStrategy')}")
          if evidence.get('jcefSupported') is not False:
              raise SystemExit(f"JCEF-disabled proof was not actually disabled: {evidence.get('jcefSupported')}")
          if evidence.get('verdict') != 'PASS':
              raise SystemExit(f"native projection proof verdict is not PASS: {evidence.get('verdict')}")

          required = {
              'jcef-disabled-projection-path',
              'authoritative-document-fixture',
              'platform-text-and-markdown-coexistence',
              'attach-no-edit-source-stability',
              'parser-proven-projection-plan',
              'inline-and-block-native-presentation',
              'caret-and-selection-exact-source-reveal',
              'stale-plan-rejected-before-apply',
              'document-change-refresh',
              'config-stale-plan-rejected-before-apply',
              'typed-degradation-falls-back-to-source',
              'split-editor-presentation-isolation',
              'malformed-unsupported-source-degrades-safely',
              'refresh-recreate-dispose-source-stability',
              'final-lifecycle-ownership',
          }
          cases = evidence.get('cases') or []
          by_id = {case.get('id'): case for case in cases}
          if len(by_id) != len(cases):
              raise SystemExit('duplicate native projection evidence case ids')
          if set(by_id) != required:
              raise SystemExit(
                  f"native projection case contract mismatch: missing={sorted(required - set(by_id))}, "
                  f"unexpected={sorted(set(by_id) - required)}"
              )
          failed = sorted(case_id for case_id in required if by_id[case_id].get('outcome') != 'PASS')
          if failed:
              raise SystemExit(f'native projection required cases failed: {failed}')

          fixture_detail = str(by_id['authoritative-document-fixture'].get('detail', ''))
          if 'projectDefault=false' not in fixture_detail or 'insideProject=true' not in fixture_detail:
              raise SystemExit(f'native projection proof did not run inside a real opened project: {fixture_detail}')
          stale_detail = str(by_id['stale-plan-rejected-before-apply'].get('detail', ''))
          if 'staleRejected=true' not in stale_detail:
              raise SystemExit(f'source-stale projection was not proven rejected: {stale_detail}')
          config_stale_detail = str(by_id['config-stale-plan-rejected-before-apply'].get('detail', ''))
          if 'configStaleRejected=true' not in config_stale_detail or 'recoveredGeneration=2' not in config_stale_detail:
              raise SystemExit(f'config-stale projection contract incomplete: {config_stale_detail}')
          degraded_detail = str(by_id['typed-degradation-falls-back-to-source'].get('detail', ''))
          if 'exactSourceFallback=true' not in degraded_detail or 'recovered=true' not in degraded_detail:
              raise SystemExit(f'typed degradation/recovery contract incomplete: {degraded_detail}')
          reveal_detail = str(by_id['caret-and-selection-exact-source-reveal'].get('detail', ''))
          if 'multicaretSelectionReveal=true' not in reveal_detail:
              raise SystemExit(f'multicaret source-reveal evidence incomplete: {reveal_detail}')
          lifecycle_detail = str(by_id['final-lifecycle-ownership'].get('detail', ''))
          if 'controllers=0' not in lifecycle_detail or 'editors=0' not in lifecycle_detail:
              raise SystemExit(f'projection lifecycle cleanup incomplete: {lifecycle_detail}')

          parity_path = Path('build/native-projection-probe/parity.json')
          if not parity_path.is_file():
              raise SystemExit('#152 native Markdown parity probe did not produce parity.json')
          parity = json.loads(parity_path.read_text(encoding='utf-8'))
          if parity.get('schemaVersion') != 1:
              raise SystemExit(f"unexpected parity schema: {parity.get('schemaVersion')}")
          if parity.get('verdict') != 'PASS':
              raise SystemExit(f"native Markdown parity verdict is not PASS: {parity.get('verdict')}")
          parity_required = {
              'fidelity-corpus-runtime-mapping',
              'raw-html-safe-runtime',
              'raw-html-hostile-degraded-runtime',
              'ordinary-parser-table-boundary',
              'ordinary-native-presentation-source-neutral',
              'ordinary-accessibility-source-fallback',
              'table-native-presentation-source-neutral',
              'table-caret-selection-and-end-boundary-reveal',
              'table-mouse-inlay-reveal',
              'table-accessibility-source-fallback',
              'rapid-edit-caret-regeneration',
              'large-representative-document-baseline',
          }
          parity_cases = parity.get('cases') or []
          parity_by_id = {case.get('id'): case for case in parity_cases}
          if len(parity_by_id) != len(parity_cases):
              raise SystemExit('duplicate native Markdown parity case ids')
          if set(parity_by_id) != parity_required:
              raise SystemExit(
                  f"native Markdown parity case contract mismatch: missing={sorted(parity_required - set(parity_by_id))}, "
                  f"unexpected={sorted(set(parity_by_id) - parity_required)}"
              )
          parity_failed = sorted(
              case_id for case_id in parity_required if parity_by_id[case_id].get('outcome') != 'PASS'
          )
          if parity_failed:
              raise SystemExit(f'native Markdown parity required cases failed: {parity_failed}')

          marker_contract = {
              'fidelity-corpus-runtime-mapping': (
                  'fixtures=12', 'exactIdentity=true', 'rangesInBounds=true', 'imageBoundary=true'
              ),
              'raw-html-safe-runtime': ('fragments=2', 'safe=2', 'rasterized=2', 'sourceStable=true'),
              'raw-html-hostile-degraded-runtime': ('blocked=', 'exactSourceFallback=true', 'sourceStable=true'),
              'ordinary-parser-table-boundary': ('allKinds=true', 'linkSyntax=true', 'halfOpenBoundary=true'),
              'ordinary-native-presentation-source-neutral': (
                  'markers=true', 'linkConceal=true', 'boundaryReveal=true', 'sourceStable=true'
              ),
              'ordinary-accessibility-source-fallback': (
                  'sourceFallback=true', 'folds=0', 'highlighters=0', 'sourceStable=true', 'stampStable=true'
              ),
              'table-native-presentation-source-neutral': ('inlays=1', 'folds=2', 'sourceStable=true'),
              'table-caret-selection-and-end-boundary-reveal': ('caretReveal=true', 'selectionReveal=true', 'endBoundaryInactive=true'),
              'table-mouse-inlay-reveal': ('mouseEvent=true', 'mouseReveal=true', 'sourceStable=true'),
              'table-accessibility-source-fallback': ('sourceVisible=true', 'accessibilityFallback=1'),
              'rapid-edit-caret-regeneration': ('iterations=20', 'exactIdentity=true', 'caretMovement=true'),
              'large-representative-document-baseline': ('rangesInBounds=true', 'table=1'),
          }
          for case_id, markers in marker_contract.items():
              detail = str(parity_by_id[case_id].get('detail', ''))
              missing = [marker for marker in markers if marker not in detail]
              if missing:
                  raise SystemExit(f'{case_id} missing parity markers {missing}: {detail}')

          def metric(case_id, key):
              detail = str(parity_by_id[case_id].get('detail', ''))
              prefix = f"{key}="
              token = next((part for part in detail.split() if part.startswith(prefix)), None)
              if token is None:
                  raise SystemExit(f"{case_id} missing {key}: {detail}")
              return int(token[len(prefix):])

          rapid_ms = metric('rapid-edit-caret-regeneration', 'elapsedMs')
          if rapid_ms > 5000:
              raise SystemExit(f'rapid edit/caret projection latency {rapid_ms}ms exceeded 5000ms budget')
          large_ms = metric('large-representative-document-baseline', 'planElapsedMs')
          if large_ms > 3000:
              raise SystemExit(f'large projection planning latency {large_ms}ms exceeded 3000ms budget')

          print(f"Native projection verdict: {evidence['verdict']}")
          print(f"Selected shell: {evidence['selectedShell']}")
          print(f"Parser: {evidence['parserStrategy']}")
          print(f"IDE build: {evidence.get('ideBuild')}")
          for case_id in sorted(required):
              print(f"{case_id}: {by_id[case_id].get('outcome')}")
          print(f"Native Markdown parity verdict: {parity['verdict']}")
          for case_id in sorted(parity_required):
              print(f"parity/{case_id}: {parity_by_id[case_id].get('outcome')}")
          PY

      - name: Upload native projection evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-projection-evidence
          path: |
            build/native-projection-probe/evidence.json
            build/native-projection-probe/parity.json
            .intellijPlatform/sandbox/**/idea.log
            ${{ runner.temp }}/markflow-native-projection-xvfb.log
          if-no-files-found: warn
