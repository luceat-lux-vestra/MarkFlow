name: Starter Driver E2E

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      target_sha:
        description: 'Exact current work-branch HEAD SHA for manual targeted validation'
        required: false
        type: string
      mode:
        description: 'Full canonical suite or bounded manual diagnostic'
        required: false
        type: choice
        options: [full, targeted]
        default: full
      target_shard:
        description: 'Manual targeted shard: canonical/core-editing/ordinary-markdown/derived-content/lifecycle/visual; validated by allowlist'
        required: false
        type: string
      target_suite:
        description: 'Optional exact allowlisted fully qualified E2E suite in target_shard'
        required: false
        type: string
      differential_case_ids:
        description: 'Optional exact comma-separated supported/comparable case IDs for manifest suite only'
        required: false
        type: string
      source_anchor_four_case_capture:
        description: '#353 diagnostic: target four Markdown source-anchor cases in derived-content (not 89-case acceptance)'
        required: false
        type: boolean
        default: false
      source_ownership_diagnostic:
        description: '#497 diagnostic: inspect pinned IDEA 2026.2.3 Preview source ownership on representative Markdown structures'
        required: false
        type: boolean
        default: false
      source_range_capture_diagnostic:
        description: '#498 diagnostic: prove exact logical source-range ownership on representative Markdown structures'
        required: false
        type: boolean
        default: false
      release_candidate_repeat:
        description: 'Run a second independent canonical full-product journey for release-candidate evidence'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: starter-driver-e2e-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  STARTER_PLATFORM_VERSION: '2026.2.3'
  STARTER_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || (github.event_name == 'workflow_dispatch' && inputs.target_sha || github.sha) }}

jobs:
  package:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Package exact Starter plugin
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    outputs:
      test_matrix: ${{ steps.selection.outputs.test_matrix }}
      targeted_case_ids: ${{ steps.selection.outputs.case_ids }}
      targeted_case_count: ${{ steps.selection.outputs.case_count }}
    steps:
      - name: Validate exact manual branch identity
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        env:
          REQUESTED_SHA: ${{ inputs.target_sha || '' }}
          DISPATCH_SHA: ${{ github.sha }}
          SELECTED_MODE: ${{ inputs.mode || 'full' }}
          RELEASE_REPEAT: ${{ inputs.release_candidate_repeat || false }}
          ANCHOR_DIAGNOSTIC: ${{ inputs.source_anchor_four_case_capture || false }}
          OWNERSHIP_DIAGNOSTIC: ${{ inputs.source_ownership_diagnostic || false }}
          RANGE_DIAGNOSTIC: ${{ inputs.source_range_capture_diagnostic || false }}
        run: |
          set -euo pipefail
          if [ -n "$REQUESTED_SHA" ]; then
            [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Invalid exact target SHA"; exit 1; }
            [ "$REQUESTED_SHA" = "$DISPATCH_SHA" ] || { echo "::error::Manual target_sha must equal the --ref branch HEAD"; exit 1; }
          fi
          if [ "$SELECTED_MODE" = "targeted" ]; then
            [ -n "$REQUESTED_SHA" ] || { echo "::error::Targeted mode requires explicit target_sha"; exit 1; }
            if [ "$RELEASE_REPEAT" = "true" ] || [ "$ANCHOR_DIAGNOSTIC" = "true" ] ||
              [ "$OWNERSHIP_DIAGNOSTIC" = "true" ] || [ "$RANGE_DIAGNOSTIC" = "true" ]; then
              echo "::error::Targeted mode cannot combine with release repeat or legacy diagnostic modes"
              exit 1
            fi
          fi

      - name: Fetch Sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.STARTER_SOURCE_SHA }}
          persist-credentials: false

      - name: Verify exact source checkout
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          [ "$actual" = "$STARTER_SOURCE_SHA" ] || {
            echo "::error::Starter package checkout drifted: expected=$STARTER_SOURCE_SHA actual=$actual"
            exit 1
          }

      - name: Validate manual selection and canonical matrix
        id: selection
        shell: bash
        env:
          SELECTED_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'full' }}
          TARGET_SHARD: ${{ github.event_name == 'workflow_dispatch' && inputs.target_shard || '' }}
          TARGET_SUITE: ${{ github.event_name == 'workflow_dispatch' && inputs.target_suite || '' }}
          TARGET_CASE_IDS: ${{ github.event_name == 'workflow_dispatch' && inputs.differential_case_ids || '' }}
        run: |
          set -euo pipefail
          python3 .github/scripts/targeted-e2e-selection.py --self-test
          python3 .github/scripts/targeted-e2e-selection.py --workflow starter             --mode "$SELECTED_MODE" --shard "$TARGET_SHARD"             --suite "$TARGET_SUITE" --case-ids "$TARGET_CASE_IDS" >> "$GITHUB_OUTPUT"

      # Only completed trusted same-SHA dispatch artifacts can be reused.
      - name: Discover reusable exact-HEAD plugin
        id: reuse_lookup
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'targeted' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 .github/scripts/targeted-e2e-artifact-reuse.py --self-test
          python3 .github/scripts/targeted-e2e-artifact-reuse.py --discover \
            --repository "$GITHUB_REPOSITORY" --source-sha "$STARTER_SOURCE_SHA" \
            --run-id "$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download reusable exact-HEAD plugin
        id: reuse_download
        if: ${{ steps.reuse_lookup.outputs.hit == 'true' }}
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ steps.reuse_lookup.outputs.artifact_name }}
          run-id: ${{ steps.reuse_lookup.outputs.run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: build/e2e-reuse

      - name: Verify and stage reusable exact-HEAD plugin
        id: reuse_verify
        if: ${{ steps.reuse_download.outcome == 'success' }}
        shell: bash
        env:
          PRODUCER: ${{ steps.reuse_lookup.outputs.producer }}
        run: |
          set -euo pipefail
          python3 .github/scripts/targeted-e2e-artifact-reuse.py --verify \
            --source-sha "$STARTER_SOURCE_SHA" \
            --platform-version "$STARTER_PLATFORM_VERSION" \
            --producer "$PRODUCER" --consumer starter \
            --input-dir build/e2e-reuse --output-dir build/e2e-package >> "$GITHUB_OUTPUT"

      - name: Setup Java
        if: ${{ steps.reuse_verify.outputs.reused != 'true' }}
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: zulu
          java-version: 25

      - name: Setup Gradle
        if: ${{ steps.reuse_verify.outputs.reused != 'true' }}
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true

      - name: Build exact plugin artifact once
        if: ${{ steps.reuse_verify.outputs.reused != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          # On a cache miss or rejected download, never upload stale partial bytes.
          rm -rf build/e2e-package
          ./gradlew buildPlugin -PplatformVersion="$STARTER_PLATFORM_VERSION" --stacktrace

          mapfile -t archives < <(find build/distributions -maxdepth 1 -type f -name '*.zip' -print | sort)
          if [ "${#archives[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one Starter plugin distribution, found ${#archives[@]}"
            printf '%s\n' "${archives[@]}"
            exit 1
          fi

          artifact="${archives[0]}"
          archive_name="$(basename "$artifact")"
          digest="$(sha256sum "$artifact" | awk '{print $1}')"

          mkdir -p build/e2e-package
          cp "$artifact" build/e2e-package/plugin.zip
          {
            echo "source_sha=$STARTER_SOURCE_SHA"
            echo "plugin_archive=$archive_name"
            echo "plugin_sha256=$digest"
            echo "platform_version=$STARTER_PLATFORM_VERSION"
            echo "scenario_sets=canonical,core-editing,ordinary-markdown,derived-content,lifecycle,visual-acceptance,full-differential-acceptance"
          } | tee build/e2e-package/manifest.txt

      - name: Upload exact Starter plugin artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: starter-driver-plugin-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: |
            build/e2e-package/plugin.zip
            build/e2e-package/manifest.txt

  shards:
    needs: [ package ]
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode != 'targeted' || inputs.target_shard != 'visual' }}
    name: Real IDE Starter Driver (${{ matrix.shard }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.package.outputs.test_matrix) }}
    steps:
      - name: Fetch Sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.STARTER_SOURCE_SHA }}
          persist-credentials: false

      - name: Verify exact source checkout
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          [ "$actual" = "$STARTER_SOURCE_SHA" ] || {
            echo "::error::Starter shard checkout drifted: expected=$STARTER_SOURCE_SHA actual=$actual"
            exit 1
          }

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: zulu
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true

      - name: Install ARM64 Skiko EGL runtime
        shell: bash
        run: |
          set -euo pipefail
          [ "$(uname -m)" = "aarch64" ] && [ "$RUNNER_ARCH" = "ARM64" ]
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1
          ldconfig -p | grep -F libEGL.so.1

      - name: Download exact Starter plugin artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: starter-driver-plugin-${{ github.run_id }}
          path: build/e2e-package

      - name: Restore and verify packaged plugin identity
        shell: bash
        env:
          STARTER_SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          manifest="build/e2e-package/manifest.txt"
          [ -f "$manifest" ] || { echo "::error::Starter package manifest missing"; exit 1; }
          [ -f build/e2e-package/plugin.zip ] || { echo "::error::Starter plugin artifact missing"; exit 1; }

          manifest_value() {
            local key="$1"
            sed -n "s/^${key}=//p" "$manifest"
          }

          source_sha="$(manifest_value source_sha)"
          archive_name="$(manifest_value plugin_archive)"
          expected_digest="$(manifest_value plugin_sha256)"
          platform_version="$(manifest_value platform_version)"
          scenario_sets="$(manifest_value scenario_sets)"

          [ "$source_sha" = "$STARTER_SOURCE_SHA" ] || {
            echo "::error::Starter artifact source drifted: expected=$STARTER_SOURCE_SHA actual=$source_sha"
            exit 1
          }
          [ "$platform_version" = "$STARTER_PLATFORM_VERSION" ] || {
            echo "::error::Starter artifact platform drifted: expected=$STARTER_PLATFORM_VERSION actual=$platform_version"
            exit 1
          }
          [[ "$scenario_sets" == *"$STARTER_SHARD"* ]] || {
            echo "::error::Starter artifact manifest does not declare shard $STARTER_SHARD"
            exit 1
          }
          [[ "$expected_digest" =~ ^[0-9a-f]{64}$ ]] || {
            echo "::error::Starter artifact digest is malformed"
            exit 1
          }
          actual_digest="$(sha256sum build/e2e-package/plugin.zip | awk '{print $1}')"
          [ "$actual_digest" = "$expected_digest" ] || {
            echo "::error::Downloaded Starter artifact digest mismatch"
            exit 1
          }

          mkdir -p build/distributions
          cp build/e2e-package/plugin.zip "build/distributions/$archive_name"
          echo "E2E_PLUGIN_PATH=build/distributions/$archive_name" >> "$GITHUB_ENV"
          echo "E2E_PLUGIN_SHA256=$expected_digest" >> "$GITHUB_ENV"

      - name: Install pinned sandboxed JCEF AppArmor profile (derived-content only)
        if: matrix.shard == 'derived-content'
        shell: bash
        env:
          STARTER_SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          bash .github/scripts/install-starter-jcef-apparmor.sh --self-test
          bash .github/scripts/install-starter-jcef-apparmor.sh

      - name: Start virtual display
        shell: bash
        run: |
          set -euo pipefail
          Xvfb :99 -screen 0 1920x1080x24 >"$RUNNER_TEMP/markflow-starter-driver-xvfb.log" 2>&1 &
          printf 'DISPLAY=:99\n' >> "$GITHUB_ENV"

      - name: Run stable Starter Driver shard
        shell: bash
        env:
          STARTER_SHARD: ${{ matrix.shard }}
          STARTER_SUITES: ${{ matrix.suites }}
          TARGETED_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'full' }}
          TARGETED_CASE_IDS: ${{ needs.package.outputs.targeted_case_ids }}
          TARGETED_CASE_COUNT: ${{ needs.package.outputs.targeted_case_count }}
          SOURCE_ANCHOR_FOUR_CASE_CAPTURE: ${{ github.event_name == 'workflow_dispatch' && inputs.source_anchor_four_case_capture && 'true' || 'false' }}
          SOURCE_OWNERSHIP_DIAGNOSTIC: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ownership_diagnostic && 'true' || 'false' }}
          SOURCE_RANGE_CAPTURE_DIAGNOSTIC: ${{ github.event_name == 'workflow_dispatch' && inputs.source_range_capture_diagnostic && 'true' || 'false' }}
        run: |
          set -euo pipefail
          python3 .github/scripts/check-starter-driver-diagnostics.py --self-test

          pass_dir="build/e2e-evidence/$STARTER_SHARD"
          marker="$RUNNER_TEMP/markflow-starter-$STARTER_SHARD-start"
          rm -rf "$pass_dir" build/test-results/integrationTest build/reports/tests/integrationTest
          mkdir -p "$pass_dir"
          touch "$marker"

          IFS='|' read -r -a suites <<< "$STARTER_SUITES"
          diagnostic_count=0
          [[ "$SOURCE_ANCHOR_FOUR_CASE_CAPTURE" == "true" ]] && diagnostic_count=$((diagnostic_count + 1))
          [[ "$SOURCE_OWNERSHIP_DIAGNOSTIC" == "true" ]] && diagnostic_count=$((diagnostic_count + 1))
          [[ "$SOURCE_RANGE_CAPTURE_DIAGNOSTIC" == "true" ]] && diagnostic_count=$((diagnostic_count + 1))
          if (( diagnostic_count > 1 )); then
            echo "::error::#353/#497/#498 targeted diagnostic modes are mutually exclusive"
            exit 1
          fi
          gradle_args=(
            integrationTest
            -x buildPlugin
            -PplatformVersion="$STARTER_PLATFORM_VERSION"
            -PstarterPackagedPlugin=true
            --stacktrace
          )
          if [[ "$SOURCE_ANCHOR_FOUR_CASE_CAPTURE" == "true" && "$STARTER_SHARD" == "derived-content" ]]; then
            # Diagnostic only: the default PR/CI suite and full 89-case
            # acceptance contract are unchanged. Select only the four reviewed
            # source-anchor gaps, using the already-supported Gradle property.
            suites=(com.algorist.markflow.e2e.MarkFlowStarterDifferentialManifestTest)
            STARTER_SUITES="${suites[0]}"
            gradle_args+=(
              -PdifferentialContract=capture
              "-PdifferentialCaseIds=md-blockquote,md-task-list,md-table-basic,md-autolink"
            )
            printf '%s\n' \
              'schema=markflow-353-source-anchor-four-case-capture/v1' \
              "source_head=$STARTER_SOURCE_SHA" \
              'case_ids=md-blockquote,md-task-list,md-table-basic,md-autolink' \
              'mode=CAPTURED_UNVERIFIED_NOT_89_CASE_ACCEPTANCE' \
              > "$pass_dir/source-anchor-capture.txt"
            echo "::notice::#353 targeted four-case capture; independent paired review still required"
          fi
          if [[ "$SOURCE_OWNERSHIP_DIAGNOSTIC" == "true" && "$STARTER_SHARD" == "derived-content" ]]; then
            # #497 evidence-only probe for the exact pinned IDEA 2026.2.3 runtime.
            # This does not apply #353 source-anchor acceptance assertions and
            # must never substitute for the 89-case acceptance workflow.
            suites=(com.algorist.markflow.e2e.MarkFlowStarterDifferentialManifestTest)
            STARTER_SUITES="${suites[0]}"
            ownership_case_ids='md-atx-headings-h1-h6,md-paragraph,md-unordered-list,md-ordered-list,md-nested-list,md-task-list,md-blockquote,md-table-basic,md-autolink,md-fenced-backtick'
            gradle_args+=(
              -PdifferentialContract=capture
              -PdifferentialSourceOwnershipDiagnostic=true
              "-PdifferentialCaseIds=$ownership_case_ids"
            )
            printf '%s\n' \
              'schema=markflow-497-source-ownership-diagnostic/v1' \
              "source_head=$STARTER_SOURCE_SHA" \
              'platform_release=2026.2.3' \
              'platform_build=262.10968.63' \
              'intellij_source_tag=idea/2026.2.3' \
              'intellij_source_commit=8062c061ff33e22041d9f1844db5b8b8a6b5e4d7' \
              "case_ids=$ownership_case_ids" \
              'mode=EVIDENCE_ONLY_NOT_ACCEPTANCE' \
              > "$pass_dir/source-ownership-diagnostic.txt"
            echo "::notice::#497 pinned-runtime source-ownership diagnostic; no acceptance verdict"
          fi
          if [[ "$SOURCE_RANGE_CAPTURE_DIAGNOSTIC" == "true" && "$STARTER_SHARD" == "derived-content" ]]; then
            # #498 bounded candidate: source identity is an exact logical source range.
            # This bypasses Preview scrollToLine's visual-line coordinate contract and
            # validates source-equivalent md-src-pos ownership cohorts only.
            suites=(com.algorist.markflow.e2e.MarkFlowStarterDifferentialManifestTest)
            STARTER_SUITES="${suites[0]}"
            source_range_case_ids='md-atx-headings-h1-h6,md-paragraph,md-unordered-list,md-ordered-list,md-nested-list,md-task-list,md-blockquote,md-table-basic,md-autolink,md-fenced-backtick'
            gradle_args+=(
              -PdifferentialContract=capture
              -PdifferentialSourceRangeCaptureDiagnostic=true
              "-PdifferentialCaseIds=$source_range_case_ids"
            )
            printf '%s\n' \
              'schema=markflow-498-source-range-capture-diagnostic/v1' \
              "source_head=$STARTER_SOURCE_SHA" \
              "case_ids=$source_range_case_ids" \
              'ownership=EXACT_LOGICAL_RANGE_SOURCE_EQUIVALENT_COHORT' \
              'whole_document_scroll_proof=OUT_OF_SCOPE' \
              'mode=EVIDENCE_ONLY_NOT_ACCEPTANCE' \
              > "$pass_dir/source-range-capture-diagnostic.txt"
            echo "::notice::#498 exact logical source-range capture diagnostic; no acceptance verdict"
          fi
          diagnostics_args=()
          for suite in "${suites[@]}"; do
            gradle_args+=(--tests "$suite")
            diagnostics_args+=(--required-suite "$suite")
          done

          if [ -n "$TARGETED_CASE_IDS" ]; then
            gradle_args+=("-PdifferentialContract=capture" "-PdifferentialCaseIds=$TARGETED_CASE_IDS")
          fi

          test_status=0
          set +e
          timeout --signal=TERM --kill-after=30s 24m ./gradlew "${gradle_args[@]}"
          test_status=$?
          set -e

          if [ -d build/test-results/integrationTest ]; then
            cp -R build/test-results/integrationTest "$pass_dir/test-results"
          fi
          if [ -d build/reports/tests/integrationTest ]; then
            cp -R build/reports/tests/integrationTest "$pass_dir/test-report"
          fi

          while IFS= read -r -d '' log; do
            log_dir="$(dirname "$log")"
            relative="${log_dir#./}"
            destination="$pass_dir/logs/$relative"
            mkdir -p "$(dirname "$destination")"
            rm -rf "$destination"
            cp -R "$log_dir" "$destination"
          done < <(
            find out/ide-tests build/idea-sandbox .intellijPlatform/sandbox \
              -type f -name idea.log -newer "$marker" -print0 2>/dev/null || true
          )

          diagnostics_status=0
          set +e
          python3 .github/scripts/check-starter-driver-diagnostics.py \
            --root "$pass_dir" \
            --output "$pass_dir/diagnostics.json" \
            "${diagnostics_args[@]}"
          diagnostics_status=$?
          set -e

          actual_digest="$(sha256sum "$E2E_PLUGIN_PATH" | awk '{print $1}')"
          [ "$actual_digest" = "$E2E_PLUGIN_SHA256" ] || {
            echo "::error::Starter shard mutated the packaged plugin artifact"
            exit 1
          }
          cp build/e2e-package/manifest.txt "$pass_dir/package-manifest.txt"
          printf 'shard=%s\nsuites=%s\n' "$STARTER_SHARD" "$STARTER_SUITES" > "$pass_dir/shard.txt"

          if [ "$test_status" -ne 0 ]; then
            echo "Starter/Driver shard $STARTER_SHARD failed with status $test_status" >&2
            exit "$test_status"
          fi
          if [ "$diagnostics_status" -ne 0 ]; then
            echo "Starter/Driver shard $STARTER_SHARD diagnostics failed" >&2
            exit "$diagnostics_status"
          fi

          if [ -n "$TARGETED_CASE_IDS" ]; then
            jq -e --arg sha "$STARTER_SOURCE_SHA" --argjson count "$TARGETED_CASE_COUNT" '
              .schema == "markflow-stage-d-capture/v1" and
              .source_head == $sha and
              .expanded_cases == 89 and
              .selected_cases == $count and
              .captured_unverified == $count and
              .capture_failed == 0 and
              .not_executed == (89 - $count) and
              .candidate_structural_failure_count == 0 and
              .capture_contract == "capture" and
              .full_differential_acceptance == false and
              .release_eligible == false
            ' "$pass_dir/differential-manifest/summary.json" >/dev/null || {
              echo "::error::Targeted Starter differential selection was not completely executed"
              exit 1
            }
          fi
          if [ "$TARGETED_MODE" = "targeted" ]; then
            printf 'status=TARGETED_E2E_PASS\nsource_sha=%s\nrun_id=%s\nrun_attempt=%s\nshard=%s\nsuites=%s\ncase_ids=%s\ncase_count=%s\nplugin_sha256=%s\n'               "$STARTER_SOURCE_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"               "$STARTER_SHARD" "$STARTER_SUITES" "$TARGETED_CASE_IDS"               "$TARGETED_CASE_COUNT" "$E2E_PLUGIN_SHA256" > "$pass_dir/targeted-result.txt"
          fi

      - name: Upload shard diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: starter-driver-e2e-${{ matrix.shard }}-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            build/e2e-evidence/**
            build/test-results/integrationTest/**
            build/reports/tests/integrationTest/**
            build/e2e-package/manifest.txt
            out/ide-tests/**/log/**
            build/idea-sandbox/**/log/idea.log
            ${{ runner.temp }}/markflow-starter-driver-xvfb.log




  visual:
    needs: [ package ]
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode != 'targeted' || inputs.target_shard == 'visual' }}
    name: Deterministic Visual Acceptance
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - name: Fetch Sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.STARTER_SOURCE_SHA }}
          persist-credentials: false

      - name: Verify exact source checkout
        shell: bash
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$STARTER_SOURCE_SHA" ] || {
            echo "::error::Visual checkout drifted from exact candidate"
            exit 1
          }

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: zulu
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true

      - name: Download exact Starter plugin artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: starter-driver-plugin-${{ github.run_id }}
          path: build/e2e-package

      - name: Restore and verify packaged plugin identity
        shell: bash
        run: |
          set -euo pipefail
          manifest="build/e2e-package/manifest.txt"
          source_sha="$(sed -n 's/^source_sha=//p' "$manifest")"
          archive_name="$(sed -n 's/^plugin_archive=//p' "$manifest")"
          expected_digest="$(sed -n 's/^plugin_sha256=//p' "$manifest")"
          platform_version="$(sed -n 's/^platform_version=//p' "$manifest")"
          scenario_sets="$(sed -n 's/^scenario_sets=//p' "$manifest")"

          [ "$source_sha" = "$STARTER_SOURCE_SHA" ]
          [ "$platform_version" = "$STARTER_PLATFORM_VERSION" ]
          [[ "$scenario_sets" == *"visual-acceptance"* ]] || {
            echo "::error::Exact package manifest does not declare visual acceptance"
            exit 1
          }
          [ "$(sha256sum build/e2e-package/plugin.zip | awk '{print $1}')" = "$expected_digest" ]

          mkdir -p build/distributions
          cp build/e2e-package/plugin.zip "build/distributions/$archive_name"
          echo "E2E_PLUGIN_PATH=build/distributions/$archive_name" >> "$GITHUB_ENV"
          echo "E2E_PLUGIN_SHA256=$expected_digest" >> "$GITHUB_ENV"

      # #362: Preserve the x64-reviewed strict raster oracle on ARM64.
      - name: Install pinned ARM64 visual EGL and Liberation Sans
        shell: bash
        run: |
          set -euo pipefail
          if ! { [ "$RUNNER_OS" = Linux ] && [ "$RUNNER_ARCH" = ARM64 ] && [ "$(uname -m)" = aarch64 ]; }; then
            echo "::error::Visual acceptance requires actual ARM64"
            exit 1
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 fonts-liberation
          ldconfig -p | grep -F libEGL.so.1
          fc-cache -f
          resolved="$(fc-match -f '%{family}|%{style}|%{file}' Arial)"
          IFS='|' read -r resolved_family resolved_style resolved_path <<< "$resolved"
          if ! { [ "$resolved_family" = 'Liberation Sans' ] && [ "$resolved_style" = 'Regular' ]; }; then
            echo "::error::Visual Arial fallback is not pinned Liberation Sans: $resolved"
            exit 1
          fi
          [ -f "$resolved_path" ] || { echo "::error::Resolved Arial font missing"; exit 1; }
          actual_sha="$(sha256sum "$resolved_path" | awk '{print $1}')"
          expected_sha=4659bc0c58c5028dd488ec928d41d9265db43d9b669fc14ca8b0832daca7b144
          [ "$actual_sha" = "$expected_sha" ] || {
            echo "::error::Arial font file differs from x64/ARM paired evidence"
            exit 1
          }
          mkdir -p build/e2e-package
          {
            echo "source_sha=$STARTER_SOURCE_SHA"
            echo "platform_version=$STARTER_PLATFORM_VERSION"
            echo "runner_arch=$RUNNER_ARCH"
            echo "runner_uname=$(uname -m)"
            echo "runner_image=${ImageOS:-unknown}/${ImageVersion:-unknown}"
            echo "fontconfig_version=$(fc-match --version 2>&1)"
            echo "arial_family=$resolved_family"
            echo "arial_style=$resolved_style"
            echo "arial_file=$resolved_path"
            echo "arial_sha256=$actual_sha"
            echo "native_egl_confirmed=true"
          } | tee build/e2e-package/visual-font-provenance.txt

      - name: Start pinned visual display
        shell: bash
        run: |
          set -euo pipefail
          Xvfb :99 -screen 0 1920x1080x24 -dpi 96 >"$RUNNER_TEMP/markflow-visual-xvfb.log" 2>&1 &
          printf 'DISPLAY=:99\n' >> "$GITHUB_ENV"

      - name: Run deterministic representative visual acceptance
        shell: bash
        run: |
          set -euo pipefail
          suite="com.algorist.markflow.e2e.MarkFlowStarterVisualAcceptanceTest"
          rm -rf build/visual-acceptance build/test-results/integrationTest build/reports/tests/integrationTest

          test_status=0
          set +e
          timeout --signal=TERM --kill-after=30s 24m \
            ./gradlew integrationTest -x buildPlugin \
              -PplatformVersion="$STARTER_PLATFORM_VERSION" -PstarterPackagedPlugin=true \
              --stacktrace --tests "$suite"
          test_status=$?
          set -e

          actual_digest="$(sha256sum "$E2E_PLUGIN_PATH" | awk '{print $1}')"
          [ "$actual_digest" = "$E2E_PLUGIN_SHA256" ] || {
            echo "::error::Visual acceptance mutated the packaged plugin artifact"
            exit 1
          }
          mkdir -p build/visual-acceptance
          cp build/e2e-package/manifest.txt build/visual-acceptance/package-manifest.txt

          [ "$test_status" -eq 0 ] || exit "$test_status"

      - name: Upload visual diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: starter-driver-visual-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            build/visual-acceptance/**
            build/test-results/integrationTest/**
            build/reports/tests/integrationTest/**
            build/e2e-package/manifest.txt
            build/e2e-package/visual-font-provenance.txt
            out/ide-tests/**/log/**
            build/idea-sandbox/**/log/idea.log
            ${{ runner.temp }}/markflow-visual-xvfb.log

  visual-gate:
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (github.event_name != 'workflow_dispatch' || inputs.mode != 'targeted') }}
    needs: [ package, visual ]
    name: Deterministic Visual Acceptance Gate
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - name: Require exact package and visual oracle
        shell: bash
        env:
          PACKAGE_RESULT: ${{ needs.package.result }}
          VISUAL_RESULT: ${{ needs.visual.result }}
        run: |
          set -euo pipefail
          [ "$PACKAGE_RESULT" = "success" ] || {
            echo "::error::Exact Starter package job result: $PACKAGE_RESULT"
            exit 1
          }
          [ "$VISUAL_RESULT" = "success" ] || {
            echo "::error::Deterministic visual acceptance result: $VISUAL_RESULT"
            exit 1
          }

  release-candidate-repeat:
    if: github.event_name == 'workflow_dispatch' && inputs.release_candidate_repeat
    needs: [ package ]
    name: Release candidate canonical repeat
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - name: Fetch Sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.STARTER_SOURCE_SHA }}
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: zulu
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true

      - name: Install ARM64 Skiko EGL runtime
        shell: bash
        run: |
          set -euo pipefail
          [ "$(uname -m)" = "aarch64" ] && [ "$RUNNER_ARCH" = "ARM64" ]
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1
          ldconfig -p | grep -F libEGL.so.1

      - name: Download exact Starter plugin artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: starter-driver-plugin-${{ github.run_id }}
          path: build/e2e-package

      - name: Restore and verify packaged plugin identity
        shell: bash
        run: |
          set -euo pipefail
          manifest="build/e2e-package/manifest.txt"
          source_sha="$(sed -n 's/^source_sha=//p' "$manifest")"
          archive_name="$(sed -n 's/^plugin_archive=//p' "$manifest")"
          expected_digest="$(sed -n 's/^plugin_sha256=//p' "$manifest")"
          platform_version="$(sed -n 's/^platform_version=//p' "$manifest")"

          [ "$(git rev-parse HEAD)" = "$STARTER_SOURCE_SHA" ]
          [ "$source_sha" = "$STARTER_SOURCE_SHA" ]
          [ "$platform_version" = "$STARTER_PLATFORM_VERSION" ]
          [ "$(sha256sum build/e2e-package/plugin.zip | awk '{print $1}')" = "$expected_digest" ]

          mkdir -p build/distributions
          cp build/e2e-package/plugin.zip "build/distributions/$archive_name"
          echo "E2E_PLUGIN_PATH=build/distributions/$archive_name" >> "$GITHUB_ENV"
          echo "E2E_PLUGIN_SHA256=$expected_digest" >> "$GITHUB_ENV"

      - name: Start virtual display
        shell: bash
        run: |
          set -euo pipefail
          Xvfb :99 -screen 0 1920x1080x24 >"$RUNNER_TEMP/markflow-starter-driver-repeat-xvfb.log" 2>&1 &
          printf 'DISPLAY=:99\n' >> "$GITHUB_ENV"

      - name: Run independent canonical repeat
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/check-starter-driver-diagnostics.py --self-test
          suite="com.algorist.markflow.e2e.MarkFlowStarterFullProductJourneyTest"
          pass_dir="build/e2e-evidence/release-candidate-repeat"
          marker="$RUNNER_TEMP/markflow-starter-repeat-start"
          rm -rf "$pass_dir" build/test-results/integrationTest build/reports/tests/integrationTest
          mkdir -p "$pass_dir"
          touch "$marker"

          test_status=0
          set +e
          timeout --signal=TERM --kill-after=30s 24m \
            ./gradlew integrationTest -x buildPlugin \
              -PplatformVersion="$STARTER_PLATFORM_VERSION" --stacktrace --tests "$suite"
          test_status=$?
          set -e

          if [ -d build/test-results/integrationTest ]; then
            cp -R build/test-results/integrationTest "$pass_dir/test-results"
          fi
          if [ -d build/reports/tests/integrationTest ]; then
            cp -R build/reports/tests/integrationTest "$pass_dir/test-report"
          fi
          while IFS= read -r -d '' log; do
            log_dir="$(dirname "$log")"
            relative="${log_dir#./}"
            destination="$pass_dir/logs/$relative"
            mkdir -p "$(dirname "$destination")"
            rm -rf "$destination"
            cp -R "$log_dir" "$destination"
          done < <(
            find out/ide-tests build/idea-sandbox .intellijPlatform/sandbox \
              -type f -name idea.log -newer "$marker" -print0 2>/dev/null || true
          )

          diagnostics_status=0
          set +e
          python3 .github/scripts/check-starter-driver-diagnostics.py \
            --root "$pass_dir" \
            --output "$pass_dir/diagnostics.json" \
            --required-suite "$suite"
          diagnostics_status=$?
          set -e

          [ "$(sha256sum "$E2E_PLUGIN_PATH" | awk '{print $1}')" = "$E2E_PLUGIN_SHA256" ] || {
            echo "::error::Canonical repeat mutated the packaged plugin artifact"
            exit 1
          }
          cp build/e2e-package/manifest.txt "$pass_dir/package-manifest.txt"

          [ "$test_status" -eq 0 ] || exit "$test_status"
          [ "$diagnostics_status" -eq 0 ] || exit "$diagnostics_status"

      - name: Upload repeat diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: starter-driver-e2e-release-candidate-repeat-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            build/e2e-evidence/**
            build/test-results/integrationTest/**
            build/reports/tests/integrationTest/**
            build/e2e-package/manifest.txt
            out/ide-tests/**/log/**
            build/idea-sandbox/**/log/idea.log
            ${{ runner.temp }}/markflow-starter-driver-repeat-xvfb.log

  gate:
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (github.event_name != 'workflow_dispatch' || inputs.mode != 'targeted') }}
    needs: [ package, shards ]
    name: Starter Driver E2E Gate
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - name: Require package and every stable shard
        shell: bash
        env:
          PACKAGE_RESULT: ${{ needs.package.result }}
          SHARDS_RESULT: ${{ needs.shards.result }}
        run: |
          set -euo pipefail
          [ "$PACKAGE_RESULT" = "success" ] || {
            echo "::error::Exact Starter package job result: $PACKAGE_RESULT"
            exit 1
          }
          [ "$SHARDS_RESULT" = "success" ] || {
            echo "::error::Stable Starter shard result: $SHARDS_RESULT"
            exit 1
          }

  targeted-gate:
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.mode == 'targeted' }}
    needs: [ package, shards, visual ]
    name: Targeted E2E Diagnostic Gate
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - name: Require exactly selected diagnostic evidence
        shell: bash
        env:
          SELECTED_SHARD: ${{ inputs.target_shard }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          SHARDS_RESULT: ${{ needs.shards.result }}
          VISUAL_RESULT: ${{ needs.visual.result }}
        run: |
          set -euo pipefail
          [ "$PACKAGE_RESULT" = success ] || exit 1
          if [ "$SELECTED_SHARD" = visual ]; then
            [ "$VISUAL_RESULT" = success ] && [ "$SHARDS_RESULT" = skipped ] || exit 1
          else
            [ "$SHARDS_RESULT" = success ] && [ "$VISUAL_RESULT" = skipped ] || exit 1
          fi
          echo "TARGETED_E2E_PASS — diagnostic only, not the canonical Starter Driver E2E Gate" >> "$GITHUB_STEP_SUMMARY"
