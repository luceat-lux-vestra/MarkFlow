name: Starter Driver E2E

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/starter-driver-e2e.yml'
      - '.github/scripts/check-starter-driver-diagnostics.py'
      - 'build.gradle.kts'
      - 'gradle/libs.versions.toml'
      - 'webview/package.json'
      - 'webview/package-lock.json'
      - 'src/integrationTest/**'
      - 'src/main/**'
  pull_request:
    paths:
      - '.github/workflows/starter-driver-e2e.yml'
      - '.github/scripts/check-starter-driver-diagnostics.py'
      - 'build.gradle.kts'
      - 'gradle/libs.versions.toml'
      - 'webview/package.json'
      - 'webview/package-lock.json'
      - 'src/integrationTest/**'
      - 'src/main/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: starter-driver-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Real IDE Starter Driver (${{ matrix.id }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: idea-2026.2.3
            platform_version: 2026.2.3
            repeat_count: 2
          - id: idea-2026.3-eap2
            platform_version: 263.4732.28
            repeat_count: 1
    steps:
      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          tool-cache: false
          large-packages: false

      - name: Fetch Sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: zulu
          java-version: 25

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: webview/package-lock.json

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: true

      - name: Start virtual display
        shell: bash
        run: |
          set -euo pipefail
          Xvfb :99 -screen 0 1920x1080x24 >"$RUNNER_TEMP/markflow-starter-driver-xvfb.log" 2>&1 &
          printf 'DISPLAY=:99\n' >> "$GITHUB_ENV"

      - name: Run Starter Driver E2E acceptance
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/check-starter-driver-diagnostics.py --self-test

          for pass in $(seq 1 "${{ matrix.repeat_count }}"); do
            echo "Starter/Driver pass $pass/${{ matrix.repeat_count }} on ${{ matrix.platform_version }}"
            pass_dir="build/e2e-evidence/pass-$pass"
            marker="$RUNNER_TEMP/markflow-starter-pass-$pass-start"
            rm -rf "$pass_dir" build/test-results/integrationTest build/reports/tests/integrationTest
            mkdir -p "$pass_dir"
            touch "$marker"

            test_status=0
            set +e
            timeout --signal=TERM --kill-after=30s 18m \
              ./gradlew integrationTest --rerun-tasks -PplatformVersion="${{ matrix.platform_version }}" --stacktrace
            test_status=$?
            set -e

            if [ -d build/test-results/integrationTest ]; then
              cp -R build/test-results/integrationTest "$pass_dir/test-results"
            fi
            if [ -d build/reports/tests/integrationTest ]; then
              cp -R build/reports/tests/integrationTest "$pass_dir/test-report"
            fi

            while IFS= read -r -d '' log; do
              log_dir="$(dirname "$log")"
              relative="${log_dir#./}"
              destination="$pass_dir/logs/$relative"
              mkdir -p "$(dirname "$destination")"
              rm -rf "$destination"
              cp -R "$log_dir" "$destination"
            done < <(
              find out/ide-tests build/idea-sandbox .intellijPlatform/sandbox \
                -type f -name idea.log -newer "$marker" -print0 2>/dev/null || true
            )

            diagnostics_status=0
            set +e
            python3 .github/scripts/check-starter-driver-diagnostics.py \
              --root "$pass_dir" \
              --output "$pass_dir/diagnostics.json"
            diagnostics_status=$?
            set -e

            if [ "$test_status" -ne 0 ]; then
              echo "Starter/Driver pass $pass failed with status $test_status" >&2
              exit "$test_status"
            fi
            if [ "$diagnostics_status" -ne 0 ]; then
              echo "Starter/Driver pass $pass diagnostics failed" >&2
              exit "$diagnostics_status"
            fi
          done

      - name: Upload E2E diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: starter-driver-e2e-${{ matrix.id }}-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            build/e2e-evidence/**
            build/test-results/integrationTest/**
            build/reports/tests/integrationTest/**
            out/ide-tests/**/log/**
            build/idea-sandbox/**/log/idea.log
            ${{ runner.temp }}/markflow-starter-driver-xvfb.log
