name: Starter Driver E2E

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/starter-driver-e2e.yml'
      - 'build.gradle.kts'
      - 'gradle/libs.versions.toml'
      - 'src/integrationTest/**'
      - 'src/main/**'
  pull_request:
    paths:
      - '.github/workflows/starter-driver-e2e.yml'
      - 'build.gradle.kts'
      - 'gradle/libs.versions.toml'
      - 'src/integrationTest/**'
      - 'src/main/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: starter-driver-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Real IDE Starter Driver smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          large-packages: false

      - name: Fetch Sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: zulu
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: true

      - name: Start virtual display
        shell: bash
        run: |
          set -euo pipefail
          Xvfb :99 -screen 0 1920x1080x24 >"$RUNNER_TEMP/markflow-starter-driver-xvfb.log" 2>&1 &
          printf 'DISPLAY=:99\n' >> "$GITHUB_ENV"

      - name: Run Starter Driver E2E smoke
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 18m ./gradlew integrationTest --stacktrace

      - name: Validate Starter Driver diagnostics
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/check-starter-driver-diagnostics.py --self-test
          python3 .github/scripts/check-starter-driver-diagnostics.py \
            --root . \
            --output build/starter-driver-diagnostics.json

      - name: Upload E2E diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: starter-driver-e2e-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            build/test-results/integrationTest/**
            build/reports/tests/integrationTest/**
            build/starter-driver-diagnostics.json
            out/ide-tests/**/log/**
            build/idea-sandbox/**/log/idea.log
            ${{ runner.temp }}/markflow-starter-driver-xvfb.log
