name: Starter Driver E2E

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      release_candidate_repeat:
        description: 'Run a second independent canonical full-product journey for release-candidate evidence'
        required: false
        type: boolean
        default: false
      jcef_controlled_corpus_close_mode:
        description: 'Manual full 89-case controlled corpus close mode (#353)'
        required: false
        type: choice
        options:
          - disabled
          - async
          - sync
          - router_cleanup
        default: disabled
      jcef_lifecycle_stress:
        description: 'Manually run bundled JCEF lifecycle diagnostic (#353); not part of PR CI'
        required: false
        type: boolean
        default: false
      jcef_lifecycle_sync_compare:
        description: 'Manual two-cycle async/sync native close A/B (controlled_provider, remote, OSR, preflight_2)'
        required: false
        type: boolean
        default: false
      jcef_lifecycle_dom_stress:
        description: 'Also run controlled-provider DOM-query 50-cycle diagnostic (requires controlled_provider, remote, OSR, stress_50)'
        required: false
        type: boolean
        default: false
      jcef_lifecycle_iteration_mode:
        description: 'stress_50 retains original full stress; preflight_2 diagnoses direct_split first two opens only'
        required: false
        type: choice
        options:
          - stress_50
          - preflight_2
        default: stress_50
      jcef_lifecycle_render_mode:
        description: 'Diagnostic rendering: OSR default or windowed alternative'
        required: false
        type: choice
        options:
          - osr
          - windowed
        default: osr
      jcef_lifecycle_execution_mode:
        description: 'Diagnostic JCEF process mode: real IDE default Remote or in-process alternative'
        required: false
        type: choice
        options:
          - remote
          - in_process
        default: remote
      jcef_lifecycle_open_mode:
        description: 'Diagnostic editor path or test-only controlled bundled JCEF provider'
        required: false
        type: choice
        options:
          - editor_only_roundtrip
          - direct_split
          - direct_split_eager_create
          - hidden_attach_then_split
          - controlled_provider
        default: editor_only_roundtrip

permissions:
  contents: read

concurrency:
  group: starter-driver-e2e-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  STARTER_PLATFORM_VERSION: '2026.2.3'
  STARTER_SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  package:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Package exact Starter plugin
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Fetch Sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.STARTER_SOURCE_SHA }}
          persist-credentials: false

      - name: Verify exact source checkout
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          [ "$actual" = "$STARTER_SOURCE_SHA" ] || {
            echo "::error::Starter package checkout drifted: expected=$STARTER_SOURCE_SHA actual=$actual"
            exit 1
          }

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: zulu
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      - name: Build exact plugin artifact once
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew buildPlugin -PplatformVersion="$STARTER_PLATFORM_VERSION" --stacktrace

          mapfile -t archives < <(find build/distributions -maxdepth 1 -type f -name '*.zip' -print | sort)
          if [ "${#archives[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one Starter plugin distribution, found ${#archives[@]}"
            printf '%s\n' "${archives[@]}"
            exit 1
          fi

          artifact="${archives[0]}"
          archive_name="$(basename "$artifact")"
          digest="$(sha256sum "$artifact" | awk '{print $1}')"

          mkdir -p build/e2e-package
          cp "$artifact" build/e2e-package/plugin.zip
          {
            echo "source_sha=$STARTER_SOURCE_SHA"
            echo "plugin_archive=$archive_name"
            echo "plugin_sha256=$digest"
            echo "platform_version=$STARTER_PLATFORM_VERSION"
            echo "scenario_sets=canonical,core-editing,ordinary-markdown,derived-content,lifecycle,visual-acceptance,full-differential-acceptance,jcef-lifecycle-stress,jcef-manifest-one"
          } | tee build/e2e-package/manifest.txt

      - name: Upload exact Starter plugin artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: starter-driver-plugin-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: |
            build/e2e-package/plugin.zip
            build/e2e-package/manifest.txt

  shards:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.jcef_lifecycle_stress }}
    needs: [ package ]
    name: Real IDE Starter Driver (${{ matrix.shard }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: canonical
            runner: ubuntu-24.04-arm
            suites: com.algorist.markflow.e2e.MarkFlowStarterFullProductJourneyTest
          - shard: core-editing
            runner: ubuntu-24.04-arm
            suites: com.algorist.markflow.e2e.MarkFlowStarterSmokeTest
          - shard: ordinary-markdown
            runner: ubuntu-24.04-arm
            suites: com.algorist.markflow.e2e.MarkFlowStarterTableTest|com.algorist.markflow.e2e.MarkFlowStarterTaskListTest|com.algorist.markflow.e2e.MarkFlowStarterListIndentTest
          - shard: derived-content
            runner: ubuntu-24.04
            suites: com.algorist.markflow.e2e.MarkFlowStarterProductionWiringTest|com.algorist.markflow.e2e.MarkFlowStarterDifferentialPreviewSmokeTest|com.algorist.markflow.e2e.MarkFlowStarterDifferentialManifestTest|com.algorist.markflow.e2e.MarkFlowStarterHeadingRobotTest
          - shard: lifecycle
            runner: ubuntu-24.04-arm
            suites: com.algorist.markflow.e2e.MarkFlowStarterSplitEditorTest|com.algorist.markflow.e2e.MarkFlowStarterDegradedPathTest
    steps:
      - name: Fetch Sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.STARTER_SOURCE_SHA }}
          persist-credentials: false

      - name: Verify exact source checkout
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          [ "$actual" = "$STARTER_SOURCE_SHA" ] || {
            echo "::error::Starter shard checkout drifted: expected=$STARTER_SOURCE_SHA actual=$actual"
            exit 1
          }

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: zulu
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      - name: Install ARM64 Skiko EGL runtime
        shell: bash
        run: |
          set -euo pipefail
          [ "$(uname -m)" = "aarch64" ] && [ "$RUNNER_ARCH" = "ARM64" ]
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1
          ldconfig -p | grep -F libEGL.so.1

      - name: Download exact Starter plugin artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: starter-driver-plugin-${{ github.run_id }}
          path: build/e2e-package

      - name: Restore and verify packaged plugin identity
        shell: bash
        run: |
          set -euo pipefail
          manifest="build/e2e-package/manifest.txt"
          [ -f "$manifest" ] || { echo "::error::Starter package manifest missing"; exit 1; }
          [ -f build/e2e-package/plugin.zip ] || { echo "::error::Starter plugin artifact missing"; exit 1; }

          manifest_value() {
            local key="$1"
            sed -n "s/^${key}=//p" "$manifest"
          }

          source_sha="$(manifest_value source_sha)"
          archive_name="$(manifest_value plugin_archive)"
          expected_digest="$(manifest_value plugin_sha256)"
          platform_version="$(manifest_value platform_version)"
          scenario_sets="$(manifest_value scenario_sets)"

          [ "$source_sha" = "$STARTER_SOURCE_SHA" ] || {
            echo "::error::Starter artifact source drifted: expected=$STARTER_SOURCE_SHA actual=$source_sha"
            exit 1
          }
          [ "$platform_version" = "$STARTER_PLATFORM_VERSION" ] || {
            echo "::error::Starter artifact platform drifted: expected=$STARTER_PLATFORM_VERSION actual=$platform_version"
            exit 1
          }
          [[ "$scenario_sets" == *"${{ matrix.shard }}"* ]] || {
            echo "::error::Starter artifact manifest does not declare shard ${{ matrix.shard }}"
            exit 1
          }
          [[ "$expected_digest" =~ ^[0-9a-f]{64}$ ]] || {
            echo "::error::Starter artifact digest is malformed"
            exit 1
          }
          actual_digest="$(sha256sum build/e2e-package/plugin.zip | awk '{print $1}')"
          [ "$actual_digest" = "$expected_digest" ] || {
            echo "::error::Downloaded Starter artifact digest mismatch"
            exit 1
          }

          mkdir -p build/distributions
          cp build/e2e-package/plugin.zip "build/distributions/$archive_name"
          echo "E2E_PLUGIN_PATH=build/distributions/$archive_name" >> "$GITHUB_ENV"
          echo "E2E_PLUGIN_SHA256=$expected_digest" >> "$GITHUB_ENV"

      - name: Install pinned sandboxed JCEF AppArmor profile (derived-content only)
        if: matrix.shard == 'derived-content'
        shell: bash
        env:
          STARTER_SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          bash .github/scripts/install-starter-jcef-apparmor.sh --self-test
          bash .github/scripts/install-starter-jcef-apparmor.sh

      - name: Start virtual display
        shell: bash
        run: |
          set -euo pipefail
          Xvfb :99 -screen 0 1920x1080x24 >"$RUNNER_TEMP/markflow-starter-driver-xvfb.log" 2>&1 &
          printf 'DISPLAY=:99\n' >> "$GITHUB_ENV"

      - name: Run stable Starter Driver shard
        shell: bash
        env:
          STARTER_SHARD: ${{ matrix.shard }}
          STARTER_SUITES: ${{ matrix.suites }}
        run: |
          set -euo pipefail
          python3 .github/scripts/check-starter-driver-diagnostics.py --self-test

          pass_dir="build/e2e-evidence/$STARTER_SHARD"
          marker="$RUNNER_TEMP/markflow-starter-$STARTER_SHARD-start"
          rm -rf "$pass_dir" build/test-results/integrationTest build/reports/tests/integrationTest
          mkdir -p "$pass_dir"
          touch "$marker"

          IFS='|' read -r -a suites <<< "$STARTER_SUITES"
          gradle_args=(
            integrationTest
            -x buildPlugin
            -PplatformVersion="$STARTER_PLATFORM_VERSION"
            -PstarterPackagedPlugin=true
            --stacktrace
          )
          diagnostics_args=()
          for suite in "${suites[@]}"; do
            gradle_args+=(--tests "$suite")
            diagnostics_args+=(--required-suite "$suite")
          done

          test_status=0
          set +e
          timeout --signal=TERM --kill-after=30s 24m ./gradlew "${gradle_args[@]}"
          test_status=$?
          set -e

          if [ -d build/test-results/integrationTest ]; then
            cp -R build/test-results/integrationTest "$pass_dir/test-results"
          fi
          if [ -d build/reports/tests/integrationTest ]; then
            cp -R build/reports/tests/integrationTest "$pass_dir/test-report"
          fi

          while IFS= read -r -d '' log; do
            log_dir="$(dirname "$log")"
            relative="${log_dir#./}"
            destination="$pass_dir/logs/$relative"
            mkdir -p "$(dirname "$destination")"
            rm -rf "$destination"
            cp -R "$log_dir" "$destination"
          done < <(
            find out/ide-tests build/idea-sandbox .intellijPlatform/sandbox \
              -type f -name idea.log -newer "$marker" -print0 2>/dev/null || true
          )

          diagnostics_status=0
          set +e
          python3 .github/scripts/check-starter-driver-diagnostics.py \
            --root "$pass_dir" \
            --output "$pass_dir/diagnostics.json" \
            "${diagnostics_args[@]}"
          diagnostics_status=$?
          set -e

          actual_digest="$(sha256sum "$E2E_PLUGIN_PATH" | awk '{print $1}')"
          [ "$actual_digest" = "$E2E_PLUGIN_SHA256" ] || {
            echo "::error::Starter shard mutated the packaged plugin artifact"
            exit 1
          }
          cp build/e2e-package/manifest.txt "$pass_dir/package-manifest.txt"
          printf 'shard=%s\nsuites=%s\n' "$STARTER_SHARD" "$STARTER_SUITES" > "$pass_dir/shard.txt"

          if [ "$test_status" -ne 0 ]; then
            echo "Starter/Driver shard $STARTER_SHARD failed with status $test_status" >&2
            exit "$test_status"
          fi
          if [ "$diagnostics_status" -ne 0 ]; then
            echo "Starter/Driver shard $STARTER_SHARD diagnostics failed" >&2
            exit "$diagnostics_status"
          fi

      - name: Upload shard diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: starter-driver-e2e-${{ matrix.shard }}-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            build/e2e-evidence/**
            build/test-results/integrationTest/**
            build/reports/tests/integrationTest/**
            build/e2e-package/manifest.txt
            out/ide-tests/**/log/**
            build/idea-sandbox/**/log/idea.log
            ${{ runner.temp }}/markflow-starter-driver-xvfb.log




  jcef-corpus-one-pilot:
    # #353: one real manifest pair using the separately owned bundled JCEF panel.
    # This is a diagnostic CAPTURED_UNVERIFIED pilot, not 89-case acceptance.
    # Do not merge it into the 50-open native lifecycle stress job.
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 453 && github.head_ref == 'test/353-jcef-lifecycle-stress-reproducer' && github.event.pull_request.draft == false }}
    needs: [ package ]
    name: Controlled JCEF first corpus pair (unreviewed)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Fetch exact candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.STARTER_SOURCE_SHA }}
          persist-credentials: false

      - name: Verify exact source checkout
        shell: bash
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$STARTER_SOURCE_SHA" ] || {
            echo "::error::Controlled corpus pilot source checkout drifted"
            exit 1
          }

      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: zulu
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      - name: Download exact Starter plugin artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: starter-driver-plugin-${{ github.run_id }}
          path: build/e2e-package

      - name: Verify packaged plugin identity
        shell: bash
        run: |
          set -euo pipefail
          manifest=build/e2e-package/manifest.txt
          [ -s "$manifest" ] && [ -s build/e2e-package/plugin.zip ]
          field() { sed -n "s/^$1=//p" "$manifest"; }
          [ "$(field source_sha)" = "$STARTER_SOURCE_SHA" ]
          [ "$(field platform_version)" = "$STARTER_PLATFORM_VERSION" ]
          expected_digest="$(field plugin_sha256)"
          [[ "$expected_digest" =~ ^[0-9a-f]{64}$ ]]
          [ "$(sha256sum build/e2e-package/plugin.zip | awk '{print $1}')" = "$expected_digest" ]
          archive="$(field plugin_archive)"
          [[ "$archive" = *.zip && "$archive" != */* ]]
          mkdir -p build/distributions
          cp build/e2e-package/plugin.zip "build/distributions/$archive"
          echo "E2E_PLUGIN_PATH=build/distributions/$archive" >> "$GITHUB_ENV"
          echo "E2E_PLUGIN_SHA256=$expected_digest" >> "$GITHUB_ENV"

      - name: Install pinned JCEF AppArmor profile
        shell: bash
        env:
          STARTER_SHARD: jcef-corpus-one
        run: |
          set -euo pipefail
          bash .github/scripts/install-starter-jcef-apparmor.sh --self-test
          bash .github/scripts/install-starter-jcef-apparmor.sh

      - name: Start pinned differential display
        shell: bash
        run: |
          set -euo pipefail
          Xvfb :99 -screen 0 1920x1080x24 >"$RUNNER_TEMP/markflow-jcef-corpus-one-xvfb.log" 2>&1 &
          printf 'DISPLAY=:99\n' >> "$GITHUB_ENV"

      - name: Run exactly one manifest-bound controlled reference pair
        shell: bash
        env:
          MARKFLOW_CONTROLLED_JCEF_CORPUS_ONE: '1'
        run: |
          set -euo pipefail
          pass_dir=build/e2e-evidence/derived-content/jcef-corpus-one
          rm -rf "$pass_dir" build/test-results/integrationTest build/reports/tests/integrationTest
          timeout --signal=TERM --kill-after=30s 25m \
            ./gradlew integrationTest -x buildPlugin \
              -PplatformVersion="$STARTER_PLATFORM_VERSION" -PstarterPackagedPlugin=true \
              --stacktrace \
              --tests com.algorist.markflow.e2e.MarkFlowStarterControlledJcefPreflightTest.capturesOneCorpusPairWithControlledNativeLifecycle
          [ "$(sha256sum "$E2E_PLUGIN_PATH" | awk '{print $1}')" = "$E2E_PLUGIN_SHA256" ] || {
            echo "::error::Controlled corpus pilot mutated the product plugin ZIP"
            exit 1
          }
          [ -s "$pass_dir/run-contract.txt" ] && [ -s "$pass_dir/result.txt" ]
          grep -Fxq "source_head=$STARTER_SOURCE_SHA" "$pass_dir/run-contract.txt"
          grep -Fxq 'case_id=md-atx-headings-h1-h6' "$pass_dir/run-contract.txt"
          grep -Fxq 'full_differential_acceptance=false' "$pass_dir/run-contract.txt"
          grep -Fxq 'result=CAPTURED_UNVERIFIED' "$pass_dir/result.txt"
          grep -Fxq 'native_closed=true' "$pass_dir/result.txt"
          for name in source.md markflow.png intellij-preview.png dom-proof.txt \
              open.txt native-created.txt native-closed.txt \
              native-events.tsv native-close.marker; do
            [ -s "$pass_dir/$name" ] || {
              echo "::error::Controlled corpus pilot missing evidence: $name"
              exit 1
            }
          done
          cmp -s "$pass_dir/source.md" fixtures/differential-acceptance/markdown/headings-atx-h1-h6.md || {
            echo "::error::Controlled corpus pilot did not preserve exact manifest bytes"
            exit 1
          }
          grep -Fxq 'on_before_close=true' "$pass_dir/native-close.marker"
          grep -Fxq 'native_before_close=true' "$pass_dir/native-closed.txt"
          grep -Fxq 'cef_closed=true' "$pass_dir/native-closed.txt"
          grep -Fxq 'callback_failure=NONE' "$pass_dir/native-closed.txt"
          echo "One real corpus pair captured with exact native close; acceptance remains unreviewed."

      - name: Upload controlled corpus pilot evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: starter-jcef-corpus-one-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            build/e2e-evidence/derived-content/jcef-corpus-one/**
            build/test-results/integrationTest/**
            build/reports/tests/integrationTest/**
            build/e2e-package/manifest.txt
            out/ide-tests/**/log/**
            build/idea-sandbox/**/log/idea.log
            ${{ runner.temp }}/markflow-jcef-corpus-one-xvfb.log

  jcef-manifest-one-pilot:
    # #353: retain a single ordered 89-case controlled evidence lane.
    # Capture is unreviewed and never substitutes for the acceptance ledger.
    # The Ready PR must fail closed if this evidence job fails or is interrupted.
    if: ${{ (github.event_name == 'pull_request' && github.event.pull_request.number == 453 && github.head_ref == 'test/353-jcef-lifecycle-stress-reproducer' && github.event.pull_request.draft == false) || (github.event_name == 'workflow_dispatch' && inputs.jcef_controlled_corpus_close_mode != 'disabled' && !inputs.jcef_lifecycle_stress) }}
    needs: [ package ]
    name: Manifest runner controlled JCEF full 89 corpus (unreviewed)
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - name: Fetch exact candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.STARTER_SOURCE_SHA }}
          persist-credentials: false

      - name: Verify exact source checkout
        shell: bash
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$STARTER_SOURCE_SHA" ] || {
            echo "::error::Owned manifest corpus source HEAD drifted"
            exit 1
          }

      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: zulu
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      - name: Download exact Starter plugin artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: starter-driver-plugin-${{ github.run_id }}
          path: build/e2e-package

      - name: Verify packaged plugin identity
        shell: bash
        run: |
          set -euo pipefail
          manifest=build/e2e-package/manifest.txt
          [ -s "$manifest" ] && [ -s build/e2e-package/plugin.zip ]
          field() { sed -n "s/^$1=//p" "$manifest"; }
          [ "$(field source_sha)" = "$STARTER_SOURCE_SHA" ]
          [ "$(field platform_version)" = "$STARTER_PLATFORM_VERSION" ]
          [[ ",$(field scenario_sets)," == *,jcef-manifest-one,* ]]
          expected_digest="$(field plugin_sha256)"
          [[ "$expected_digest" =~ ^[0-9a-f]{64}$ ]]
          [ "$(sha256sum build/e2e-package/plugin.zip | awk '{print $1}')" = "$expected_digest" ]
          archive="$(field plugin_archive)"
          [[ "$archive" = *.zip && "$archive" != */* ]]
          mkdir -p build/distributions
          cp build/e2e-package/plugin.zip "build/distributions/$archive"
          echo "E2E_PLUGIN_PATH=build/distributions/$archive" >> "$GITHUB_ENV"
          echo "E2E_PLUGIN_SHA256=$expected_digest" >> "$GITHUB_ENV"

      - name: Install pinned JCEF AppArmor profile
        shell: bash
        env:
          STARTER_SHARD: jcef-manifest-one
        run: |
          set -euo pipefail
          bash .github/scripts/install-starter-jcef-apparmor.sh --self-test
          bash .github/scripts/install-starter-jcef-apparmor.sh

      - name: Start pinned differential display
        shell: bash
        run: |
          set -euo pipefail
          Xvfb :99 -screen 0 1920x1080x24 >"$RUNNER_TEMP/markflow-jcef-manifest-one-xvfb.log" 2>&1 &
          printf 'DISPLAY=:99\n' >> "$GITHUB_ENV"

      - name: Run full sequential Controlled JCEF manifest capture (89 cases)
        shell: bash
        env:
          MARKFLOW_CONTROLLED_CORPUS_CLOSE_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.jcef_controlled_corpus_close_mode || 'async' }}
        run: |
          set -euo pipefail
          [[ "$MARKFLOW_CONTROLLED_CORPUS_CLOSE_MODE" == async || "$MARKFLOW_CONTROLLED_CORPUS_CLOSE_MODE" == sync || "$MARKFLOW_CONTROLLED_CORPUS_CLOSE_MODE" == router_cleanup ]] || {
            echo "::error::Unsupported controlled-corpus close mode: $MARKFLOW_CONTROLLED_CORPUS_CLOSE_MODE"
            exit 1
          }
          echo "CONTROLLED_CORPUS_CLOSE_MODE mode=$MARKFLOW_CONTROLLED_CORPUS_CLOSE_MODE"
          rm -rf build/e2e-evidence/derived-content/differential-manifest \
                 build/test-results/integrationTest build/reports/tests/integrationTest
          # The GitHub runner may terminate before its always() artifact upload.
          # Keep the last authoritative case/phase visible in the job log, without
          # skipping a case, creating shards, or changing failure semantics.
          progress_file="$RUNNER_TEMP/markflow-353-controlled-corpus-progress.tsv"
          export MARKFLOW_DIFFERENTIAL_PROGRESS_FILE="$progress_file"
          rm -f "$progress_file"
          # Lightweight diagnostics are printed live: the hosted runner can stop
          # before an always() artifact upload. These probes never alter the test gate.
          resource_file="$RUNNER_TEMP/markflow-353-controlled-corpus-resources.tsv"
          : > "$resource_file"
          resource_sample() {
            local phase="$1" utc cg suffix current peak limit events host_available disk_available processes
            utc="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            cg=/sys/fs/cgroup
            suffix="$(awk -F: '$1 == "0" {print $3; exit}' /proc/self/cgroup 2>/dev/null || :)"
            if [ -n "$suffix" ] && [ "$suffix" != "/" ] && [ -d "$cg$suffix" ]; then
              cg="$cg$suffix"
            fi
            current=NA
            peak=NA
            limit=NA
            if [ -r "$cg/memory.current" ]; then IFS= read -r current < "$cg/memory.current" || :; fi
            if [ -r "$cg/memory.peak" ]; then IFS= read -r peak < "$cg/memory.peak" || :; fi
            if [ -r "$cg/memory.max" ]; then IFS= read -r limit < "$cg/memory.max" || :; fi
            events=NA
            if [ -r "$cg/memory.events" ]; then
              events="$(awk '$1 == "high" || $1 == "max" || $1 == "oom" || $1 == "oom_kill" || $1 == "oom_group_kill" {printf "%s:%s,", $1, $2}' "$cg/memory.events" 2>/dev/null)" || events=NA
              [ -n "$events" ] || events=NA
            fi
            host_available="$(awk '$1 == "MemAvailable:" {print $2; exit}' /proc/meminfo 2>/dev/null)" || host_available=NA
            disk_available="$(df -Pk . 2>/dev/null | awk 'NR == 2 {print $4}')" || disk_available=NA
            processes="$(ps -eo pid=,rss=,comm= 2>/dev/null | awk '
              $3 ~ /(java|jcef|cef|chrome|chromium|Xvfb|gradle)/ {
                count++; total += $2
                if ($2 > largest) { largest=$2; pid=$1; comm=$3 }
              }
              END {
                printf "process_count=%d process_rss_sum_kib=%.0f largest_pid=%s largest_comm=%s largest_rss_kib=%.0f",
                  count, total, (pid == "" ? "NA" : pid), (comm == "" ? "NA" : comm), largest
              }
            ')" || processes="process_stats=NA"
            printf 'CONTROLLED_CORPUS_RESOURCE phase=%s utc=%s cgroup=%s memory_current_bytes=%s memory_peak_bytes=%s memory_limit_bytes=%s memory_events=%s host_available_kib=%s disk_available_kib=%s %s\n' \
              "$phase" "$utc" "$cg" "$current" "$peak" "$limit" "$events" "$host_available" "$disk_available" "$processes" | tee -a "$resource_file"
          }
          (
            next_line=1
            tick=0
            while :; do
              if [ -s "$progress_file" ]; then
                while IFS= read -r current; do
                  printf 'CONTROLLED_CORPUS_PROGRESS %s\n' "$current"
                  # Keep the original machine-readable progress event unchanged.
                  # A separate concise live line makes the current ordinal
                  # immediately visible while the full 89-case job is running.
                  IFS=$'\t' read -r timestamp phase case_id position <<< "$current"
                  case "$phase" in
                    case-start)
                      printf 'CONTROLLED_CORPUS_CASE START %s id=%s\n' "$position" "$case_id"
                      ;;
                    case-cleanup-complete)
                      printf 'CONTROLLED_CORPUS_CASE COMPLETE %s id=%s\n' "$position" "$case_id"
                      ;;
                    case-failed)
                      printf 'CONTROLLED_CORPUS_CASE FAIL %s id=%s\n' "$position" "$case_id"
                      ;;
                  esac
                  next_line=$((next_line + 1))
                done < <(tail -n +"$next_line" "$progress_file")
              fi
              if (( tick % 3 == 0 )); then
                resource_sample periodic || echo 'CONTROLLED_CORPUS_RESOURCE sample_failed'
              fi
              tick=$((tick + 1))
              sleep 5
            done
          ) &
          monitor_pid=$!
          trap 'resource_sample final || :; kill "$monitor_pid" 2>/dev/null || :; wait "$monitor_pid" 2>/dev/null || :; if [ -s "$progress_file" ]; then echo "CONTROLLED_CORPUS_FINAL_PROGRESS $(tail -n 1 "$progress_file")"; fi' EXIT
          timeout --signal=TERM --kill-after=30s 90m \
            ./gradlew integrationTest -x buildPlugin \
              -PplatformVersion="$STARTER_PLATFORM_VERSION" -PstarterPackagedPlugin=true \
              -PdifferentialContract=controlled-capture --stacktrace \
              --tests com.algorist.markflow.e2e.MarkFlowStarterDifferentialManifestTest.boundedManifestCasesCaptureActualReferenceAndNative
          [ "$(sha256sum "$E2E_PLUGIN_PATH" | awk '{print $1}')" = "$E2E_PLUGIN_SHA256" ] || {
            echo "::error::Controlled manifest capture mutated the exact packaged plugin"
            exit 1
          }
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path("build/e2e-evidence/derived-content/differential-manifest")
          close_mode = os.environ["MARKFLOW_CONTROLLED_CORPUS_CLOSE_MODE"]
          assert close_mode in {"async", "sync", "router_cleanup"}
          assert (root / "controlled-close-mode.txt").read_text().splitlines() == [
              "schema=markflow-controlled-corpus-close-mode/v1",
              f"mode={close_mode}",
          ]
          summary = json.loads((root / "summary.json").read_text())
          assert summary["expanded_cases"] == 89
          assert summary["selected_cases"] == 89
          assert summary["captured_unverified"] == 89
          assert summary["capture_failed"] == 0
          assert summary["not_executed"] == 0
          assert summary["candidate_structural_failure_count"] == 0
          assert summary["full_differential_acceptance"] is False
          assert summary["release_eligible"] is False
          cases = summary["cases"]
          assert len(cases) == 89 and len({row["case_id"] for row in cases}) == 89
          noncomparable = 0
          for row in cases:
              case_id = row["case_id"]
              assert row["capture_status"] == "CAPTURED_UNVERIFIED", case_id
              folder = root / case_id
              identity = dict(line.split("=", 1) for line in
                              (folder / "identity.txt").read_text().splitlines()
                              if "=" in line)
              source = (folder / "source.md").read_bytes()
              assert identity["case_id"] == case_id
              assert identity["source_sha256"] == hashlib.sha256(source).hexdigest()
              assert (folder / "markflow.png").stat().st_size > 100
              if identity["intellij_preview"] == "no":
                  noncomparable += 1
                  assert row["classification"] == "degraded"
                  assert (folder / "reference-disposition.txt").is_file()
                  assert not (folder / "controlled-reference").exists()
                  continue
              assert identity["intellij_preview"] == "yes"
              owned = folder / "controlled-reference"
              assert (owned / "intellij-preview.png").stat().st_size > 100
              result_text = (owned / "result.txt").read_text()
              assert "result=CAPTURED_UNVERIFIED" in result_text
              assert f"close_mode={close_mode}" in result_text
              for phase in ("live", "before", "after"):
                  barrier_text = (owned / f"barrier-{phase}.txt").read_text()
                  assert "schema=markflow-jcef-native-close-barrier/v1" in barrier_text
                  assert "server_factories=" in barrier_text
                  assert "cef_memory=" in barrier_text
                  if phase == "after":
                      assert "target_client_present=false" in barrier_text
                      assert "target_browser_present=false" in barrier_text
                  else:
                      assert "target_client_present=true" in barrier_text
                      assert "target_browser_present=true" in barrier_text
              sync_rpc = owned / "synchronous-rpc.txt"
              if close_mode == "sync":
                  assert "rpc_returned=true" in sync_rpc.read_text()
              else:
                  assert not sync_rpc.exists()
              router_cleanup = owned / "router-cleanup.txt"
              if close_mode == "router_cleanup":
                  cleanup_text = router_cleanup.read_text()
                  assert "schema=markflow-jcef-remote-router-cleanup/v1" in cleanup_text
                  assert "remaining_count=0" in cleanup_text
                  assert "server_path=Client_RemoveMessageRouter" in cleanup_text
                  removed = int(next(line.split("=", 1)[1] for line in cleanup_text.splitlines()
                                     if line.startswith("removed_count=")))
                  assert removed >= 20
              else:
                  assert not router_cleanup.exists()
              created = dict(line.split("=", 1) for line in
                             (owned / "native-created.txt").read_text().splitlines()
                             if "=" in line)
              closed = (owned / "native-closed.txt").read_text()
              marker = (owned / "native-close.marker").read_text()
              assert "cef_closed=true" in closed
              assert "callback_failure=NONE" in closed
              assert "on_before_close=true" in marker
              for key in ("cef_identity", "browser_identity"):
                  assert f"{key}={created[key]}" in marker
              names = (["heading-dom-geometry", "following-paragraph-dom-geometry"]
                       if case_id == "md-atx-headings-h1-h6" else
                       ["mermaid-svg-dom-geometry"]
                       if case_id == "mermaid-flowchart-minimal" else
                       ["generic-dom-geometry"])
              for name in names:
                  assert (owned / f"{name}.txt").stat().st_size > 0
                  evidence = (owned / f"{name}.identity").read_text()
                  assert f"probe_name={name}" in evidence
                  assert f"case_id={case_id}" in evidence
                  assert f"source_sha256={identity['source_sha256']}" in evidence
                  assert "query_browser_bound=true" in evidence
                  assert "status=OK" in evidence
                  for key in ("cef_identity", "browser_identity", "cef_native_id"):
                      assert f"{key}={created[key]}" in evidence
          assert noncomparable == 1
          print("Full unreviewed capture: 89 native sources, 88 source-bound JCEF references, all callbacks and native closes verified")
          PY

      - name: Upload Manifest-owned corpus evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: starter-jcef-manifest-one-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            build/e2e-evidence/derived-content/differential-manifest/**
            build/test-results/integrationTest/**
            build/reports/tests/integrationTest/**
            build/e2e-package/manifest.txt
            out/ide-tests/**/log/**
            build/idea-sandbox/**/log/idea.log
            ${{ runner.temp }}/markflow-jcef-manifest-one-xvfb.log
            ${{ runner.temp }}/markflow-353-controlled-corpus-progress.tsv
            ${{ runner.temp }}/markflow-353-controlled-corpus-resources.tsv

  jcef-lifecycle-stress:
    # #353: the original 50-cycle baseline and DOM-query 50-cycle are optional
    # manual diagnostics. Only the full sequential 89-case corpus gates PR #453.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.jcef_lifecycle_stress }}
    needs: [ package ]
    name: Bundled JCEF lifecycle diagnostic (50 stress / 2 preflight)
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Fetch exact candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.STARTER_SOURCE_SHA }}
          persist-credentials: false

      - name: Verify exact source checkout
        shell: bash
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$STARTER_SOURCE_SHA" ] || {
            echo "::error::JCEF stress source checkout drifted"
            exit 1
          }

      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: zulu
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      - name: Download exact Starter plugin artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: starter-driver-plugin-${{ github.run_id }}
          path: build/e2e-package

      - name: Verify packaged plugin identity
        shell: bash
        run: |
          set -euo pipefail
          manifest=build/e2e-package/manifest.txt
          [ -f "$manifest" ] && [ -f build/e2e-package/plugin.zip ]
          field() { sed -n "s/^$1=//p" "$manifest"; }
          [ "$(field source_sha)" = "$STARTER_SOURCE_SHA" ]
          [ "$(field platform_version)" = "$STARTER_PLATFORM_VERSION" ]
          [[ ",$(field scenario_sets)," == *",jcef-lifecycle-stress,"* ]]
          expected_digest="$(field plugin_sha256)"
          [[ "$expected_digest" =~ ^[0-9a-f]{64}$ ]]
          [ "$(sha256sum build/e2e-package/plugin.zip | awk '{print $1}')" = "$expected_digest" ]
          archive_name="$(field plugin_archive)"
          [[ "$archive_name" = *.zip && "$archive_name" != */* ]]
          mkdir -p build/distributions
          cp build/e2e-package/plugin.zip "build/distributions/$archive_name"
          echo "E2E_PLUGIN_PATH=build/distributions/$archive_name" >> "$GITHUB_ENV"
          echo "E2E_PLUGIN_SHA256=$expected_digest" >> "$GITHUB_ENV"

      - name: Install pinned JCEF AppArmor profile
        shell: bash
        env:
          STARTER_SHARD: jcef-lifecycle-stress
        run: |
          set -euo pipefail
          bash .github/scripts/install-starter-jcef-apparmor.sh --self-test
          bash .github/scripts/install-starter-jcef-apparmor.sh

      - name: Start pinned differential display
        shell: bash
        run: |
          set -euo pipefail
          Xvfb :99 -screen 0 1920x1080x24 >"$RUNNER_TEMP/markflow-jcef-stress-xvfb.log" 2>&1 &
          printf 'DISPLAY=:99\n' >> "$GITHUB_ENV"

      - name: Run isolated bundled JCEF lifecycle diagnostic
        shell: bash
        env:
          # Manual-only diagnostic; source and artifact must match this dispatch HEAD.
          JCEF_STRESS_RENDER_MODE: ${{ inputs.jcef_lifecycle_render_mode || 'osr' }}
          JCEF_STRESS_EXECUTION_MODE: ${{ inputs.jcef_lifecycle_execution_mode || 'remote' }}
          JCEF_STRESS_OPEN_MODE: ${{ inputs.jcef_lifecycle_open_mode || 'editor_only_roundtrip' }}
          JCEF_STRESS_ITERATION_MODE: ${{ inputs.jcef_lifecycle_iteration_mode || 'stress_50' }}
          JCEF_DOM_STRESS_REQUESTED: ${{ inputs.jcef_lifecycle_dom_stress }}
          JCEF_SYNC_COMPARE_REQUESTED: ${{ inputs.jcef_lifecycle_sync_compare }}
        run: |
          set -euo pipefail
          if [[ "$JCEF_DOM_STRESS_REQUESTED" == true ]] && \
             { [[ "$JCEF_STRESS_OPEN_MODE" != controlled_provider ]] || \
               [[ "$JCEF_STRESS_EXECUTION_MODE" != remote ]] || \
               [[ "$JCEF_STRESS_RENDER_MODE" != osr ]] || \
               [[ "$JCEF_STRESS_ITERATION_MODE" != stress_50 ]]; }; then
            echo "::error::DOM-query 50-cycle requires controlled_provider / remote / osr / stress_50"
            exit 1
          fi
          if [[ "$JCEF_SYNC_COMPARE_REQUESTED" == true ]] && \
             { [[ "$JCEF_STRESS_OPEN_MODE" != controlled_provider ]] || \
               [[ "$JCEF_STRESS_EXECUTION_MODE" != remote ]] || \
               [[ "$JCEF_STRESS_RENDER_MODE" != osr ]] || \
               [[ "$JCEF_STRESS_ITERATION_MODE" != preflight_2 ]] || \
               [[ "$JCEF_DOM_STRESS_REQUESTED" == true ]]; }; then
            echo "::error::Sync close A/B requires controlled_provider / remote / osr / preflight_2 without DOM stress"
            exit 1
          fi
          [[ "$JCEF_STRESS_EXECUTION_MODE" == remote || "$JCEF_STRESS_EXECUTION_MODE" == in_process ]] || {
            echo "::error::Unsupported JCEF process mode: $JCEF_STRESS_EXECUTION_MODE"
            exit 1
          }
          [[ "$JCEF_STRESS_RENDER_MODE" == osr || "$JCEF_STRESS_RENDER_MODE" == windowed ]] || {
            echo "::error::Unsupported JCEF render mode: $JCEF_STRESS_RENDER_MODE"
            exit 1
          }
          [[ "$JCEF_STRESS_EXECUTION_MODE" == in_process || "$JCEF_STRESS_RENDER_MODE" == osr ]] || {
            echo "::error::Remote JCEF requires OSR on pinned IDEA 2026.2.3"
            exit 1
          }
          [[ "$JCEF_STRESS_OPEN_MODE" == editor_only_roundtrip || "$JCEF_STRESS_OPEN_MODE" == direct_split || "$JCEF_STRESS_OPEN_MODE" == direct_split_eager_create || "$JCEF_STRESS_OPEN_MODE" == hidden_attach_then_split || "$JCEF_STRESS_OPEN_MODE" == controlled_provider ]] || {
            echo "::error::Unsupported initial editor opening mode: $JCEF_STRESS_OPEN_MODE"
            exit 1
          }
          [[ "$JCEF_STRESS_ITERATION_MODE" == stress_50 || "$JCEF_STRESS_ITERATION_MODE" == preflight_2 ]] || {
            echo "::error::Unsupported lifecycle iteration mode: $JCEF_STRESS_ITERATION_MODE"
            exit 1
          }
          expected_iterations=50
          if [[ "$JCEF_STRESS_ITERATION_MODE" == preflight_2 ]]; then
            [[ "$JCEF_STRESS_OPEN_MODE" == direct_split || "$JCEF_STRESS_OPEN_MODE" == direct_split_eager_create || "$JCEF_STRESS_OPEN_MODE" == hidden_attach_then_split || "$JCEF_STRESS_OPEN_MODE" == controlled_provider ]] || {
              echo "::error::Two-iteration preflight requires a split counterfactual"
              exit 1
            }
            expected_iterations=2
          fi
          if [[ "$JCEF_STRESS_OPEN_MODE" == direct_split_eager_create && "$JCEF_STRESS_ITERATION_MODE" != preflight_2 ]]; then
            echo "::error::Eager native creation counterfactual is limited to preflight_2"
            exit 1
          fi
          suite=com.algorist.markflow.e2e.MarkFlowStarterJcefLifecycleStressTest
          pass_dir=build/e2e-evidence/derived-content/jcef-lifecycle-stress
          controlled_preflight=0
          controlled_stress_50=0
          controlled_sync_compare=0
          result_mode="$JCEF_STRESS_ITERATION_MODE"
          if [[ "$JCEF_STRESS_OPEN_MODE" == controlled_provider ]]; then
            [[ "$JCEF_STRESS_EXECUTION_MODE" == remote && "$JCEF_STRESS_RENDER_MODE" == osr ]] || {
              echo "::error::Controlled provider candidate requires Remote JCEF / OSR"
              exit 1
            }
            suite=com.algorist.markflow.e2e.MarkFlowStarterControlledJcefPreflightTest
            if [[ "$JCEF_SYNC_COMPARE_REQUESTED" == true ]]; then
              controlled_sync_compare=1
              result_mode=sync_compare_2
              pass_dir=build/e2e-evidence/derived-content/jcef-controlled-sync-compare
            elif [[ "$JCEF_STRESS_ITERATION_MODE" == preflight_2 ]]; then
              controlled_preflight=1
              pass_dir=build/e2e-evidence/derived-content/jcef-controlled-preflight
            else
              controlled_stress_50=1
              pass_dir=build/e2e-evidence/derived-content/jcef-controlled-stress
            fi
          fi
          rm -rf "$pass_dir" build/test-results/integrationTest build/reports/tests/integrationTest
          mkdir -p "$pass_dir"
          # JCEF's native RemoteLoadHandler already supports targeted tracing.
          # Activate it only inside this opt-in diagnostic, not package or
          # acceptance jobs. Native log timestamps use the server's local TZ.
          if [[ "$JCEF_STRESS_EXECUTION_MODE" == remote ]]; then
            export CEF_SERVER_LOG_LEVEL=trace
            export CEF_SERVER_TRACE_RemoteLoadHandler=true
            export CEF_SERVER_LOG_PATH="$PWD/$pass_dir/cef-server-trace.log"
            printf 'schema=markflow-cef-server-load-trace/v1\n' > "$pass_dir/cef-server-trace-contract.txt"
            printf 'enabled=true\nsource_head=%s\ntrace_flag=%s\nlog_level=%s\nlog_path=%s\n' \
              "$STARTER_SOURCE_SHA" "$CEF_SERVER_TRACE_RemoteLoadHandler" \
              "$CEF_SERVER_LOG_LEVEL" "$CEF_SERVER_LOG_PATH" >> "$pass_dir/cef-server-trace-contract.txt"
            printf 'server_local_timezone=%s\nserver_launch_date=%s\n' \
              "$(date +%z)" "$(date '+%Y-%m-%dT%H:%M:%S%z')" \
              >> "$pass_dir/cef-server-trace-contract.txt"
          fi
          test_status=0
          set +e
          MARKFLOW_CONTROLLED_JCEF_PREFLIGHT="$controlled_preflight" MARKFLOW_CONTROLLED_JCEF_STRESS_50="$controlled_stress_50" MARKFLOW_CONTROLLED_JCEF_SYNC_COMPARISON="$controlled_sync_compare" MARKFLOW_JCEF_LIFECYCLE_STRESS=1 MARKFLOW_JCEF_STRESS_RENDER_MODE="$JCEF_STRESS_RENDER_MODE" MARKFLOW_JCEF_STRESS_EXECUTION_MODE="$JCEF_STRESS_EXECUTION_MODE" MARKFLOW_JCEF_STRESS_OPEN_MODE="$JCEF_STRESS_OPEN_MODE" MARKFLOW_JCEF_STRESS_ITERATION_MODE="$JCEF_STRESS_ITERATION_MODE" \
            timeout --signal=TERM --kill-after=30s 45m \
              ./gradlew integrationTest -x buildPlugin \
                -PplatformVersion="$STARTER_PLATFORM_VERSION" -PstarterPackagedPlugin=true \
                --stacktrace --tests "$suite"
          test_status=$?
          set -e
          if [[ "$JCEF_STRESS_EXECUTION_MODE" == remote ]]; then
            if [[ -s "$pass_dir/cef-server-trace.log" ]]; then
              echo "Native cef_server diagnostic log captured."
            else
              echo "::warning::No native cef_server trace log; server-side event timing is unverified."
            fi
          fi

          # Never let a skipped test or incomplete iteration count look like PASS.
          cp build/e2e-package/manifest.txt "$pass_dir/package-manifest.txt"
          printf 'source_head=%s\nmode=jcef-lifecycle-diagnostic\niteration_mode=%s\nexpected_iterations=%s\nexecution_mode=%s\nrender_mode=%s\ninitial_open_mode=%s\nfull_differential_acceptance=false\n' \
            "$STARTER_SOURCE_SHA" "$result_mode" "$expected_iterations" "$JCEF_STRESS_EXECUTION_MODE" "$JCEF_STRESS_RENDER_MODE" "$JCEF_STRESS_OPEN_MODE" > "$pass_dir/workflow-contract.txt"
          [ "$(sha256sum "$E2E_PLUGIN_PATH" | awk '{print $1}')" = "$E2E_PLUGIN_SHA256" ] || {
            echo "::error::JCEF stress changed the exact plugin artifact"
            exit 1
          }
          [ "$test_status" -eq 0 ] || {
            echo "::error::JCEF lifecycle stress failed with status $test_status"
            exit "$test_status"
          }
          [ -f "$pass_dir/result.txt" ] || {
            echo "::error::Stress test was skipped or did not produce a result"
            exit 1
          }
          grep -Fxq 'result=PASS' "$pass_dir/result.txt"
          grep -Fxq "mode=$result_mode" "$pass_dir/result.txt"
          grep -Fxq "mode=$result_mode" "$pass_dir/run-contract.txt"
          if [[ "$controlled_sync_compare" == 1 ]]; then
            grep -Fxq 'native_close_barrier_proved=2' "$pass_dir/result.txt"
            grep -Fxq 'sync_rpc_requested=1' "$pass_dir/result.txt"
            test -s "$pass_dir/iteration-001/barrier-before.txt"
            test -s "$pass_dir/iteration-001/barrier-after.txt"
            test -s "$pass_dir/iteration-002/barrier-before.txt"
            test -s "$pass_dir/iteration-002/barrier-after.txt"
            test -s "$pass_dir/iteration-002/synchronous-rpc.txt"

            summarize_barrier() {
              local iteration="$1"
              local phase="$2"
              local barrier="$pass_dir/iteration-$iteration/barrier-$phase.txt"
              echo "JCEF_SYNC_COMPARE_BARRIER iteration=$iteration phase=$phase"
              awk '
                /^(target_cid|target_bid|target_native_id|target_client_present|target_browser_present)=/ { print; next }
                /^cef_memory=$/ { section="memory"; next }
                /^server_factories=$/ { section="factories"; next }
                /^server_details=$/ { section=""; next }
                section == "memory" && /^pid=/ { print "cef_memory " $0; next }
                section == "factories" && /Factory</ { print "server_factory " $0 }
              ' "$barrier"
            }
            summarize_barrier 001 before
            summarize_barrier 001 after
            summarize_barrier 002 before
            summarize_barrier 002 after
            echo "JCEF_SYNC_COMPARE_RPC iteration=002"
            awk '/^(bid|cid|rpc_returned|native_close_proved)=/ { print }'               "$pass_dir/iteration-002/synchronous-rpc.txt"
          fi
          grep -Fxq "iterations=$expected_iterations" "$pass_dir/run-contract.txt"
          grep -Fxq "completed=$expected_iterations" "$pass_dir/result.txt"
          [ "$(find "$pass_dir" -maxdepth 1 -type d -name 'iteration-*' | wc -l)" -eq "$expected_iterations" ] || {
            echo "::error::JCEF lifecycle diagnostic did not record exactly $expected_iterations iterations"
            exit 1
          }

      # Optional explicit manual companion to the original 50-cycle baseline.
      # This diagnostic is not the 89-case acceptance and never changes the release gate.
      - name: Probe 50 JCEF DOM-query lifecycles with live RSS evidence
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.jcef_lifecycle_stress && inputs.jcef_lifecycle_dom_stress }}
        shell: bash
        run: |
          set -euo pipefail
          pass_dir=build/e2e-evidence/derived-content/jcef-controlled-dom-stress
          rm -rf "$pass_dir"
          mkdir -p "$pass_dir"
          resource_file="$pass_dir/resource-samples.tsv"
          : > "$resource_file"
          sample() {
            local phase="$1" cg suffix current peak limit events avail processes completed timestamp
            timestamp="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            cg=/sys/fs/cgroup
            suffix="$(awk -F: '$1 == "0" {print $3; exit}' /proc/self/cgroup 2>/dev/null || :)"
            if [ -n "$suffix" ] && [ "$suffix" != "/" ] && [ -d "$cg$suffix" ]; then
              cg="$cg$suffix"
            fi
            current=NA
            peak=NA
            limit=NA
            if [ -r "$cg/memory.current" ]; then IFS= read -r current < "$cg/memory.current" || :; fi
            if [ -r "$cg/memory.peak" ]; then IFS= read -r peak < "$cg/memory.peak" || :; fi
            if [ -r "$cg/memory.max" ]; then IFS= read -r limit < "$cg/memory.max" || :; fi
            events=NA
            if [ -r "$cg/memory.events" ]; then
              events="$(awk '$1 == "high" || $1 == "max" || $1 == "oom" || $1 == "oom_kill" || $1 == "oom_group_kill" {printf "%s:%s,", $1, $2}' "$cg/memory.events" 2>/dev/null)" || events=NA
              [ -n "$events" ] || events=NA
            fi
            avail="$(awk '$1 == "MemAvailable:" {print $2; exit}' /proc/meminfo 2>/dev/null)" || avail=NA
            completed="$(sed -n 's/^completed=//p' "$pass_dir/progress.txt" 2>/dev/null)" || completed=NA
            [ -n "$completed" ] || completed=0
            processes="$(ps -eo pid=,rss=,comm= 2>/dev/null | awk '
              $3 ~ /(java|cef_server|chrome|chromium|Xvfb)/ {
                count++; sum += $2
                if ($3 == "cef_server" && $2 > cef_rss) { cef_rss=$2; cef_pid=$1 }
              }
              END {
                printf "process_count=%d process_rss_sum_kib=%.0f cef_pid=%s cef_rss_kib=%.0f",
                  count, sum, (cef_pid == "" ? "NA" : cef_pid), cef_rss
              }
            ')" || processes="process_stats=NA"
            printf 'CONTROLLED_DOM_STRESS_RESOURCE phase=%s utc=%s completed=%s cgroup=%s memory_current_bytes=%s memory_peak_bytes=%s memory_limit_bytes=%s memory_events=%s host_available_kib=%s %s\n' \
              "$phase" "$timestamp" "$completed" "$cg" "$current" "$peak" "$limit" "$events" "$avail" "$processes" | tee -a "$resource_file"
          }
          (
            while :; do
              sample periodic || echo 'CONTROLLED_DOM_STRESS_RESOURCE sample_failed'
              sleep 15
            done
          ) &
          sample_pid=$!
          trap 'sample final || :; kill "$sample_pid" 2>/dev/null || :; wait "$sample_pid" 2>/dev/null || :' EXIT
          MARKFLOW_CONTROLLED_JCEF_DOM_RESOURCE_STRESS_50=1 \
            timeout --signal=TERM --kill-after=30s 45m \
              ./gradlew integrationTest -x buildPlugin \
                -PplatformVersion="$STARTER_PLATFORM_VERSION" -PstarterPackagedPlugin=true \
                --stacktrace --tests com.algorist.markflow.e2e.MarkFlowStarterControlledJcefPreflightTest.fiftyTestOwnedJcefDomQueriesCloseNatively
          [ "$(sha256sum "$E2E_PLUGIN_PATH" | awk '{print $1}')" = "$E2E_PLUGIN_SHA256" ] || {
            echo "::error::Controlled DOM stress changed the exact packaged plugin"
            exit 1
          }
          grep -Fxq 'result=PASS' "$pass_dir/result.txt"
          grep -Fxq 'mode=stress_dom_50' "$pass_dir/result.txt"
          grep -Fxq 'completed=50' "$pass_dir/result.txt"
          grep -Fxq 'dom_query_completed=50' "$pass_dir/result.txt"
          grep -Fxq 'dom_query_required=50' "$pass_dir/run-contract.txt"
          [ "$(find "$pass_dir" -mindepth 1 -maxdepth 1 -type d -name 'iteration-*' | wc -l)" -eq 50 ]

      - name: Upload JCEF lifecycle stress evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: starter-jcef-lifecycle-stress-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            build/e2e-evidence/derived-content/jcef-lifecycle-stress/**
            build/e2e-evidence/derived-content/jcef-controlled-preflight/**
            build/e2e-evidence/derived-content/jcef-controlled-stress/**
            build/e2e-evidence/derived-content/jcef-controlled-dom-stress/**
            build/e2e-evidence/derived-content/jcef-controlled-sync-compare/**
            build/test-results/integrationTest/**
            build/reports/tests/integrationTest/**
            out/ide-tests/**/log/**
            build/idea-sandbox/**/log/idea.log
            ${{ runner.temp }}/markflow-jcef-stress-xvfb.log

  visual:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.jcef_lifecycle_stress }}
    needs: [ package ]
    name: Deterministic Visual Acceptance
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - name: Fetch Sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.STARTER_SOURCE_SHA }}
          persist-credentials: false

      - name: Verify exact source checkout
        shell: bash
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$STARTER_SOURCE_SHA" ] || {
            echo "::error::Visual checkout drifted from exact candidate"
            exit 1
          }

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: zulu
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      - name: Download exact Starter plugin artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: starter-driver-plugin-${{ github.run_id }}
          path: build/e2e-package

      - name: Restore and verify packaged plugin identity
        shell: bash
        run: |
          set -euo pipefail
          manifest="build/e2e-package/manifest.txt"
          source_sha="$(sed -n 's/^source_sha=//p' "$manifest")"
          archive_name="$(sed -n 's/^plugin_archive=//p' "$manifest")"
          expected_digest="$(sed -n 's/^plugin_sha256=//p' "$manifest")"
          platform_version="$(sed -n 's/^platform_version=//p' "$manifest")"
          scenario_sets="$(sed -n 's/^scenario_sets=//p' "$manifest")"

          [ "$source_sha" = "$STARTER_SOURCE_SHA" ]
          [ "$platform_version" = "$STARTER_PLATFORM_VERSION" ]
          [[ "$scenario_sets" == *"visual-acceptance"* ]] || {
            echo "::error::Exact package manifest does not declare visual acceptance"
            exit 1
          }
          [ "$(sha256sum build/e2e-package/plugin.zip | awk '{print $1}')" = "$expected_digest" ]

          mkdir -p build/distributions
          cp build/e2e-package/plugin.zip "build/distributions/$archive_name"
          echo "E2E_PLUGIN_PATH=build/distributions/$archive_name" >> "$GITHUB_ENV"
          echo "E2E_PLUGIN_SHA256=$expected_digest" >> "$GITHUB_ENV"

      # #362: Preserve the x64-reviewed strict raster oracle on ARM64.
      - name: Install pinned ARM64 visual EGL and Liberation Sans
        shell: bash
        run: |
          set -euo pipefail
          if ! { [ "$RUNNER_OS" = Linux ] && [ "$RUNNER_ARCH" = ARM64 ] && [ "$(uname -m)" = aarch64 ]; }; then
            echo "::error::Visual acceptance requires actual ARM64"
            exit 1
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 fonts-liberation
          ldconfig -p | grep -F libEGL.so.1
          fc-cache -f
          resolved="$(fc-match -f '%{family}|%{style}|%{file}' Arial)"
          IFS='|' read -r resolved_family resolved_style resolved_path <<< "$resolved"
          if ! { [ "$resolved_family" = 'Liberation Sans' ] && [ "$resolved_style" = 'Regular' ]; }; then
            echo "::error::Visual Arial fallback is not pinned Liberation Sans: $resolved"
            exit 1
          fi
          [ -f "$resolved_path" ] || { echo "::error::Resolved Arial font missing"; exit 1; }
          actual_sha="$(sha256sum "$resolved_path" | awk '{print $1}')"
          expected_sha=4659bc0c58c5028dd488ec928d41d9265db43d9b669fc14ca8b0832daca7b144
          [ "$actual_sha" = "$expected_sha" ] || {
            echo "::error::Arial font file differs from x64/ARM paired evidence"
            exit 1
          }
          mkdir -p build/e2e-package
          {
            echo "source_sha=$STARTER_SOURCE_SHA"
            echo "platform_version=$STARTER_PLATFORM_VERSION"
            echo "runner_arch=$RUNNER_ARCH"
            echo "runner_uname=$(uname -m)"
            echo "runner_image=${ImageOS:-unknown}/${ImageVersion:-unknown}"
            echo "fontconfig_version=$(fc-match --version 2>&1)"
            echo "arial_family=$resolved_family"
            echo "arial_style=$resolved_style"
            echo "arial_file=$resolved_path"
            echo "arial_sha256=$actual_sha"
            echo "native_egl_confirmed=true"
          } | tee build/e2e-package/visual-font-provenance.txt

      - name: Start pinned visual display
        shell: bash
        run: |
          set -euo pipefail
          Xvfb :99 -screen 0 1920x1080x24 -dpi 96 >"$RUNNER_TEMP/markflow-visual-xvfb.log" 2>&1 &
          printf 'DISPLAY=:99\n' >> "$GITHUB_ENV"

      - name: Run deterministic representative visual acceptance
        shell: bash
        run: |
          set -euo pipefail
          suite="com.algorist.markflow.e2e.MarkFlowStarterVisualAcceptanceTest"
          rm -rf build/visual-acceptance build/test-results/integrationTest build/reports/tests/integrationTest

          test_status=0
          set +e
          timeout --signal=TERM --kill-after=30s 24m \
            ./gradlew integrationTest -x buildPlugin \
              -PplatformVersion="$STARTER_PLATFORM_VERSION" -PstarterPackagedPlugin=true \
              --stacktrace --tests "$suite"
          test_status=$?
          set -e

          actual_digest="$(sha256sum "$E2E_PLUGIN_PATH" | awk '{print $1}')"
          [ "$actual_digest" = "$E2E_PLUGIN_SHA256" ] || {
            echo "::error::Visual acceptance mutated the packaged plugin artifact"
            exit 1
          }
          mkdir -p build/visual-acceptance
          cp build/e2e-package/manifest.txt build/visual-acceptance/package-manifest.txt

          [ "$test_status" -eq 0 ] || exit "$test_status"

      - name: Upload visual diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: starter-driver-visual-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            build/visual-acceptance/**
            build/test-results/integrationTest/**
            build/reports/tests/integrationTest/**
            build/e2e-package/manifest.txt
            build/e2e-package/visual-font-provenance.txt
            out/ide-tests/**/log/**
            build/idea-sandbox/**/log/idea.log
            ${{ runner.temp }}/markflow-visual-xvfb.log

  visual-gate:
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (github.event_name != 'workflow_dispatch' || !inputs.jcef_lifecycle_stress) }}
    needs: [ package, visual ]
    name: Deterministic Visual Acceptance Gate
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - name: Require exact package and visual oracle
        shell: bash
        env:
          PACKAGE_RESULT: ${{ needs.package.result }}
          VISUAL_RESULT: ${{ needs.visual.result }}
        run: |
          set -euo pipefail
          [ "$PACKAGE_RESULT" = "success" ] || {
            echo "::error::Exact Starter package job result: $PACKAGE_RESULT"
            exit 1
          }
          [ "$VISUAL_RESULT" = "success" ] || {
            echo "::error::Deterministic visual acceptance result: $VISUAL_RESULT"
            exit 1
          }

  release-candidate-repeat:
    if: github.event_name == 'workflow_dispatch' && inputs.release_candidate_repeat && !inputs.jcef_lifecycle_stress
    needs: [ package ]
    name: Release candidate canonical repeat
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - name: Fetch Sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.STARTER_SOURCE_SHA }}
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: zulu
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      - name: Install ARM64 Skiko EGL runtime
        shell: bash
        run: |
          set -euo pipefail
          [ "$(uname -m)" = "aarch64" ] && [ "$RUNNER_ARCH" = "ARM64" ]
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1
          ldconfig -p | grep -F libEGL.so.1

      - name: Download exact Starter plugin artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: starter-driver-plugin-${{ github.run_id }}
          path: build/e2e-package

      - name: Restore and verify packaged plugin identity
        shell: bash
        run: |
          set -euo pipefail
          manifest="build/e2e-package/manifest.txt"
          source_sha="$(sed -n 's/^source_sha=//p' "$manifest")"
          archive_name="$(sed -n 's/^plugin_archive=//p' "$manifest")"
          expected_digest="$(sed -n 's/^plugin_sha256=//p' "$manifest")"
          platform_version="$(sed -n 's/^platform_version=//p' "$manifest")"

          [ "$(git rev-parse HEAD)" = "$STARTER_SOURCE_SHA" ]
          [ "$source_sha" = "$STARTER_SOURCE_SHA" ]
          [ "$platform_version" = "$STARTER_PLATFORM_VERSION" ]
          [ "$(sha256sum build/e2e-package/plugin.zip | awk '{print $1}')" = "$expected_digest" ]

          mkdir -p build/distributions
          cp build/e2e-package/plugin.zip "build/distributions/$archive_name"
          echo "E2E_PLUGIN_PATH=build/distributions/$archive_name" >> "$GITHUB_ENV"
          echo "E2E_PLUGIN_SHA256=$expected_digest" >> "$GITHUB_ENV"

      - name: Start virtual display
        shell: bash
        run: |
          set -euo pipefail
          Xvfb :99 -screen 0 1920x1080x24 >"$RUNNER_TEMP/markflow-starter-driver-repeat-xvfb.log" 2>&1 &
          printf 'DISPLAY=:99\n' >> "$GITHUB_ENV"

      - name: Run independent canonical repeat
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/check-starter-driver-diagnostics.py --self-test
          suite="com.algorist.markflow.e2e.MarkFlowStarterFullProductJourneyTest"
          pass_dir="build/e2e-evidence/release-candidate-repeat"
          marker="$RUNNER_TEMP/markflow-starter-repeat-start"
          rm -rf "$pass_dir" build/test-results/integrationTest build/reports/tests/integrationTest
          mkdir -p "$pass_dir"
          touch "$marker"

          test_status=0
          set +e
          timeout --signal=TERM --kill-after=30s 24m \
            ./gradlew integrationTest -x buildPlugin \
              -PplatformVersion="$STARTER_PLATFORM_VERSION" --stacktrace --tests "$suite"
          test_status=$?
          set -e

          if [ -d build/test-results/integrationTest ]; then
            cp -R build/test-results/integrationTest "$pass_dir/test-results"
          fi
          if [ -d build/reports/tests/integrationTest ]; then
            cp -R build/reports/tests/integrationTest "$pass_dir/test-report"
          fi
          while IFS= read -r -d '' log; do
            log_dir="$(dirname "$log")"
            relative="${log_dir#./}"
            destination="$pass_dir/logs/$relative"
            mkdir -p "$(dirname "$destination")"
            rm -rf "$destination"
            cp -R "$log_dir" "$destination"
          done < <(
            find out/ide-tests build/idea-sandbox .intellijPlatform/sandbox \
              -type f -name idea.log -newer "$marker" -print0 2>/dev/null || true
          )

          diagnostics_status=0
          set +e
          python3 .github/scripts/check-starter-driver-diagnostics.py \
            --root "$pass_dir" \
            --output "$pass_dir/diagnostics.json" \
            --required-suite "$suite"
          diagnostics_status=$?
          set -e

          [ "$(sha256sum "$E2E_PLUGIN_PATH" | awk '{print $1}')" = "$E2E_PLUGIN_SHA256" ] || {
            echo "::error::Canonical repeat mutated the packaged plugin artifact"
            exit 1
          }
          cp build/e2e-package/manifest.txt "$pass_dir/package-manifest.txt"

          [ "$test_status" -eq 0 ] || exit "$test_status"
          [ "$diagnostics_status" -eq 0 ] || exit "$diagnostics_status"

      - name: Upload repeat diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: starter-driver-e2e-release-candidate-repeat-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            build/e2e-evidence/**
            build/test-results/integrationTest/**
            build/reports/tests/integrationTest/**
            build/e2e-package/manifest.txt
            out/ide-tests/**/log/**
            build/idea-sandbox/**/log/idea.log
            ${{ runner.temp }}/markflow-starter-driver-repeat-xvfb.log

  gate:
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && (github.event_name != 'workflow_dispatch' || !inputs.jcef_lifecycle_stress) }}
    needs: [ package, shards, jcef-manifest-one-pilot ]
    name: Starter Driver E2E Gate
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - name: Require package, stable shards, and PR #453 controlled full corpus
        shell: bash
        env:
          PACKAGE_RESULT: ${{ needs.package.result }}
          SHARDS_RESULT: ${{ needs.shards.result }}
          CONTROLLED_CORPUS_RESULT: ${{ needs.jcef-manifest-one-pilot.result }}
          MUST_CHECK_CONTROLLED_CORPUS: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 453 }}
        run: |
          set -euo pipefail
          [ "$PACKAGE_RESULT" = "success" ] || {
            echo "::error::Exact Starter package job result: $PACKAGE_RESULT"
            exit 1
          }
          [ "$SHARDS_RESULT" = "success" ] || {
            echo "::error::Stable Starter shard result: $SHARDS_RESULT"
            exit 1
          }
          if [ "$MUST_CHECK_CONTROLLED_CORPUS" = true ]; then
            [ "$CONTROLLED_CORPUS_RESULT" = success ] || {
              echo "::error::PR #453 full 89-case controlled corpus result: $CONTROLLED_CORPUS_RESULT"
              exit 1
            }
          fi
