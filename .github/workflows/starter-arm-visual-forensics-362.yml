name: MarkFlow 362 ARM Visual Forensics (temporary)
# Dedicated branch only; remove before any production merge.
on:
  push:
    branches: [ci/362-arm-visual-root-cause]
permissions:
  contents: read
concurrency:
  group: arm-visual-forensics-${{ github.ref }}
  cancel-in-progress: false
env:
  SOURCE_SHA: ${{ github.sha }}
  STARTER_PLATFORM_VERSION: '2026.2.3'
jobs:
  package:
    name: One exact plugin ZIP
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: zulu
          java-version: 25
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true
      - name: Package only this SHA
        shell: bash
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$SOURCE_SHA" ]
          ./gradlew buildPlugin -PplatformVersion="$STARTER_PLATFORM_VERSION" --stacktrace
          mapfile -t archives < <(find build/distributions -maxdepth 1 -name '*.zip' -type f -print | sort)
          [ "${#archives[@]}" -eq 1 ] || { echo "::error::Expected one plugin ZIP"; exit 1; }
          mkdir -p build/e2e-package
          cp "${archives[0]}" build/e2e-package/plugin.zip
          {
            echo "source_sha=$SOURCE_SHA"
            echo "plugin_archive=$(basename "${archives[0]}")"
            echo "plugin_sha256=$(sha256sum "${archives[0]}" | awk '{print $1}')"
            echo "platform_version=$STARTER_PLATFORM_VERSION"
          } > build/e2e-package/manifest.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: markflow-362-plugin-${{ github.run_id }}
          path: build/e2e-package/**
          if-no-files-found: error
          retention-days: 14
  paired-visual:
    name: Original visual oracle and provenance (${{ matrix.arch }})
    needs: [package]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: x64, runner: ubuntu-24.04}
          - {arch: arm64, runner: ubuntu-24.04-arm}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Exact SHA and native architecture
        shell: bash
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$SOURCE_SHA" ]
          case "${{ matrix.arch }}" in
            x64) [ "$RUNNER_ARCH" = X64 ] && [ "$(uname -m)" = x86_64 ];;
            arm64) [ "$RUNNER_ARCH" = ARM64 ] && [ "$(uname -m)" = aarch64 ];;
            *) exit 1;;
          esac
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: zulu
          java-version: 25
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true
      - name: ARM EGL correction only, without changing fonts
        if: matrix.arch == 'arm64'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1
          ldconfig -p | grep -F libEGL.so.1
      - name: Record font file resolution, hashes and host identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/visual-acceptance/provenance
          {
            echo "source_sha=$SOURCE_SHA"
            echo "arch=${{ matrix.arch }}"
            echo "image=${ImageOS:-unknown}/${ImageVersion:-unknown}"
            echo "uname=$(uname -m)"
            echo "runner_arch=$RUNNER_ARCH"
            locale
            fc-match --version
            dpkg-query -W fontconfig libfreetype6 libegl1 || true
            java -version 2>&1
            for family in Inter Arial KaTeX_Main sans-serif serif monospace; do
              printf 'font[%s]=' "$family"
              fc-match -f '${family}|${style}|${file}\n' "$family"
              path="$(fc-match -f '${file}' "$family")"
              [ -f "$path" ] || { echo "::error::Missing resolved font $family"; exit 1; }
              sha256sum "$path"
            done
          } | tee build/visual-acceptance/provenance/host.txt
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: markflow-362-plugin-${{ github.run_id }}
          path: build/e2e-package
      - name: Verify same plugin bytes on both architectures
        shell: bash
        run: |
          set -euo pipefail
          m=build/e2e-package/manifest.txt
          [ "$(sed -n 's/^source_sha=//p' "$m")" = "$SOURCE_SHA" ]
          [ "$(sed -n 's/^platform_version=//p' "$m")" = "$STARTER_PLATFORM_VERSION" ]
          hash="$(sed -n 's/^plugin_sha256=//p' "$m")"
          [[ "$hash" =~ ^[0-9a-f]{64}$ ]]
          [ "$(sha256sum build/e2e-package/plugin.zip | awk '{print $1}')" = "$hash" ]
          name="$(sed -n 's/^plugin_archive=//p' "$m")"
          mkdir -p build/distributions
          cp build/e2e-package/plugin.zip "build/distributions/$name"
          echo "E2E_PLUGIN_PATH=build/distributions/$name" >> "$GITHUB_ENV"
          echo "E2E_PLUGIN_SHA256=$hash" >> "$GITHUB_ENV"
          cp "$m" build/visual-acceptance/provenance/package.txt
      - name: Start identical Xvfb
        run: |
          Xvfb :99 -screen 0 1920x1080x24 -dpi 96 >"$RUNNER_TEMP/markflow-362-xvfb.log" 2>&1 &
          echo 'DISPLAY=:99' >> "$GITHUB_ENV"
      - name: Original visual acceptance, plus opt-in real JCEF intermediate capture
        shell: bash
        env:
          MARKFLOW_VISUAL_ARM_FORENSICS: 'true'
        run: |
          set -euo pipefail
          rm -rf build/test-results/integrationTest build/reports/tests/integrationTest
          set +e
          timeout --signal=TERM --kill-after=30s 24m \
            ./gradlew integrationTest -x buildPlugin \
              -PplatformVersion="$STARTER_PLATFORM_VERSION" -PstarterPackagedPlugin=true \
              --stacktrace --tests 'com.algorist.markflow.e2e.MarkFlowStarterVisualAcceptanceTest' \
              > build/visual-acceptance/gradle.log 2>&1
          result=$?
          set -e
          echo "visual_exit=$result" | tee build/visual-acceptance/provenance/visual-status.txt
          [ "$(sha256sum "$E2E_PLUGIN_PATH" | awk '{print $1}')" = "$E2E_PLUGIN_SHA256" ]
          [ "$result" -eq 0 ] || {
            echo "::error::Strict golden mismatch on ${{ matrix.arch }} (original failure retained)"
            tail -n 40 build/visual-acceptance/gradle.log
            exit "$result"
          }
      - name: Fingerprint actual JBR and CEF shared libraries
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/visual-acceptance/provenance
          find out/ide-tests/cache/builds -type f \
            \( -name 'libcef.so' -o -name 'libjcef.so' -o -name 'libskiko-*.so' \) \
            -print0 2>/dev/null | while IFS= read -r -d '' file; do
              sha256sum "$file"
            done > build/visual-acceptance/provenance/native-libs.txt
      - name: Require actual renderer SVG, HTML and PNG artifacts
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          d = Path('build/visual-acceptance/derived-intermediates')
          svg = list(d.glob('mermaid-*.renderer.svg'))
          html = list(d.glob('katex-*.renderer.html'))
          png = list(d.glob('*.raster.png'))
          if not svg or len(html) < 2 or len(png) < 3:
              raise SystemExit(f'INCOMPLETE: mermaid={len(svg)} katex={len(html)} raster={len(png)}')
          for p in png:
              if not p.read_bytes().startswith(bytes.fromhex('89504e470d0a1a0a')):
                  raise SystemExit(f'invalid PNG: {p}')
          print(f'real intermediate evidence: {len(svg)} SVG; {len(html)} HTML; {len(png)} PNG')
          PY
      - name: Upload full forensic evidence even on failure
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: markflow-362-visual-${{ matrix.arch }}-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            build/visual-acceptance/**
            build/test-results/integrationTest/**
            build/reports/tests/integrationTest/**
            out/ide-tests/**/log/**
            build/idea-sandbox/**/log/idea.log
            ${{ runner.temp }}/markflow-362-xvfb.log
