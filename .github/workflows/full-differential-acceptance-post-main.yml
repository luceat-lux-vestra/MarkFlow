name: Full Differential Acceptance Post-Main

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/full-differential-acceptance-post-main.yml'
      - '.github/scripts/run-full-differential-with-watchdog.sh'
      - 'fixtures/differential-acceptance/acceptance-ledger.tsv'
      - 'src/integrationTest/kotlin/com/algorist/markflow/e2e/MarkFlowStarterDifferentialManifestTest.kt'

permissions:
  contents: read

concurrency:
  group: full-differential-acceptance-post-main-${{ github.sha }}
  cancel-in-progress: false

env:
  STARTER_PLATFORM_VERSION: '2026.2.3'
  STARTER_SOURCE_SHA: ${{ github.sha }}

jobs:
  package:
    name: Package exact full-differential plugin
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Fetch exact main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.STARTER_SOURCE_SHA }}
          persist-credentials: false

      - name: Verify exact source checkout
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          [ "$actual" = "$STARTER_SOURCE_SHA" ] || {
            echo "::error::Post-main package checkout drifted: expected=$STARTER_SOURCE_SHA actual=$actual"
            exit 1
          }

      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: zulu
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      - name: Build exact plugin artifact once
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew buildPlugin -PplatformVersion="$STARTER_PLATFORM_VERSION" --stacktrace

          mapfile -t archives < <(find build/distributions -maxdepth 1 -type f -name '*.zip' -print | sort)
          if [ "${#archives[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one plugin distribution, found ${#archives[@]}"
            printf '%s\n' "${archives[@]}"
            exit 1
          fi

          artifact="${archives[0]}"
          archive_name="$(basename "$artifact")"
          digest="$(sha256sum "$artifact" | awk '{print $1}')"

          mkdir -p build/e2e-package
          cp "$artifact" build/e2e-package/plugin.zip
          {
            echo "source_sha=$STARTER_SOURCE_SHA"
            echo "plugin_archive=$archive_name"
            echo "plugin_sha256=$digest"
            echo "platform_version=$STARTER_PLATFORM_VERSION"
            echo "scenario_set=full-differential-acceptance-post-main"
          } | tee build/e2e-package/manifest.txt

      - name: Upload exact plugin artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: full-differential-plugin-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: |
            build/e2e-package/plugin.zip
            build/e2e-package/manifest.txt

  full-differential:
    needs: [package]
    name: Full Differential Acceptance Post-Main
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - name: Fetch exact main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.STARTER_SOURCE_SHA }}
          persist-credentials: false

      - name: Verify exact source checkout
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          [ "$actual" = "$STARTER_SOURCE_SHA" ] || {
            echo "::error::Post-main full differential checkout drifted: expected=$STARTER_SOURCE_SHA actual=$actual"
            exit 1
          }

      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: zulu
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      - name: Download exact plugin artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: full-differential-plugin-${{ github.run_id }}
          path: build/e2e-package

      - name: Restore and verify packaged plugin identity
        shell: bash
        run: |
          set -euo pipefail
          manifest="build/e2e-package/manifest.txt"
          [ -f "$manifest" ] || { echo "::error::Post-main package manifest missing"; exit 1; }
          [ -f build/e2e-package/plugin.zip ] || { echo "::error::Post-main plugin artifact missing"; exit 1; }
          source_sha="$(sed -n 's/^source_sha=//p' "$manifest")"
          archive_name="$(sed -n 's/^plugin_archive=//p' "$manifest")"
          expected_digest="$(sed -n 's/^plugin_sha256=//p' "$manifest")"
          platform_version="$(sed -n 's/^platform_version=//p' "$manifest")"
          scenario_set="$(sed -n 's/^scenario_set=//p' "$manifest")"
          [ "$source_sha" = "$STARTER_SOURCE_SHA" ]
          [ "$platform_version" = "$STARTER_PLATFORM_VERSION" ]
          [ "$scenario_set" = "full-differential-acceptance-post-main" ]
          [[ "$expected_digest" =~ ^[0-9a-f]{64}$ ]]
          [ "$(sha256sum build/e2e-package/plugin.zip | awk '{print $1}')" = "$expected_digest" ]
          mkdir -p build/distributions
          cp build/e2e-package/plugin.zip "build/distributions/$archive_name"
          echo "E2E_PLUGIN_PATH=build/distributions/$archive_name" >> "$GITHUB_ENV"
          echo "E2E_PLUGIN_SHA256=$expected_digest" >> "$GITHUB_ENV"

      - name: Install pinned sandboxed JCEF AppArmor profile
        shell: bash
        env:
          STARTER_SHARD: full-differential-acceptance
        run: |
          set -euo pipefail
          bash .github/scripts/install-starter-jcef-apparmor.sh --self-test
          bash .github/scripts/install-starter-jcef-apparmor.sh

      - name: Start pinned full-corpus display
        shell: bash
        run: |
          set -euo pipefail
          Xvfb :99 -screen 0 1920x1080x24 >"$RUNNER_TEMP/markflow-full-differential-post-main-xvfb.log" 2>&1 &
          printf 'DISPLAY=:99\n' >> "$GITHUB_ENV"

      - name: Run complete 89-case reviewed acceptance
        shell: bash
        run: |
          set -euo pipefail
          pass_dir="build/e2e-evidence/derived-content/differential-manifest"
          progress_file="$pass_dir/progress.tsv"
          watchdog_file="$pass_dir/watchdog.txt"
          rm -rf "$pass_dir" build/test-results/integrationTest build/reports/tests/integrationTest
          mkdir -p "$pass_dir"

          test_status=0
          set +e
          MARKFLOW_DIFFERENTIAL_PROGRESS_FILE="$progress_file" \
            bash .github/scripts/run-full-differential-with-watchdog.sh \
              "$progress_file" "$watchdog_file" -- \
              ./gradlew integrationTest -x buildPlugin \
                -PplatformVersion="$STARTER_PLATFORM_VERSION" -PstarterPackagedPlugin=true \
                -PdifferentialContract=acceptance --stacktrace \
                --tests com.algorist.markflow.e2e.MarkFlowStarterDifferentialManifestTest
          test_status=$?
          set -e

          [ "$(sha256sum "$E2E_PLUGIN_PATH" | awk '{print $1}')" = "$E2E_PLUGIN_SHA256" ] || {
            echo "::error::Post-main full differential run mutated the packaged plugin artifact"
            exit 1
          }

          mkdir -p "$pass_dir"
          cp build/e2e-package/manifest.txt "$pass_dir/package-manifest.txt"
          printf 'source_sha=%s\ncontract=acceptance\ntrigger=post-main-push\n' \
            "$STARTER_SOURCE_SHA" > "$pass_dir/run-contract.txt"

          if [ "$test_status" -ne 0 ]; then
            if [ -f "$pass_dir/summary.json" ]; then
              if jq -e '
                .expanded_cases == 89 and
                .captured_unverified == 89 and
                .capture_failed == 0 and
                .not_executed == 0 and
                .candidate_structural_failure_count == 0
              ' "$pass_dir/summary.json" >/dev/null; then
                echo "::notice::All 89 source cases captured; reviewed ledger remains the fail-closed boundary."
              fi
            fi
            exit "$test_status"
          fi

          acceptance="$pass_dir/acceptance.json"
          [ -f "$acceptance" ] || {
            echo "::error::Post-main full differential test returned success without acceptance.json"
            exit 1
          }
          jq -e --arg sha "$STARTER_SOURCE_SHA" '
            .schema == "markflow-full-differential-acceptance/v1" and
            .source_head == $sha and
            .expanded_cases == 89 and
            .reviewed_cases == 89 and
            .full_differential_acceptance == true and
            .release_eligible == false
          ' "$acceptance" >/dev/null || {
            echo "::error::Post-main acceptance verdict is malformed or not exact-SHA"
            cat "$acceptance"
            exit 1
          }

      - name: Upload full differential evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: full-differential-post-main-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: |
            build/e2e-evidence/derived-content/differential-manifest/**
            build/test-results/integrationTest/**
            build/reports/tests/integrationTest/**
            build/e2e-package/manifest.txt
            out/ide-tests/**/log/**
            ${{ runner.temp }}/markflow-full-differential-post-main-xvfb.log
