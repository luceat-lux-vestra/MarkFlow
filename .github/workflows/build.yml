# Pull-request and merged-main validation for the plugin.
#
# Release/publication is intentionally not a continuation of this workflow. An explicit
# GitHub Release event is handled by release.yml after its independent provenance preflight.

name: Build
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact trusted main commit SHA to validate; defaults to the dispatch ref.
        required: false
        type: string

permissions:
  actions: read # Needed to inspect the canonical exact-SHA Build workflow run.
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.target_sha || github.event.pull_request.number || github.ref }}-${{ github.event_name == 'pull_request' && github.event.action == 'edited' && 'metadata' || 'validation' }}
  cancel-in-progress: true

jobs:
  headEvidence:
    name: Head validation evidence
    runs-on: ubuntu-24.04-arm
    # Metadata-only replays may begin while the canonical exact-head validation is still running.
    # The mandatory Test workload now has a 50-minute budget (Gradle check alone took 29m29s).
    # Allow the metadata-only waiter to outlive full canonical evidence without increasing
    # GitHub API polling frequency; unknown/incomplete canonical evidence still fails closed.
    timeout-minutes: 65
    outputs:
      docs_only: ${{ steps.change-scope.outputs.docs_only }}
      dependency_fast_lane: ${{ steps.change-scope.outputs.dependency_fast_lane }}
      dependency_ecosystem: ${{ steps.change-scope.outputs.dependency_ecosystem }}
      run_native: ${{ steps.evidence-scope.outputs.run_native }}
      run_starter: ${{ steps.evidence-scope.outputs.run_starter }}
      reuse_product_evidence: ${{ steps.replacement-evidence.outputs.reuse_product_evidence }}
      prior_head_sha: ${{ steps.replacement-evidence.outputs.prior_head_sha }}
      prior_run_id: ${{ steps.replacement-evidence.outputs.prior_run_id }}
    steps:
      - name: Head validation anchor
        if: ${{ github.event_name != 'pull_request' || github.event.action != 'edited' }}
        run: echo "This run is authoritative validation for the exact head rather than a metadata-only replay."

      - name: Reuse exact-SHA head validation
        if: ${{ github.event_name == 'pull_request' && github.event.action == 'edited' }}
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          for _ in $(seq 1 240); do
            runs="$(gh api -H 'Accept: application/vnd.github+json' "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/runs?event=pull_request&head_sha=$EXPECTED_SHA&per_page=100")"
            while IFS= read -r run_id; do
              [ -n "$run_id" ] || continue
              [ "$run_id" != "$GITHUB_RUN_ID" ] || continue

              status="$(jq -r --arg id "$run_id" '.workflow_runs[] | select((.id | tostring) == $id) | .status' <<<"$runs")"
              [ "$status" = "completed" ] || continue

              jobs="$(gh api -H 'Accept: application/vnd.github+json' "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?filter=latest&per_page=100")"
              anchor_count="$(jq '[.jobs[]
                | select(.name == "Head validation evidence")
                | .steps[]?
                | select(.name == "Head validation anchor" and .conclusion == "success")] | length' <<<"$jobs")"
              [ "$anchor_count" = "1" ] || continue

              valid=true
              for component in "Build" "Test" "Inspect code" "Verify plugin" "Dependency Review"; do
                count="$(jq --arg name "$component" '[.jobs[] | select(.name == $name and .status == "completed" and .conclusion == "success")] | length' <<<"$jobs")"
                if [ "$count" != "1" ]; then
                  valid=false
                  break
                fi
              done
              if [ "$valid" = true ]; then
                echo "Reused canonical exact-SHA product/dependency evidence from run $run_id for $EXPECTED_SHA."
                exit 0
              fi
            done < <(jq -r --arg current "$GITHUB_RUN_ID" --arg sha "$EXPECTED_SHA" '
              [.workflow_runs[]
               | select(.head_sha == $sha)
               | select((.id | tostring) != $current)]
              | sort_by(.id) | reverse | .[].id
            ' <<<"$runs")
            sleep 15
          done
          echo "::error::No completed canonical exact-SHA product/dependency validation became available for metadata-only replay."
          exit 1

      - name: Fetch replacement proof workspace
        if: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' && github.event.pull_request.draft == false }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Resolve replacement-HEAD product evidence
        id: replacement-evidence
        if: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' && github.event.pull_request.draft == false }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trusted_hardening="$GITHUB_WORKSPACE/.github/scripts/.replacement-trusted-hardening-audit.sh"
          trusted_contract="$GITHUB_WORKSPACE/.github/scripts/.replacement-trusted-repository-hardening-contract.sh"
          trusted_seed="$GITHUB_WORKSPACE/.github/scripts/.replacement-trusted-gradle-cache-seed.sh"
          trap 'rm -rf "$tmp"; rm -f "$trusted_hardening" "$trusted_contract" "$trusted_seed"' EXIT

          fetch_content() {
            local ref="$1" path="$2" output="$3"
            gh api -H 'Accept: application/vnd.github+json' \
              "repos/$GITHUB_REPOSITORY/contents/$path?ref=$ref" \
              --jq '.content' | tr -d '\n' | base64 --decode > "$output"
          }

          if ! fetch_content "$BASE_SHA" ".github/scripts/replacement-head-evidence-proof.py" "$tmp/proof.py" || \
             ! fetch_content "$BASE_SHA" ".github/scripts/replacement-head-evidence-reuse.py" "$tmp/classifier.py"; then
            {
              echo "reuse_product_evidence=false"
              echo "prior_head_sha="
              echo "prior_run_id="
            } >> "$GITHUB_OUTPUT"
            echo "Trusted-base replacement proof is unavailable; falling back to FULL CI."
            exit 0
          fi

          if ! fetch_content "$BASE_SHA" ".github/scripts/hardening-audit.sh" "$trusted_hardening" || \
             ! fetch_content "$BASE_SHA" ".github/scripts/repository-hardening-contract.sh" "$trusted_contract" || \
             ! fetch_content "$BASE_SHA" ".github/scripts/check-gradle-cache-seed.sh" "$trusted_seed"; then
            echo "::error::Trusted-base changed-authority verifier is unavailable."
            exit 1
          fi
          chmod 700 "$trusted_hardening" "$trusted_contract" "$trusted_seed"

          python3 -I "$tmp/proof.py" \
            --repository "$GITHUB_REPOSITORY" \
            --pr-number "$PR_NUMBER" \
            --base-sha "$BASE_SHA" \
            --head-sha "$HEAD_SHA" \
            --head-repo "$HEAD_REPO" \
            --event-name "$EVENT_NAME" \
            --event-action "$EVENT_ACTION" \
            --draft "$PR_DRAFT" \
            --classifier "$tmp/classifier.py" \
            --workspace "$GITHUB_WORKSPACE" \
            --trusted-hardening-audit "$trusted_hardening" \
            --trusted-repository-contract "$trusted_contract" \
            --trusted-gradle-cache-seed "$trusted_seed" > "$tmp/proof.out"

          reuse_line="$(grep -E '^reuse_product_evidence=(true|false)$' "$tmp/proof.out" || true)"
          prior_line="$(grep -E '^prior_head_sha=([0-9a-f]{40})?$' "$tmp/proof.out" || true)"
          run_line="$(grep -E '^prior_run_id=([0-9]+)?$' "$tmp/proof.out" || true)"
          reason_line="$(grep -E '^reason=[^[:space:]]+$' "$tmp/proof.out" || true)"
          if [ "$(wc -l < "$tmp/proof.out")" -ne 4 ] || [ -z "$reuse_line" ] || \
             [ -z "$prior_line" ] || [ -z "$run_line" ] || [ -z "$reason_line" ]; then
            echo "::error::Trusted replacement proof returned malformed output."
            cat "$tmp/proof.out" >&2 || true
            exit 1
          fi

          reuse="${reuse_line#*=}"
          prior="${prior_line#*=}"
          prior_run="${run_line#*=}"
          if [ "$reuse" = "true" ]; then
            [[ "$prior" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Reuse proof omitted prior HEAD."; exit 1; }
            [[ "$prior_run" =~ ^[1-9][0-9]*$ ]] || { echo "::error::Reuse proof omitted prior Build run."; exit 1; }
          elif [ -n "$prior" ] || [ -n "$prior_run" ]; then
            echo "::error::Non-reuse proof unexpectedly published prior evidence identity."
            exit 1
          fi

          printf '%s\n' "$reuse_line" "$prior_line" "$run_line" >> "$GITHUB_OUTPUT"
          cat "$tmp/proof.out"
      - name: Classify changed files
        id: change-scope
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_ACTOR: ${{ github.event.pull_request.user.login }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_COUNT: ${{ github.event.pull_request.changed_files }}
        run: |
          set -uo pipefail
          docs_only=false
          dependency_fast_lane=false
          dependency_ecosystem=none
          dependency_reason=not-applicable

          fetch_content() {
            local ref="$1" path="$2" output="$3"
            gh api -H 'Accept: application/vnd.github+json' \
              "repos/$GITHUB_REPOSITORY/contents/$path?ref=$ref" \
              --jq '.content' | tr -d '\n' | base64 --decode > "$output"
          }

          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "Non-PR validation always uses the full product-validation path."
          elif [ "$EVENT_ACTION" = "edited" ]; then
            echo "PR metadata edit uses the dedicated metadata-only fast path."
          elif ! [[ "$EXPECTED_COUNT" =~ ^[1-9][0-9]*$ ]]; then
            echo "::warning::Changed-file count is empty or malformed; using full validation."
          else
            tmp="$(mktemp -d)"
            trap 'rm -rf "$tmp"' EXIT

            if ! gh api --paginate -H 'Accept: application/vnd.github+json' \
              "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" \
              --jq '.[] | [.status, .filename, (.previous_filename // "")] | @tsv' > "$tmp/files"; then
              echo "::warning::Changed-file API read failed; using full validation."
            else
              if fetch_content "$BASE_SHA" ".github/scripts/docs-only-scope.py" "$tmp/docs-classifier.py"; then
                result="$(python3 "$tmp/docs-classifier.py" --expected-count "$EXPECTED_COUNT" < "$tmp/files" 2>"$tmp/docs.err")"
                status=$?
                if [ "$status" -eq 0 ] && { [ "$result" = "true" ] || [ "$result" = "false" ]; }; then
                  docs_only="$result"
                else
                  echo "::warning::Docs-only classifier failed or returned an invalid result; using full validation."
                  cat "$tmp/docs.err" >&2 || true
                fi
              else
                echo "::warning::Trusted base docs-only classifier is unavailable; using full validation."
              fi

              if fetch_content "$BASE_SHA" ".github/scripts/dependency-pr-fast-lane.py" "$tmp/dependency-classifier.py" && \
                 python3 "$tmp/dependency-classifier.py" --self-test >/dev/null; then
                dep_args=(--actor "$PR_ACTOR" --expected-count "$EXPECTED_COUNT")
                dep_inputs_ok=true
                npm_only=true
                while IFS=$'\t' read -r _ path _; do
                  case "$path" in
                    webview/package.json|webview/package-lock.json) ;;
                    *) npm_only=false ;;
                  esac
                done < "$tmp/files"

                gradle_catalog_only=false
                if [ "$(wc -l < "$tmp/files")" -eq 1 ] && \
                   [ "$(cut -f2 "$tmp/files")" = "gradle/libs.versions.toml" ]; then
                  gradle_catalog_only=true
                fi

                if [ "$npm_only" = true ]; then
                  for spec in \
                    "$BASE_SHA:webview/package.json:base-package.json" \
                    "$HEAD_SHA:webview/package.json:head-package.json" \
                    "$BASE_SHA:webview/package-lock.json:base-package-lock.json" \
                    "$HEAD_SHA:webview/package-lock.json:head-package-lock.json"; do
                    ref="${spec%%:*}"
                    rest="${spec#*:}"
                    path="${rest%%:*}"
                    output="${rest#*:}"
                    if ! fetch_content "$ref" "$path" "$tmp/$output"; then
                      dep_inputs_ok=false
                      break
                    fi
                  done
                  if [ "$dep_inputs_ok" = true ]; then
                    dep_args+=(--base-package-json "$tmp/base-package.json")
                    dep_args+=(--head-package-json "$tmp/head-package.json")
                    dep_args+=(--base-package-lock "$tmp/base-package-lock.json")
                    dep_args+=(--head-package-lock "$tmp/head-package-lock.json")
                  fi
                elif [ "$gradle_catalog_only" = true ]; then
                  if fetch_content "$BASE_SHA" "gradle/libs.versions.toml" "$tmp/base-catalog.toml" && \
                     fetch_content "$HEAD_SHA" "gradle/libs.versions.toml" "$tmp/head-catalog.toml"; then
                    dep_args+=(--base-gradle-catalog "$tmp/base-catalog.toml")
                    dep_args+=(--head-gradle-catalog "$tmp/head-catalog.toml")
                  else
                    dep_inputs_ok=false
                  fi
                fi

                if [ "$dep_inputs_ok" = true ] && \
                   python3 "$tmp/dependency-classifier.py" "${dep_args[@]}" < "$tmp/files" > "$tmp/dependency.out" 2>"$tmp/dependency.err"; then
                  mapfile -t dep_lines < "$tmp/dependency.out"
                  fast_line="${dep_lines[0]:-}"
                  ecosystem_line="${dep_lines[1]:-}"
                  reason_line="${dep_lines[2]:-}"
                  if [ "${#dep_lines[@]}" -eq 3 ] && \
                     [[ "$fast_line" =~ ^fast_lane=(true|false)$ ]] && \
                     [[ "$ecosystem_line" =~ ^ecosystem=(npm|gradle|none)$ ]] && \
                     [[ "$reason_line" =~ ^reason=.+$ ]]; then
                    candidate_fast="${fast_line#*=}"
                    candidate_ecosystem="${ecosystem_line#*=}"
                    if [ "$candidate_fast" = "false" ] || \
                       { [ "$candidate_ecosystem" = "npm" ] || [ "$candidate_ecosystem" = "gradle" ]; }; then
                      dependency_fast_lane="$candidate_fast"
                      dependency_ecosystem="$candidate_ecosystem"
                      dependency_reason="${reason_line#*=}"
                    else
                      echo "::warning::Fast-lane classifier returned an invalid fast ecosystem; using full validation."
                    fi
                  else
                    echo "::warning::Fast-lane classifier returned malformed output; using full validation."
                  fi
                else
                  echo "::warning::Fast-lane classifier failed or its trusted inputs were unavailable; using full validation."
                  cat "$tmp/dependency.err" >&2 2>/dev/null || true
                fi
              else
                echo "::warning::Trusted dependency classifier unavailable or self-test failed; using full validation."
              fi
            fi
          fi

          if [ "$docs_only" = "true" ] && [ "$dependency_fast_lane" = "true" ]; then
            echo "::warning::Conflicting trusted scope classifications; disabling dependency fast lane."
            dependency_fast_lane=false
            dependency_ecosystem=none
            dependency_reason=scope-conflict
          fi

          {
            echo "docs_only=$docs_only"
            echo "dependency_fast_lane=$dependency_fast_lane"
            echo "dependency_ecosystem=$dependency_ecosystem"
          } >> "$GITHUB_OUTPUT"
          echo "docs-only fast path: $docs_only"
          echo "dependency fast lane: $dependency_fast_lane ecosystem=$dependency_ecosystem reason=$dependency_reason"

      - name: Route specialized PR evidence using trusted base
        id: evidence-scope
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPECTED_COUNT: ${{ github.event.pull_request.changed_files }}
          DEPENDENCY_FAST_LANE: ${{ steps.change-scope.outputs.dependency_fast_lane }}
        run: |
          set -uo pipefail
          run_native=true
          run_starter=true
          if [ "$EVENT_NAME" = "pull_request" ] && [ "$EVENT_ACTION" = "edited" ]; then
            run_native=false
            run_starter=false
          elif [ "$EVENT_NAME" = "pull_request" ] && [ "$DEPENDENCY_FAST_LANE" = "true" ]; then
            run_native=false
            run_starter=false
            echo "Trusted dependency fast lane makes Native/Starter full-product evidence non-applicable."
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            tmp="$(mktemp -d)"
            trap 'rm -rf "$tmp"' EXIT
            if ! [[ "$EXPECTED_COUNT" =~ ^[1-9][0-9]*$ ]]; then
              echo "::warning::Unknown changed-file count; schedule both proofs."
            elif ! gh api -H 'Accept: application/vnd.github+json' \
              "repos/$GITHUB_REPOSITORY/contents/.github/scripts/pr-ci-evidence-scope.py?ref=$BASE_SHA" \
              --jq '.content' | tr -d '\n' | base64 --decode > "$tmp/router.py"; then
              echo "::warning::Trusted router unavailable; schedule both proofs."
            elif ! python3 "$tmp/router.py" --self-test; then
              echo "::warning::Trusted router fixture failed; schedule both proofs."
            elif ! gh api --paginate -H 'Accept: application/vnd.github+json' \
              "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" \
              --jq '.[] | [.status, .filename, (.previous_filename // "")] | @tsv' > "$tmp/files"; then
              echo "::warning::PR files API unavailable; schedule both proofs."
            elif python3 "$tmp/router.py" --expected-count "$EXPECTED_COUNT" \
              < "$tmp/files" > "$tmp/routes" && \
              [ "$(wc -l < "$tmp/routes")" -eq 2 ]; then
              native_line="$(grep -E '^run_native=(true|false)$' "$tmp/routes" || true)"
              starter_line="$(grep -E '^run_starter=(true|false)$' "$tmp/routes" || true)"
              if [ -n "$native_line" ] && [ -n "$starter_line" ]; then
                run_native="${native_line#*=}"
                run_starter="${starter_line#*=}"
              else
                echo "::warning::Malformed router outputs; schedule both proofs."
              fi
            else
              echo "::warning::Router failed; schedule both proofs."
            fi
          fi
          echo "run_native=$run_native" >> "$GITHUB_OUTPUT"
          echo "run_starter=$run_starter" >> "$GITHUB_OUTPUT"
          echo "Specialized evidence route: native=$run_native starter=$run_starter"

  build:
    name: Build
    needs: [ headEvidence ]
    if: ${{ needs.headEvidence.outputs.reuse_product_evidence != 'true' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    outputs:
      docs_only: ${{ needs.headEvidence.outputs.docs_only }}
    steps:
      - name: Docs-only fast path
        if: ${{ needs.headEvidence.outputs.docs_only == 'true' }}
        run: echo "Trusted-base changed-file classification proved this PR is documentation-only; heavy product validation is skipped."

      - name: Metadata-only event fast path
        if: ${{ github.event_name == 'pull_request' && github.event.action == 'edited' }}
        run: echo "PR metadata changed without a new head; product validation remains bound to the unchanged exact SHA."

      - name: Reuse exact-SHA Fast evidence
        id: fast-evidence
        if: ${{ github.event.action != 'edited' && needs.headEvidence.outputs.docs_only != 'true' && github.event_name == 'pull_request' && github.event.action == 'ready_for_review' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_JOB: Build
          SAME_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          set -euo pipefail
          if [ "$SAME_REPOSITORY" != "true" ]; then
            echo "reuse=false" >> "$GITHUB_OUTPUT"
            echo "Fork PR cannot reuse base-repository Build evidence; Final will execute the local Fast checks."
            exit 0
          fi
          base_workflow_sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/.github/workflows/build.yml?ref=$BASE_SHA" --jq '.sha')"
          head_workflow_sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/.github/workflows/build.yml?ref=$EXPECTED_SHA" --jq '.sha')"
          if [ "$base_workflow_sha" != "$head_workflow_sha" ]; then
            echo "reuse=false" >> "$GITHUB_OUTPUT"
            echo "Build producer workflow changed on this PR; Final will execute the local Fast checks instead of trusting self-modified evidence."
            exit 0
          fi

          for _ in $(seq 1 60); do
            runs="$(gh api -H 'Accept: application/vnd.github+json' "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/runs?event=pull_request&head_sha=$EXPECTED_SHA&per_page=100")"
            latest="$(jq -c --arg sha "$EXPECTED_SHA" --arg current "$GITHUB_RUN_ID" '
              [.workflow_runs[]
               | select(.head_sha == $sha and .event == "pull_request")
               | select((.id | tostring) != $current)]
              | if length == 0 then empty else max_by(.id) end
            ' <<<"$runs")"
            if [ -z "$latest" ]; then
              sleep 5
              continue
            fi
            status="$(jq -r '.status' <<<"$latest")"
            conclusion="$(jq -r '.conclusion // ""' <<<"$latest")"
            if [ "$status" != "completed" ]; then
              sleep 5
              continue
            fi
            if [ "$conclusion" != "success" ]; then
              echo "::error::Canonical Build workflow for exact HEAD $EXPECTED_SHA concluded '$conclusion'; refusing stale or failed evidence."
              exit 1
            fi

            run_id="$(jq -r '.id' <<<"$latest")"
            jobs="$(gh api -H 'Accept: application/vnd.github+json' "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?filter=latest&per_page=100")"
            anchor_count="$(jq '[.jobs[]
              | select(.name == "Head validation evidence")
              | .steps[]?
              | select(.name == "Head validation anchor" and .conclusion == "success")] | length' <<<"$jobs")"
            if [ "$anchor_count" != "1" ]; then
              echo "reuse=false" >> "$GITHUB_OUTPUT"
              echo "Latest prior exact-SHA run is not canonical head validation; executing local Fast checks."
              exit 0
            fi
            matching_jobs="$(jq --arg name "$EXPECTED_JOB" '[.jobs[] | select(.name == $name)] | length' <<<"$jobs")"
            if [ "$matching_jobs" != "1" ]; then
              echo "::error::Canonical Build run $run_id must contain exactly one '$EXPECTED_JOB' job; found $matching_jobs."
              exit 1
            fi
            job_status="$(jq -r --arg name "$EXPECTED_JOB" '.jobs[] | select(.name == $name) | .status' <<<"$jobs")"
            job_conclusion="$(jq -r --arg name "$EXPECTED_JOB" '.jobs[] | select(.name == $name) | (.conclusion // "")' <<<"$jobs")"
            if [ "$job_status" != "completed" ] || [ "$job_conclusion" != "success" ]; then
              echo "::error::Canonical '$EXPECTED_JOB' evidence for exact HEAD $EXPECTED_SHA is status=$job_status conclusion=$job_conclusion."
              exit 1
            fi
            echo "reuse=true" >> "$GITHUB_OUTPUT"
            echo "Reusing canonical successful '$EXPECTED_JOB' evidence for exact HEAD $EXPECTED_SHA."
            exit 0
          done
          echo "::error::Timed out waiting for canonical exact-SHA '$EXPECTED_JOB' evidence at $EXPECTED_SHA."
          exit 1


      - name: Validate dispatched target
        if: ${{ github.event.action != 'edited' && needs.headEvidence.outputs.docs_only != 'true' && (github.event_name != 'pull_request' || github.event.action != 'ready_for_review' || steps.fast-evidence.outputs.reuse != 'true') && github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ inputs.target_sha || github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Recovery target is not an exact 40-hex commit SHA."; exit 1; }
          comparison="$(gh api "repos/$GITHUB_REPOSITORY/compare/$TARGET_SHA...$DEFAULT_BRANCH")"
          status="$(jq -r '.status // empty' <<<"$comparison")"
          base_sha="$(jq -r '.base_commit.sha // empty' <<<"$comparison")"
          merge_base_sha="$(jq -r '.merge_base_commit.sha // empty' <<<"$comparison")"
          if [[ "$base_sha" != "$TARGET_SHA" || "$merge_base_sha" != "$TARGET_SHA" || ( "$status" != "ahead" && "$status" != "identical" ) ]]; then
            echo "::error::Recovery target is not the current default branch or one of its ancestors."
            exit 1
          fi
          printf 'Validated main-history target: %s\n' "$TARGET_SHA"

      - name: Fetch Sources
        if: ${{ github.event.action != 'edited' && needs.headEvidence.outputs.docs_only != 'true' && (github.event_name != 'pull_request' || github.event.action != 'ready_for_review' || steps.fast-evidence.outputs.reuse != 'true') }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'workflow_dispatch' && inputs.target_sha || github.sha }}
          persist-credentials: false


      - name: Record dispatched validation target
        if: ${{ github.event.action != 'edited' && needs.headEvidence.outputs.docs_only != 'true' && (github.event_name != 'pull_request' || github.event.action != 'ready_for_review' || steps.fast-evidence.outputs.reuse != 'true') && github.event_name == 'workflow_dispatch' }}
        env:
          TARGET_SHA: ${{ inputs.target_sha || github.sha }}
        run: |
          printf 'Validation target: %s\n' "$TARGET_SHA"

      - name: Setup Java
        if: ${{ github.event.action != 'edited' && needs.headEvidence.outputs.docs_only != 'true' && (github.event_name != 'pull_request' || github.event.action != 'ready_for_review' || steps.fast-evidence.outputs.reuse != 'true') }}
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: zulu
          java-version: 25


      - name: Setup Gradle
        if: ${{ github.event.action != 'edited' && needs.headEvidence.outputs.docs_only != 'true' && (github.event_name != 'pull_request' || github.event.action != 'ready_for_review' || steps.fast-evidence.outputs.reuse != 'true') }}
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build plugin
        if: ${{ github.event.action != 'edited' && needs.headEvidence.outputs.docs_only != 'true' && (github.event_name != 'pull_request' || github.event.action != 'ready_for_review' || steps.fast-evidence.outputs.reuse != 'true') }}
        run: ./gradlew buildPlugin

      - name: Enforce renderer bundle budget
        if: ${{ github.event.action != 'edited' && needs.headEvidence.outputs.docs_only != 'true' && (github.event_name != 'pull_request' || github.event.action != 'ready_for_review' || steps.fast-evidence.outputs.reuse != 'true') }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('build/webview/derived-renderer-assets')
          scripts = sorted(root.rglob('*.js'))
          if not scripts:
              raise SystemExit('renderer build produced no JavaScript assets')

          # Mermaid 12's full ESM build emits ELK as a separate lazy chunk.
          # Keep the pre-v12 core tripwires unchanged and budget that upstream
          # optional payload independently rather than weakening core limits.
          elk_scripts = [path for path in scripts if path.name.startswith('elk-')]
          if len(elk_scripts) != 1:
              raise SystemExit(
                  f'expected exactly one Mermaid ELK lazy chunk, found {[path.name for path in elk_scripts]}'
              )
          elk_asset = elk_scripts[0]
          core_scripts = [path for path in scripts if path != elk_asset]
          if not core_scripts:
              raise SystemExit('renderer build produced no non-ELK JavaScript assets')

          core_max_asset = max(core_scripts, key=lambda path: path.stat().st_size)
          core_max_bytes = core_max_asset.stat().st_size
          core_total_bytes = sum(path.stat().st_size for path in core_scripts)
          elk_bytes = elk_asset.stat().st_size
          total_bytes = core_total_bytes + elk_bytes

          core_max_budget = 700 * 1024
          core_total_budget = 4000 * 1024
          elk_budget = 1536 * 1024

          report = {
              'schemaVersion': 2,
              'scriptCount': len(scripts),
              'coreScriptCount': len(core_scripts),
              'coreMaxSingleJsBytes': core_max_bytes,
              'coreMaxSingleJsPath': core_max_asset.relative_to(root).as_posix(),
              'coreTotalJsBytes': core_total_bytes,
              'elkJsBytes': elk_bytes,
              'elkJsPath': elk_asset.relative_to(root).as_posix(),
              'totalJsBytes': total_bytes,
              'budgets': {
                  'coreMaxSingleJsBytes': core_max_budget,
                  'coreTotalJsBytes': core_total_budget,
                  'elkJsBytes': elk_budget,
              },
          }
          report_path = Path('build/reports/renderer-bundle-budget.json')
          report_path.parent.mkdir(parents=True, exist_ok=True)
          report_path.write_text(json.dumps(report, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(report, sort_keys=True))

          if core_max_bytes > core_max_budget:
              raise SystemExit(
                  f'largest non-ELK renderer JS asset {core_max_asset.name} is {core_max_bytes} bytes; '
                  f'budget is {core_max_budget}'
              )
          if core_total_bytes > core_total_budget:
              raise SystemExit(
                  f'non-ELK renderer JS total is {core_total_bytes} bytes; budget is {core_total_budget}'
              )
          if elk_bytes > elk_budget:
              raise SystemExit(
                  f'Mermaid ELK lazy chunk {elk_asset.name} is {elk_bytes} bytes; budget is {elk_budget}'
              )
          PY

      - name: Prepare Plugin Artifact
        if: ${{ github.event.action != 'edited' && needs.headEvidence.outputs.docs_only != 'true' && (github.event_name != 'pull_request' || github.event.action != 'ready_for_review' || steps.fast-evidence.outputs.reuse != 'true') }}
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          cd build/distributions
          shopt -s nullglob
          artifacts=(./*.zip)
          if [ "${#artifacts[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one plugin distribution, found ${#artifacts[@]}."
            exit 1
          fi
          filename="${artifacts[0]#./}"
          unzip "$filename" -d content
          printf 'filename=%s\n' "${filename%.zip}" >> "$GITHUB_OUTPUT"

      - name: Verify packaged webview is renderer-only
        if: ${{ github.event.action != 'edited' && needs.headEvidence.outputs.docs_only != 'true' && (github.event_name != 'pull_request' || github.event.action != 'ready_for_review' || steps.fast-evidence.outputs.reuse != 'true') }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          root = Path("build/distributions/content")
          jars = sorted(root.rglob("*.jar"))
          if not jars:
              raise SystemExit("packaged plugin contains no JARs to inspect")

          plugin_jars = []
          for jar in jars:
              with ZipFile(jar) as archive:
                  if "META-INF/plugin.xml" not in archive.namelist():
                      continue
                  descriptor = archive.read("META-INF/plugin.xml").decode("utf-8", errors="replace")
                  if "<id>com.algorist.markflow</id>" in descriptor:
                      plugin_jars.append(jar)

          if len(plugin_jars) != 1:
              raise SystemExit(f"expected one MarkFlow plugin JAR, found {plugin_jars}")

          with ZipFile(plugin_jars[0]) as archive:
              web_entries = [name for name in archive.namelist() if name.startswith("webview/")]

          if "webview/derived-renderer.html" not in web_entries:
              raise SystemExit("packaged plugin is missing webview/derived-renderer.html")

          forbidden = sorted(
              name for name in web_entries
              if name not in {"webview/", "webview/derived-renderer.html"}
              and not name.startswith("webview/derived-renderer-assets/")
          )
          if forbidden:
              raise SystemExit(f"obsolete/non-renderer webview assets were packaged: {forbidden}")

          assets = [
              name for name in web_entries
              if name.startswith("webview/derived-renderer-assets/")
              and name != "webview/derived-renderer-assets/"
          ]
          if not assets:
              raise SystemExit("packaged plugin contains no derived-renderer asset files")

          print(f"renderer-only packaged webview entries: {len(web_entries)}")
          PY

      - name: Upload artifact
        if: ${{ github.event.action != 'edited' && needs.headEvidence.outputs.docs_only != 'true' && (github.event_name != 'pull_request' || github.event.action != 'ready_for_review' || steps.fast-evidence.outputs.reuse != 'true') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ steps.artifact.outputs.filename }}
          path: ./build/distributions/content/*/*

      - name: Upload renderer bundle budget
        if: ${{ github.event.action != 'edited' && needs.headEvidence.outputs.docs_only != 'true' && (github.event_name != 'pull_request' || github.event.action != 'ready_for_review' || steps.fast-evidence.outputs.reuse != 'true') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: renderer-bundle-budget
          path: build/reports/renderer-bundle-budget.json
          if-no-files-found: error

  test:
    name: Test
    needs: [ headEvidence ]
    if: ${{ needs.headEvidence.outputs.reuse_product_evidence != 'true' }}
    runs-on: ubuntu-24.04-arm
    # Exact-head 96332952: ./gradlew check finished SUCCESSFUL in 29m29s,
    # but GitHub then cancelled the 30m job before mandatory webview source
    # tests/coverage upload. This is a job deadline, not a failed test.
    # Preserve ALL checks and fail-closed Merge Gate; allow the full observed
    # workload to complete without adding runners or skipping webview tests.
    timeout-minutes: 50
    steps:
      - name: Docs-only fast path
        if: ${{ needs.headEvidence.outputs.docs_only == 'true' }}
        run: echo "Trusted-base changed-file classification proved this PR is documentation-only; heavy product validation is skipped."

      - name: Metadata-only event fast path
        if: ${{ github.event_name == 'pull_request' && github.event.action == 'edited' }}
        run: echo "PR metadata changed without a new head; product validation remains bound to the unchanged exact SHA."

      - name: Reuse exact-SHA Fast evidence
        id: fast-evidence
        if: ${{ github.event.action != 'edited' && needs.headEvidence.outputs.docs_only != 'true' && github.event_name == 'pull_request' && github.event.action == 'ready_for_review' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_JOB: Test
          SAME_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          set -euo pipefail
          if [ "$SAME_REPOSITORY" != "true" ]; then
            echo "reuse=false" >> "$GITHUB_OUTPUT"
            echo "Fork PR cannot reuse base-repository Build evidence; Final will execute the local Fast checks."
            exit 0
          fi
          base_workflow_sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/.github/workflows/build.yml?ref=$BASE_SHA" --jq '.sha')"
          head_workflow_sha="$(gh api "repos/$GITHUB_REPOSITORY/contents/.github/workflows/build.yml?ref=$EXPECTED_SHA" --jq '.sha')"
          if [ "$base_workflow_sha" != "$head_workflow_sha" ]; then
            echo "reuse=false" >> "$GITHUB_OUTPUT"
            echo "Build producer workflow changed on this PR; Final will execute the local Fast checks instead of trusting self-modified evidence."
            exit 0
          fi

          for _ in $(seq 1 60); do
            runs="$(gh api -H 'Accept: application/vnd.github+json' "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/runs?event=pull_request&head_sha=$EXPECTED_SHA&per_page=100")"
            latest="$(jq -c --arg sha "$EXPECTED_SHA" --arg current "$GITHUB_RUN_ID" '
              [.workflow_runs[]
               | select(.head_sha == $sha and .event == "pull_request")
               | select((.id | tostring) != $current)]
              | if length == 0 then empty else max_by(.id) end
            ' <<<"$runs")"
            if [ -z "$latest" ]; then
              sleep 5
              continue
            fi
            status="$(jq -r '.status' <<<"$latest")"
            conclusion="$(jq -r '.conclusion // ""' <<<"$latest")"
            if [ "$status" != "completed" ]; then
              sleep 5
              continue
            fi
            if [ "$conclusion" != "success" ]; then
              echo "::error::Canonical Build workflow for exact HEAD $EXPECTED_SHA concluded '$conclusion'; refusing stale or failed evidence."
              exit 1
            fi

            run_id="$(jq -r '.id' <<<"$latest")"
            jobs="$(gh api -H 'Accept: application/vnd.github+json' "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?filter=latest&per_page=100")"
            anchor_count="$(jq '[.jobs[]
              | select(.name == "Head validation evidence")
              | .steps[]?
              | select(.name == "Head validation anchor" and .conclusion == "success")] | length' <<<"$jobs")"
            if [ "$anchor_count" != "1" ]; then
              echo "reuse=false" >> "$GITHUB_OUTPUT"
              echo "Latest prior exact-SHA run is not canonical head validation; executing local Fast checks."
              exit 0
            fi
            matching_jobs="$(jq --arg name "$EXPECTED_JOB" '[.jobs[] | select(.name == $name)] | length' <<<"$jobs")"
            if [ "$matching_jobs" != "1" ]; then
              echo "::error::Canonical Build run $run_id must contain exactly one '$EXPECTED_JOB' job; found $matching_jobs."
              exit 1
            fi
            job_status="$(jq -r --arg name "$EXPECTED_JOB" '.jobs[] | select(.name == $name) | .status' <<<"$jobs")"
            job_conclusion="$(jq -r --arg name "$EXPECTED_JOB" '.jobs[] | select(.name == $name) | (.conclusion // "")' <<<"$jobs")"
            if [ "$job_status" != "completed" ] || [ "$job_conclusion" != "success" ]; then
              echo "::error::Canonical '$EXPECTED_JOB' evidence for exact HEAD $EXPECTED_SHA is status=$job_status conclusion=$job_conclusion."
              exit 1
            fi
            echo "reuse=true" >> "$GITHUB_OUTPUT"
            echo "Reusing canonical successful '$EXPECTED_JOB' evidence for exact HEAD $EXPECTED_SHA."
            exit 0
          done
          echo "::error::Timed out waiting for canonical exact-SHA '$EXPECTED_JOB' evidence at $EXPECTED_SHA."
          exit 1


      - name: Fetch Sources
        if: ${{ github.event.action != 'edited' && needs.headEvidence.outputs.docs_only != 'true' && (github.event_name != 'pull_request' || github.event.action != 'ready_for_review' || steps.fast-evidence.outputs.reuse != 'true') }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'workflow_dispatch' && inputs.target_sha || github.sha }}
          persist-credentials: false

      # Trusted-base routing is intentionally unavailable to the introducing PR.
      # Exercise its untrusted candidate implementation separately from authority.
      - name: Validate exact-head PR evidence routing contract
        if: ${{ github.event_name == 'pull_request' && github.event.action != 'edited' && needs.headEvidence.outputs.docs_only != 'true' && (github.event.action != 'ready_for_review' || steps.fast-evidence.outputs.reuse != 'true') }}
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          expected_sha="${{ github.event.pull_request.head.sha }}"
          [ "$actual_sha" = "$expected_sha" ] || {
            echo "::error::Routing self-test checkout drift: expected=$expected_sha actual=$actual_sha"
            exit 1
          }
          python3 -I .github/scripts/pr-ci-evidence-scope.py --self-test
          expected=$'run_native=true\nrun_starter=true'
          actual="$(printf 'modified\t.github/workflows/build.yml\t\n' |
            python3 -I .github/scripts/pr-ci-evidence-scope.py --expected-count 1)"
          [ "$actual" = "$expected" ] || {
            echo "::error::Routing CLI did not conservatively select both authorities."
            printf 'actual route: %s\n' "$actual"
            exit 1
          }
          echo "Exact-head PR routing self-test, negative fixtures, and CLI integration passed."

      - name: Setup Java
        if: ${{ github.event.action != 'edited' && needs.headEvidence.outputs.docs_only != 'true' && (github.event_name != 'pull_request' || github.event.action != 'ready_for_review' || steps.fast-evidence.outputs.reuse != 'true') }}
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: zulu
          java-version: 25


      - name: Setup Gradle
        if: ${{ github.event.action != 'edited' && needs.headEvidence.outputs.docs_only != 'true' && (github.event_name != 'pull_request' || github.event.action != 'ready_for_review' || steps.fast-evidence.outputs.reuse != 'true') }}
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      - name: Run dependency fast-lane checks
        if: ${{ github.event.action != 'edited' && needs.headEvidence.outputs.docs_only != 'true' && needs.headEvidence.outputs.dependency_fast_lane == 'true' && (github.event_name != 'pull_request' || github.event.action != 'ready_for_review' || steps.fast-evidence.outputs.reuse != 'true') }}
        env:
          DEPENDENCY_ECOSYSTEM: ${{ needs.headEvidence.outputs.dependency_ecosystem }}
        shell: bash
        run: |
          set -euo pipefail
          case "$DEPENDENCY_ECOSYSTEM" in
            npm)
              ./gradlew testWebviewDependencyContract
              ;;
            gradle)
              ./gradlew testClasses integrationTestClasses
              ;;
            *)
              echo "::error::Trusted dependency fast lane selected unknown ecosystem '$DEPENDENCY_ECOSYSTEM'."
              exit 1
              ;;
          esac

      - name: Run Tests
        if: ${{ github.event.action != 'edited' && needs.headEvidence.outputs.docs_only != 'true' && needs.headEvidence.outputs.dependency_fast_lane != 'true' && (github.event_name != 'pull_request' || github.event.action != 'ready_for_review' || steps.fast-evidence.outputs.reuse != 'true') }}
        shell: bash
        run: |
          set -euo pipefail
          # IDEA BasePlatformTestCase's editor is detached from Swing by
          # default. #350's actual EditorImpl AWT route test attaches it to
          # a visible frame; never synthesize a passed click in headless mode.
          command -v Xvfb
          Xvfb :99 -screen 0 1920x1080x24 >"$RUNNER_TEMP/markflow-platform-unit-xvfb.log" 2>&1 &
          xvfb_pid=$!
          trap 'kill "$xvfb_pid" 2>/dev/null || true' EXIT
          export DISPLAY=:99
          for attempt in {1..30}; do
            test -S /tmp/.X11-unix/X99 && break
            echo "Waiting for the test Xvfb socket (attempt ${attempt}/30)"
            sleep 0.2
          done
          test -S /tmp/.X11-unix/X99 || {
            echo "::error::Platform unit test Xvfb failed to start"
            cat "$RUNNER_TEMP/markflow-platform-unit-xvfb.log"
            exit 1
          }
          bash .github/scripts/run-test-with-diagnostics.sh

      - name: Upload stalled-test diagnostic evidence
        if: ${{ always() && github.event.action != 'edited' && needs.headEvidence.outputs.docs_only != 'true' && needs.headEvidence.outputs.dependency_fast_lane != 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: arm64-test-hang-diagnostics
          path: ${{ runner.temp }}/markflow-test-hang/evidence/
          if-no-files-found: ignore

      # Native ARM64 hosted images lack Chromium; all 40 real browser cases remain mandatory.
      - name: Install native ARM64 Chromium for webview acceptance
        if: ${{ github.event.action != 'edited' && needs.headEvidence.outputs.docs_only != 'true' && needs.headEvidence.outputs.dependency_fast_lane != 'true' && (github.event_name != 'pull_request' || github.event.action != 'ready_for_review' || steps.fast-evidence.outputs.reuse != 'true') }}
        shell: bash
        run: |
          set -euo pipefail
          [ "$(uname -m)" = "aarch64" ] && [ "$RUNNER_ARCH" = "ARM64" ]
          sudo apt-get update
          sudo apt-get install -y chromium-browser
          /snap/bin/chromium --version

      - name: Run webview source tests
        if: ${{ github.event.action != 'edited' && needs.headEvidence.outputs.docs_only != 'true' && needs.headEvidence.outputs.dependency_fast_lane != 'true' && (github.event_name != 'pull_request' || github.event.action != 'ready_for_review' || steps.fast-evidence.outputs.reuse != 'true') }}
        env:
          CHROME_BIN: /snap/bin/chromium
        run: ./gradlew testWebviewSource

      - name: Collect Tests Result
        if: ${{ github.event.action != 'edited' && needs.headEvidence.outputs.docs_only != 'true' && needs.headEvidence.outputs.dependency_fast_lane != 'true' && (github.event_name != 'pull_request' || github.event.action != 'ready_for_review' || steps.fast-evidence.outputs.reuse != 'true') && failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tests-result
          path: ${{ github.workspace }}/build/reports/tests

      - name: Upload Kover Coverage Report
        if: ${{ github.event.action != 'edited' && needs.headEvidence.outputs.docs_only != 'true' && needs.headEvidence.outputs.dependency_fast_lane != 'true' && (github.event_name != 'pull_request' || github.event.action != 'ready_for_review' || steps.fast-evidence.outputs.reuse != 'true') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: kover-coverage
          path: ${{ github.workspace }}/build/reports/kover/report.xml
          if-no-files-found: error

  inspectCode:
    name: Inspect code
    needs: [ headEvidence ]
    if: ${{ needs.headEvidence.outputs.reuse_product_evidence != 'true' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - name: Docs-only fast path
        if: ${{ needs.headEvidence.outputs.docs_only == 'true' }}
        run: echo "Trusted-base changed-file classification proved this PR is documentation-only; heavy product validation is skipped."

      - name: Metadata-only event fast path
        if: ${{ github.event_name == 'pull_request' && github.event.action == 'edited' }}
        run: echo "PR metadata changed without a new head; product validation remains bound to the unchanged exact SHA."


      - name: Dependency fast lane
        if: ${{ needs.headEvidence.outputs.dependency_fast_lane == 'true' }}
        run: echo "Trusted ordinary-dependency fast lane makes Qodana full-product inspection non-applicable."

      - name: Fetch Sources
        if: ${{ github.event.action != 'edited' && needs.headEvidence.outputs.docs_only != 'true' && needs.headEvidence.outputs.dependency_fast_lane != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'workflow_dispatch' && inputs.target_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Java
        if: ${{ github.event.action != 'edited' && needs.headEvidence.outputs.docs_only != 'true' && needs.headEvidence.outputs.dependency_fast_lane != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: zulu
          java-version: 25

      - name: Qodana - Code Inspection
        if: ${{ github.event.action != 'edited' && needs.headEvidence.outputs.docs_only != 'true' && needs.headEvidence.outputs.dependency_fast_lane != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
        uses: JetBrains/qodana-action@3e8d76ff0e0241618abd808682f426afe84bab3f # v2026.2.2
        with:
          args: --image jetbrains/qodana-jvm-community:2026.2 --clear-cache
          use-caches: false
          upload-result: true

      # The Qodana annotation/check output is not the authoritative gate. Missing or
      # malformed SARIF, scanner failure, and High/Critical findings all fail this job.
      - name: Enforce Qodana High severity gate
        if: ${{ github.event.action != 'edited' && needs.headEvidence.outputs.docs_only != 'true' && needs.headEvidence.outputs.dependency_fast_lane != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && always() }}
        env:
          QODANA_RESULTS_DIR: ${{ runner.temp }}/qodana/results
        run: |
          set -euo pipefail
          report="$QODANA_RESULTS_DIR/qodana.sarif.json"
          if [[ ! -s "$report" ]]; then
            echo "::error::Qodana did not produce qodana.sarif.json; treating the scan as failed."
            exit 1
          fi
          high_count="$(jq '[.runs[]?.results[]? | select(.properties.qodanaSeverity == "High" or .properties.qodanaSeverity == "Critical")] | length' "$report")"
          if (( high_count > 0 )); then
            echo "::error::Qodana reported $high_count High/Critical problem(s)."
            exit 1
          fi
          echo "Qodana High severity gate passed (High/Critical findings: 0)."

  verify:
    name: Verify plugin
    needs: [ headEvidence ]
    if: ${{ needs.headEvidence.outputs.reuse_product_evidence != 'true' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - name: Docs-only fast path
        if: ${{ needs.headEvidence.outputs.docs_only == 'true' }}
        run: echo "Trusted-base changed-file classification proved this PR is documentation-only; heavy product validation is skipped."

      - name: Metadata-only event fast path
        if: ${{ github.event_name == 'pull_request' && github.event.action == 'edited' }}
        run: echo "PR metadata changed without a new head; product validation remains bound to the unchanged exact SHA."


      - name: Dependency fast lane
        if: ${{ needs.headEvidence.outputs.dependency_fast_lane == 'true' }}
        run: echo "Trusted ordinary-dependency fast lane makes Plugin Verifier non-applicable."

      - name: Fetch Sources
        if: ${{ github.event.action != 'edited' && needs.headEvidence.outputs.docs_only != 'true' && needs.headEvidence.outputs.dependency_fast_lane != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'workflow_dispatch' && inputs.target_sha || github.sha }}
          persist-credentials: false

      - name: Setup Java
        if: ${{ github.event.action != 'edited' && needs.headEvidence.outputs.docs_only != 'true' && needs.headEvidence.outputs.dependency_fast_lane != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: zulu
          java-version: 25


      - name: Setup Gradle
        if: ${{ github.event.action != 'edited' && needs.headEvidence.outputs.docs_only != 'true' && needs.headEvidence.outputs.dependency_fast_lane != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      - name: Run Plugin Verification tasks
        if: ${{ github.event.action != 'edited' && needs.headEvidence.outputs.docs_only != 'true' && needs.headEvidence.outputs.dependency_fast_lane != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
        run: ./gradlew verifyPlugin

      - name: Collect Plugin Verifier Result
        if: ${{ github.event.action != 'edited' && needs.headEvidence.outputs.docs_only != 'true' && needs.headEvidence.outputs.dependency_fast_lane != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) && always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pluginVerifier-result
          path: ${{ github.workspace }}/build/reports/pluginVerifier

  metadataSafety:
    name: PR Metadata Safety
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - name: Non-PR recovery fast path
        if: ${{ github.event_name != 'pull_request' }}
        run: echo "PR metadata safety is not applicable to trusted exact-SHA recovery."

      - name: Check out exact PR head for squash-message policy
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Verify canonical squash metadata policy
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          set -euo pipefail
          jq -e '
            .repository_settings.squash_merge_commit_title == "PR_TITLE"
            and .repository_settings.squash_merge_commit_message == "BLANK"
          ' .github/merge-gate-policy.json >/dev/null

      - name: Reject squash-title CI-skip directives
        if: ${{ github.event_name == 'pull_request' }}
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python3 .github/scripts/check-squash-message-safety.py

  dependencyReview:
    name: Dependency Review
    needs: [ headEvidence ]
    if: ${{ needs.headEvidence.outputs.reuse_product_evidence != 'true' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - name: Non-dependency event fast path
        if: ${{ github.event_name != 'pull_request' || github.event.action == 'edited' || github.event.pull_request.draft == true }}
        run: echo "Dependency diff is unchanged or not applicable for this event."

      - name: Review dependency changes
        if: ${{ github.event_name == 'pull_request' && github.event.action != 'edited' && github.event.pull_request.draft == false }}
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate


  nativeEvidence:
    name: Native Runtime Evidence
    needs: [ headEvidence ]
    if: ${{ github.event_name == 'pull_request' && github.event.action != 'edited' && github.event.pull_request.draft == false && needs.headEvidence.outputs.reuse_product_evidence != 'true' && needs.headEvidence.outputs.run_native == 'true' }}
    # Compatibility: actionlint v1.7.12 rejects GitHub's new `$/` syntax.
    # See rhysd/actionlint#711; preserve local reusable workflow validation.
    # Only this exact same-commit call defers zizmor's self-repository migration.
    uses: ./.github/workflows/native-runtime-evidence.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read
      pull-requests: read

  starterEvidence:
    name: Starter Driver E2E
    needs: [ headEvidence ]
    if: ${{ github.event_name == 'pull_request' && github.event.action != 'edited' && github.event.pull_request.draft == false && needs.headEvidence.outputs.reuse_product_evidence != 'true' && needs.headEvidence.outputs.run_starter == 'true' }}
    # Compatibility: actionlint v1.7.12 rejects GitHub's new `$/` syntax.
    # See rhysd/actionlint#711; preserve local reusable workflow validation.
    # Only this exact same-commit call defers zizmor's self-repository migration.
    uses: ./.github/workflows/starter-driver-e2e.yml # zizmor: ignore[self-repository]
    permissions:
      contents: read

  mergeGate:
    name: Merge Gate
    needs: [ headEvidence, build, test, inspectCode, verify, metadataSafety, dependencyReview, nativeEvidence, starterEvidence ]
    if: ${{ always() }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - name: Require every authoritative component
        env:
          HEAD_RESULT: ${{ needs.headEvidence.result }}
          ACTIVE_PR: ${{ github.event_name == 'pull_request' && github.event.action != 'edited' && github.event.pull_request.draft == false }}
          NATIVE_ROUTE: ${{ needs.headEvidence.outputs.run_native }}
          STARTER_ROUTE: ${{ needs.headEvidence.outputs.run_starter }}
          NATIVE_RESULT: ${{ needs.nativeEvidence.result }}
          STARTER_RESULT: ${{ needs.starterEvidence.result }}
          REUSE_PRODUCT_EVIDENCE: ${{ needs.headEvidence.outputs.reuse_product_evidence }}
          PRIOR_HEAD_SHA: ${{ needs.headEvidence.outputs.prior_head_sha }}
          PRIOR_RUN_ID: ${{ needs.headEvidence.outputs.prior_run_id }}
          BUILD_RESULT: ${{ needs.build.result }}
          TEST_RESULT: ${{ needs.test.result }}
          INSPECT_CODE_RESULT: ${{ needs.inspectCode.result }}
          VERIFY_PLUGIN_RESULT: ${{ needs.verify.result }}
          PR_METADATA_SAFETY_RESULT: ${{ needs.metadataSafety.result }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependencyReview.result }}
        run: |
          set -euo pipefail
          failed=0
          if [ "$REUSE_PRODUCT_EVIDENCE" = "true" ]; then
            product_expected=skipped
            if ! [[ "$PRIOR_HEAD_SHA" =~ ^[0-9a-f]{40}$ && "$PRIOR_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::Replacement evidence reuse lacks exact prior evidence identity."
              failed=1
            fi
          else
            product_expected=success
          fi

          for component in \
            "Build=$BUILD_RESULT" \
            "Test=$TEST_RESULT" \
            "Inspect code=$INSPECT_CODE_RESULT" \
            "Verify plugin=$VERIFY_PLUGIN_RESULT" \
            "Dependency Review=$DEPENDENCY_REVIEW_RESULT"; do
            name="${component%%=*}"
            result="${component#*=}"
            if [ "$result" != "$product_expected" ]; then
              echo "::error::$name requires '$product_expected' when reuse=$REUSE_PRODUCT_EVIDENCE; got '$result'."
              failed=1
            fi
          done

          if [ "$PR_METADATA_SAFETY_RESULT" != "success" ]; then
            echo "::error::PR Metadata Safety concluded '$PR_METADATA_SAFETY_RESULT'; Merge Gate fails closed."
            failed=1
          fi

          if [ "$HEAD_RESULT" != "success" ]; then
            echo "::error::Trusted routing head failed: $HEAD_RESULT"
            failed=1
          fi
          for proof in "Native:$NATIVE_ROUTE:$NATIVE_RESULT" "Starter:$STARTER_ROUTE:$STARTER_RESULT"; do
            name="${proof%%:*}"
            rest="${proof#*:}"
            route="${rest%%:*}"
            result="${rest#*:}"
            if [ "$REUSE_PRODUCT_EVIDENCE" = "true" ]; then
              expected=skipped
            elif [ "$ACTIVE_PR" = "true" ]; then
              case "$route" in
                true) expected=success ;;
                false) expected=skipped ;;
                *) echo "::error::$name has unknown route '$route'"; failed=1; continue ;;
              esac
            else
              expected=skipped
            fi
            if [ "$result" != "$expected" ]; then
              echo "::error::$name requires '$expected' from route '$route'; got '$result'"
              failed=1
            fi
          done
          [ "$failed" -eq 0 ]
          if [ "$REUSE_PRODUCT_EVIDENCE" = "true" ]; then
            echo "Reused canonical full-product evidence from Build run $PRIOR_RUN_ID at $PRIOR_HEAD_SHA; current replacement Hardening authority was verified by Head validation evidence."
          else
            echo "All mandatory and route-selected runtime proof jobs succeeded."
          fi

