name: Fix 155 Normalizer

on:
  pull_request:
    paths:
      - '.github/workflows/fix-155-normalizer.yml'

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Fix raw-string matcher and push
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/normalize-155-convergence.yml')
          lines = p.read_text(encoding='utf-8').splitlines()
          matches = [i for i, line in enumerate(lines) if 'renderer probe security payload' in line]
          if len(matches) != 1:
              raise SystemExit(f'expected one renderer probe matcher, found {len(matches)}')
          i = matches[0]
          prefix = lines[i][:len(lines[i]) - len(lines[i].lstrip())]
          lines[i] = prefix + "t = one(t, '\"diagramSecurityLevel\":\"STRICT\",', '', 'renderer probe security payload')"
          p.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/normalize-155-convergence.yml
          git commit -m 'ci(leap): correct #155 raw-string matcher'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
