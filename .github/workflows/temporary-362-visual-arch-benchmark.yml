# lifecycle-owner: issue #362 / PR #462
# lifecycle-retire: delete after the x64/ARM64 warm-cache visual comparison selects one production runner, before PR #462 is marked Ready
name: MarkFlow 362 x64 ARM64 Visual Benchmark (temporary)

on:
  push:
    branches:
      - ci/362-arm-visual-production-candidate
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: markflow-362-visual-arch-benchmark
  cancel-in-progress: true

env:
  BENCHMARK_PLATFORM_VERSION: '2026.2.3'
  BENCHMARK_SOURCE_SHA: ${{ github.sha }}

jobs:
  seed:
    name: Warm Gradle cache (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
          - arch: x64
            runner: ubuntu-24.04
    steps:
      - name: Fetch exact benchmark source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BENCHMARK_SOURCE_SHA }}
          persist-credentials: false

      - name: Verify exact benchmark source
        run: test "$(git rev-parse HEAD)" = "$BENCHMARK_SOURCE_SHA"

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: zulu
          java-version: 25

      - name: Setup Gradle benchmark cache writer
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: false

      - name: Seed IDEA 2026.2.3 plugin build cache
        run: ./gradlew buildPlugin -PplatformVersion="$BENCHMARK_PLATFORM_VERSION" --stacktrace

  package:
    name: Build one exact benchmark plugin
    needs: [ seed ]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - name: Fetch exact benchmark source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BENCHMARK_SOURCE_SHA }}
          persist-credentials: false

      - name: Verify exact benchmark source
        run: test "$(git rev-parse HEAD)" = "$BENCHMARK_SOURCE_SHA"

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: zulu
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      - name: Build exact plugin once
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew buildPlugin -PplatformVersion="$BENCHMARK_PLATFORM_VERSION" --stacktrace
          mapfile -t archives < <(find build/distributions -maxdepth 1 -type f -name '*.zip' -print | sort)
          [ "${#archives[@]}" -eq 1 ] || {
            echo "::error::Expected exactly one benchmark plugin ZIP, found ${#archives[@]}"
            exit 1
          }
          mkdir -p build/benchmark-package
          cp "${archives[0]}" build/benchmark-package/plugin.zip
          {
            echo "source_sha=$BENCHMARK_SOURCE_SHA"
            echo "platform_version=$BENCHMARK_PLATFORM_VERSION"
            echo "plugin_sha256=$(sha256sum build/benchmark-package/plugin.zip | awk '{print $1}')"
          } > build/benchmark-package/manifest.txt

      - name: Upload exact benchmark plugin
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: markflow-362-visual-benchmark-plugin-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 7
          path: build/benchmark-package/**

  visual:
    name: Strict visual benchmark (${{ matrix.arch }})
    needs: [ seed, package ]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
            runner_arch: ARM64
            uname: aarch64
            install_visual_runtime: true
          - arch: x64
            runner: ubuntu-24.04
            runner_arch: X64
            uname: x86_64
            install_visual_runtime: false
    steps:
      - name: Fetch exact benchmark source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BENCHMARK_SOURCE_SHA }}
          persist-credentials: false

      - name: Verify exact benchmark source and architecture
        shell: bash
        env:
          EXPECTED_RUNNER_ARCH: ${{ matrix.runner_arch }}
          EXPECTED_UNAME: ${{ matrix.uname }}
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$BENCHMARK_SOURCE_SHA" ]
          [ "$RUNNER_ARCH" = "$EXPECTED_RUNNER_ARCH" ]
          [ "$(uname -m)" = "$EXPECTED_UNAME" ]

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: zulu
          java-version: 25

      - name: Setup Gradle from same-branch warm cache
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      - name: Download exact benchmark plugin
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: markflow-362-visual-benchmark-plugin-${{ github.run_id }}
          path: build/benchmark-package

      - name: Restore and verify exact benchmark plugin
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(sed -n 's/^source_sha=//p' build/benchmark-package/manifest.txt)"
          platform_version="$(sed -n 's/^platform_version=//p' build/benchmark-package/manifest.txt)"
          expected_sha="$(sed -n 's/^plugin_sha256=//p' build/benchmark-package/manifest.txt)"
          [ "$source_sha" = "$BENCHMARK_SOURCE_SHA" ]
          [ "$platform_version" = "$BENCHMARK_PLATFORM_VERSION" ]
          [ "$(sha256sum build/benchmark-package/plugin.zip | awk '{print $1}')" = "$expected_sha" ]
          mkdir -p build/distributions
          cp build/benchmark-package/plugin.zip build/distributions/markflow-benchmark.zip
          echo "E2E_PLUGIN_PATH=build/distributions/markflow-benchmark.zip" >> "$GITHUB_ENV"
          echo "E2E_PLUGIN_SHA256=$expected_sha" >> "$GITHUB_ENV"

      - name: Install ARM64-only visual runtime
        if: matrix.install_visual_runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 fonts-liberation

      - name: Verify strict visual environment
        shell: bash
        run: |
          set -euo pipefail
          ldconfig -p | grep -F libEGL.so.1
          fc-cache -f
          resolved="$(fc-match -f '%{family}|%{style}|%{file}' Arial)"
          IFS='|' read -r family style font_path <<< "$resolved"
          [ "$family" = 'Liberation Sans' ] && [ "$style" = 'Regular' ] || {
            echo "::error::Arial fallback drifted: $resolved"
            exit 1
          }
          font_sha="$(sha256sum "$font_path" | awk '{print $1}')"
          expected_font_sha=4659bc0c58c5028dd488ec928d41d9265db43d9b669fc14ca8b0832daca7b144
          [ "$font_sha" = "$expected_font_sha" ] || {
            echo "::error::Visual font bytes differ between benchmark architectures"
            exit 1
          }
          mkdir -p build/visual-benchmark
          {
            echo "source_sha=$BENCHMARK_SOURCE_SHA"
            echo "platform_version=$BENCHMARK_PLATFORM_VERSION"
            echo "arch=${{ matrix.arch }}"
            echo "runner_arch=$RUNNER_ARCH"
            echo "uname=$(uname -m)"
            echo "runner_image=${ImageOS:-unknown}/${ImageVersion:-unknown}"
            echo "fontconfig_version=$(fc-match --version 2>&1)"
            echo "arial_file=$font_path"
            echo "arial_sha256=$font_sha"
          } > build/visual-benchmark/environment.txt

      - name: Start pinned visual display
        shell: bash
        run: |
          set -euo pipefail
          Xvfb :99 -screen 0 1920x1080x24 -dpi 96 >"$RUNNER_TEMP/markflow-visual-benchmark-xvfb.log" 2>&1 &
          printf 'DISPLAY=:99\n' >> "$GITHUB_ENV"

      - name: Run strict visual benchmark
        shell: bash
        run: |
          set -euo pipefail
          suite="com.algorist.markflow.e2e.MarkFlowStarterVisualAcceptanceTest"
          rm -rf build/visual-acceptance build/test-results/integrationTest build/reports/tests/integrationTest
          start_ns="$(date +%s%N)"
          set +e
          timeout --signal=TERM --kill-after=30s 24m \
            ./gradlew integrationTest -x buildPlugin \
              -PplatformVersion="$BENCHMARK_PLATFORM_VERSION" -PstarterPackagedPlugin=true \
              --stacktrace --tests "$suite"
          status=$?
          set -e
          end_ns="$(date +%s%N)"
          elapsed_ms=$(( (end_ns - start_ns) / 1000000 ))
          {
            echo "arch=${{ matrix.arch }}"
            echo "gradle_elapsed_ms=$elapsed_ms"
            echo "exit_status=$status"
          } > build/visual-benchmark/timing.txt
          actual_plugin_sha="$(sha256sum "$E2E_PLUGIN_PATH" | awk '{print $1}')"
          [ "$actual_plugin_sha" = "$E2E_PLUGIN_SHA256" ] || {
            echo "::error::Visual benchmark mutated the shared plugin artifact"
            exit 1
          }
          [ "$status" -eq 0 ] || exit "$status"

      - name: Upload benchmark evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: markflow-362-visual-benchmark-${{ matrix.arch }}-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            build/visual-benchmark/**
            build/visual-acceptance/**
            build/test-results/integrationTest/**
            build/reports/tests/integrationTest/**
            build/benchmark-package/manifest.txt
            ${{ runner.temp }}/markflow-visual-benchmark-xvfb.log
