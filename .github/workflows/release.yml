# Explicit release/publication boundary for a manually created GitHub Release.
# Ordinary pull-request and main validation is entirely in build.yml and never mutates
# release or Marketplace state. This workflow fails closed on provenance ambiguity.
# Marketplace/signing authority is gated by the release-only jetbrains-marketplace environment.

name: Release
on:
  release:
    types: [ released ]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish Plugin
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: jetbrains-marketplace
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      attestations: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@ceedf095f4ec1a097402bc6bd80831f2e1a6fde6 # v2.0.0
        with:
          tool-cache: false
          large-packages: false

      - name: Fetch Sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      # All API failures are fatal. In particular, an unavailable release/tag lookup
      # must not be interpreted as an absent release or as permission to continue.
      - name: Resolve reviewed release source
        id: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          release_json="$RUNNER_TEMP/release.json"
          tag_ref_json="$RUNNER_TEMP/tag-ref.json"
          [[ "$RELEASE_TAG" =~ ^v([1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || {
            echo "::error::Stable release tags must be vMAJOR.MINOR.PATCH with major >= 1."
            exit 1
          }
          release_version="${RELEASE_TAG#v}"
          printf 'RELEASE_VERSION=%s\n' "$release_version" >> "$GITHUB_ENV"
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" > "$release_json"
          jq -e --arg tag "$RELEASE_TAG" '.tag_name == $tag and .id != null and .draft == false and .prerelease == false' "$release_json" >/dev/null
          gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" > "$tag_ref_json"
          tag_type="$(jq -r '.object.type' "$tag_ref_json")"
          tag_object="$(jq -r '.object.sha' "$tag_ref_json")"
          if [ "$tag_type" = tag ]; then
            tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object}" --jq '.object.sha')"
            tag_commit_type="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object}" --jq '.object.type')"
            [ "$tag_commit_type" = commit ] || { echo "::error::Annotated tag does not resolve to a commit."; exit 1; }
          elif [ "$tag_type" = commit ]; then
            tag_sha="$tag_object"
          else
            echo "::error::Release tag resolves to unsupported object type: $tag_type"
            exit 1
          fi
          [[ "$tag_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Tag does not resolve to a full commit SHA."; exit 1; }
          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          [[ "$main_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::main does not resolve to a full commit SHA."; exit 1; }
          compare_status="$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${RELEASE_TAG}" --jq '.status')"
          case "$compare_status" in
            identical|behind) ;;
            *) echo "::error::Release tag is not reachable from reviewed main (compare status: $compare_status)."; exit 1 ;;
          esac
          identity_asset_ids="$(jq -r '.assets[]? | select(.name == "markflow-release-identity.json") | .id' "$release_json")"
          published_identity_asset_ids="$(jq -r '.assets[]? | select(.name == "markflow-release-published.json") | .id' "$release_json")"
          [ "$(printf '%s\n' "$identity_asset_ids" | sed '/^$/d' | wc -l | tr -d ' ')" -le 1 ] || { echo "::error::Multiple pending release identity assets exist."; exit 1; }
          [ "$(printf '%s\n' "$published_identity_asset_ids" | sed '/^$/d' | wc -l | tr -d ' ')" -le 1 ] || { echo "::error::Multiple completed release identity assets exist."; exit 1; }
          pending_identity_file="$RUNNER_TEMP/existing-pending.json"
          published_identity_file="$RUNNER_TEMP/existing-published.json"
          pending_identity_asset_id="$(printf '%s\n' "$identity_asset_ids" | sed -n '1p')"
          published_identity_asset_id="$(printf '%s\n' "$published_identity_asset_ids" | sed -n '1p')"
          if [ -n "$pending_identity_asset_id" ]; then
            gh api -H 'Accept: application/octet-stream' "repos/${GITHUB_REPOSITORY}/releases/assets/${pending_identity_asset_id}" > "$pending_identity_file"
          fi
          if [ -n "$published_identity_asset_id" ]; then
            gh api -H 'Accept: application/octet-stream' "repos/${GITHUB_REPOSITORY}/releases/assets/${published_identity_asset_id}" > "$published_identity_file"
          fi
          printf 'tag_sha=%s\nmain_sha=%s\ncompare_status=%s\nversion=%s\npending_identity_file=%s\npublished_identity_file=%s\n' \
            "$tag_sha" "$main_sha" "$compare_status" "$release_version" "$pending_identity_file" "$published_identity_file" >> "$GITHUB_OUTPUT"

      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: zulu
          java-version: 25

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          package-manager-cache: false

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-disabled: true

      - name: Patch Changelog
        if: ${{ github.event.release.body != '' }}
        env:
          CHANGELOG: ${{ github.event.release.body }}
        run: |
          set -euo pipefail
          release_note="$RUNNER_TEMP/release_note.txt"
          printf '%s\n' "$CHANGELOG" > "$release_note"
          ./gradlew patchChangelog -PbuildVersion="$RELEASE_VERSION" --release-note-file="$release_note"

      - name: Build exact release artifact
        id: artifact
        run: |
          set -euo pipefail
          ./gradlew buildPlugin -PbuildVersion="$RELEASE_VERSION"
          shopt -s nullglob
          artifacts=(./build/distributions/*.zip)
          [ "${#artifacts[@]}" -eq 1 ] || { echo "::error::Expected one plugin distribution, found ${#artifacts[@]}."; exit 1; }
          printf 'path=%s\nname=%s\n' "${artifacts[0]}" "$(basename "${artifacts[0]}")" >> "$GITHUB_OUTPUT"

      - name: Resolve existing publication state
        id: state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PENDING_IDENTITY_FILE: ${{ steps.source.outputs.pending_identity_file }}
          PUBLISHED_IDENTITY_FILE: ${{ steps.source.outputs.published_identity_file }}
        run: |
          set -euo pipefail
          release_json="$RUNNER_TEMP/release.json"
          pending="$PENDING_IDENTITY_FILE"
          published="$PUBLISHED_IDENTITY_FILE"
          publish=true

          if [ -s "$published" ]; then
            [ -s "$pending" ] || {
              echo "::error::Published identity requires its original pending identity."
              exit 1
            }
            jq -e --arg tag "$RELEASE_TAG" --arg version "$RELEASE_VERSION" '
              .schema == 1 and .tag == $tag and .version == $version and
              (.tag_commit | test("^[0-9a-f]{40}$")) and
              (.artifact | endswith("-" + $version + "-signed.zip")) and
              (.artifact_sha256 | test("^[0-9a-f]{64}$")) and
              .publication_state == "pending"
            ' "$pending" >/dev/null || { echo "::error::Pending release identity is invalid."; exit 1; }
            jq -e --arg tag "$RELEASE_TAG" --arg version "$RELEASE_VERSION" '
              .schema == 1 and .tag == $tag and .version == $version and
              (.tag_commit | test("^[0-9a-f]{40}$")) and
              (.artifact | endswith("-" + $version + "-signed.zip")) and
              (.artifact_sha256 | test("^[0-9a-f]{64}$")) and
              .publication_state == "published"
            ' "$published" >/dev/null || { echo "::error::Published release identity is invalid."; exit 1; }

            pending_canonical="$(jq -S 'del(.publication_state)' "$pending")"
            published_canonical="$(jq -S 'del(.publication_state)' "$published")"
            [ "$pending_canonical" = "$published_canonical" ] || {
              echo "::error::Pending and published release identities conflict."
              exit 1
            }

            artifact_name="$(jq -r '.artifact' "$published")"
            expected_sha="$(jq -r '.artifact_sha256' "$published")"
            asset_ids="$(jq -r --arg name "$artifact_name" '.assets[]? | select(.name == $name) | .id' "$release_json")"
            [ "$(printf '%s\n' "$asset_ids" | sed '/^$/d' | wc -l | tr -d ' ')" -eq 1 ] || {
              echo "::error::Published identity does not map to exactly one signed release asset."
              exit 1
            }
            asset_id="$(printf '%s\n' "$asset_ids" | sed -n '1p')"
            gh api -H 'Accept: application/octet-stream' "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" > "$RUNNER_TEMP/existing-signed-release.zip"
            actual_sha="$(sha256sum "$RUNNER_TEMP/existing-signed-release.zip" | awk '{print $1}')"
            [ "$actual_sha" = "$expected_sha" ] || { echo "::error::Published signed release asset digest does not match identity."; exit 1; }
            publish=false
          elif [ -s "$pending" ]; then
            echo "::error::A pending publication identity already exists; manual recovery is required."
            exit 1
          else
            orphan_count="$(jq -r --arg suffix "-${RELEASE_VERSION}-signed.zip" '[.assets[]? | select(.name | endswith($suffix))] | length' "$release_json")"
            [ "$orphan_count" -eq 0 ] || { echo "::error::Signed release asset exists without a release identity."; exit 1; }
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      - name: Verify publication credentials
        if: ${{ steps.state.outputs.publish == 'true' }}
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "${PUBLISH_TOKEN:-}" ] || missing+=(PUBLISH_TOKEN)
          [ -n "${CERTIFICATE_CHAIN:-}" ] || missing+=(CERTIFICATE_CHAIN)
          [ -n "${PRIVATE_KEY:-}" ] || missing+=(PRIVATE_KEY)
          [ -n "${PRIVATE_KEY_PASSWORD:-}" ] || missing+=(PRIVATE_KEY_PASSWORD)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Publication aborted before any Marketplace call; missing: ${missing[*]}"
            exit 1
          fi

      - name: Sign exact release artifact
        if: ${{ steps.state.outputs.publish == 'true' }}
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew signPlugin -PbuildVersion="$RELEASE_VERSION"

      - name: Verify signed release artifact
        if: ${{ steps.state.outputs.publish == 'true' }}
        env:
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew verifyPluginSignature -PbuildVersion="$RELEASE_VERSION"

      - name: Capture verified signed release asset
        if: ${{ steps.state.outputs.publish == 'true' }}
        id: signed_artifact
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          artifacts=(./build/distributions/*-"$RELEASE_VERSION"-signed.zip)
          [ "${#artifacts[@]}" -eq 1 ] || { echo "::error::Expected one signed plugin distribution, found ${#artifacts[@]}."; exit 1; }
          printf 'path=%s\nname=%s\n' "${artifacts[0]}" "$(basename "${artifacts[0]}")" >> "$GITHUB_OUTPUT"

      # This validation-only preflight creates the pending release identity from the
      # signature-verified ZIP. The signed artifact, not buildPlugin output, is the identity subject.
      - name: Release provenance preflight for signed artifact
        if: ${{ steps.state.outputs.publish == 'true' }}
        id: preflight
        env:
          PREFLIGHT_ARTIFACT_PATH: ${{ steps.signed_artifact.outputs.path }}
          PREFLIGHT_MAIN_SHA: ${{ steps.source.outputs.main_sha }}
          PREFLIGHT_TAG_SHA: ${{ steps.source.outputs.tag_sha }}
          PREFLIGHT_COMPARE_STATUS: ${{ steps.source.outputs.compare_status }}
        run: |
          set -euo pipefail
          bash .github/scripts/release-preflight.sh \
            --dry-run \
            --tag "$RELEASE_TAG" \
            --main-sha "$PREFLIGHT_MAIN_SHA" \
            --tag-sha "$PREFLIGHT_TAG_SHA" \
            --compare-status "$PREFLIGHT_COMPARE_STATUS" \
            --artifact "$PREFLIGHT_ARTIFACT_PATH" \
            --artifact-present false \
            --output-manifest "$RUNNER_TEMP/markflow-release-identity.json" \
            --github-output "$GITHUB_OUTPUT"
          [ "$(sed -n 's/^publish=//p' "$GITHUB_OUTPUT" | tail -1)" = true ] || {
            echo "::error::New signed release preflight did not authorize publication."
            exit 1
          }

      - name: Attest verified signed release asset
        if: ${{ steps.state.outputs.publish == 'true' }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ steps.signed_artifact.outputs.path }}

      # A pending identity asset is a publication lock. If this run fails after the
      # lock, reruns stop instead of guessing whether Marketplace publication happened.
      - name: Lock release identity before publication
        if: ${{ steps.state.outputs.publish == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/markflow-release-identity.json"

      - name: Publish Plugin
        if: ${{ steps.state.outputs.publish == 'true' }}
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew publishPlugin -x signPlugin -PbuildVersion="$RELEASE_VERSION"

      - name: Upload Release Asset
        if: ${{ steps.state.outputs.publish == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ARTIFACT_PATH: ${{ steps.signed_artifact.outputs.path }}
        run: gh release upload "$RELEASE_TAG" "$RELEASE_ARTIFACT_PATH"

      - name: Mark publication complete
        if: ${{ steps.state.outputs.publish == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          jq '.publication_state = "published"' "$RUNNER_TEMP/markflow-release-identity.json" > "$RUNNER_TEMP/markflow-release-published.json"
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/markflow-release-published.json"

      # Changelog PR creation remains release-only and is idempotent for a rerun that
      # already created the deterministic branch/PR. It never runs during CI validation.
      - name: Create Pull Request
        if: ${{ github.event.release.body != '' && steps.state.outputs.publish == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          branch="changelog-update-$RELEASE_VERSION"
          existing_prs="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --state open --json number --jq 'length')"
          if [ "$existing_prs" -gt 0 ]; then
            echo "Changelog PR $branch already exists; leaving it unchanged."
            exit 0
          fi
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          if git diff --quiet; then echo "Changelog already up to date; nothing to propose."; exit 0; fi
          git checkout -b "$branch"
          git commit -am "docs: changelog update - $RELEASE_VERSION"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$branch"
          gh pr create --title "docs: changelog update - $RELEASE_VERSION" --body "Patched CHANGELOG.md for the $RELEASE_VERSION release." --label "type:docs" --label "area:docs" --base main --head "$branch"
