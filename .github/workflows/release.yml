# Explicit release/publication boundary for a manually created GitHub Release.
# Ordinary pull-request and main validation is entirely in build.yml and never mutates
# release or Marketplace state. This workflow fails closed on provenance ambiguity.
# Marketplace/signing secrets are scoped only to the publication step.

name: Release
on:
  release:
    types: [ prereleased, released ]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish Plugin
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
    env:
      RELEASE_VERSION: ${{ github.event.release.tag_name }}
    steps:
      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          large-packages: false

      - name: Fetch Sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      # All API failures are fatal. In particular, an unavailable release/tag lookup
      # must not be interpreted as an absent release or as permission to continue.
      - name: Resolve reviewed release source
        id: source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          release_json="$RUNNER_TEMP/release.json"
          tag_ref_json="$RUNNER_TEMP/tag-ref.json"
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_VERSION}" > "$release_json"
          jq -e --arg tag "$RELEASE_VERSION" '.tag_name == $tag and .id != null' "$release_json" >/dev/null
          gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_VERSION}" > "$tag_ref_json"
          tag_type="$(jq -r '.object.type' "$tag_ref_json")"
          tag_object="$(jq -r '.object.sha' "$tag_ref_json")"
          if [ "$tag_type" = tag ]; then
            tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object}" --jq '.object.sha')"
            tag_commit_type="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_object}" --jq '.object.type')"
            [ "$tag_commit_type" = commit ] || { echo "::error::Annotated tag does not resolve to a commit."; exit 1; }
          elif [ "$tag_type" = commit ]; then
            tag_sha="$tag_object"
          else
            echo "::error::Release tag resolves to unsupported object type: $tag_type"
            exit 1
          fi
          [[ "$tag_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Tag does not resolve to a full commit SHA."; exit 1; }
          main_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          [[ "$main_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::main does not resolve to a full commit SHA."; exit 1; }
          compare_status="$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${RELEASE_VERSION}" --jq '.status')"
          case "$compare_status" in
            identical|behind) ;;
            *) echo "::error::Release tag is not reachable from reviewed main (compare status: $compare_status)."; exit 1 ;;
          esac
          identity_asset_ids="$(jq -r '.assets[]? | select(.name == "markflow-release-identity.json") | .id' "$release_json")"
          published_identity_asset_ids="$(jq -r '.assets[]? | select(.name == "markflow-release-published.json") | .id' "$release_json")"
          [ "$(printf '%s\n' "$identity_asset_ids" | sed '/^$/d' | wc -l | tr -d ' ')" -le 1 ] || { echo "::error::Multiple pending release identity assets exist."; exit 1; }
          [ "$(printf '%s\n' "$published_identity_asset_ids" | sed '/^$/d' | wc -l | tr -d ' ')" -le 1 ] || { echo "::error::Multiple completed release identity assets exist."; exit 1; }
          identity_file="$RUNNER_TEMP/existing-identity.json"
          # Prefer the completed marker on a rerun. The pending marker is retained
          # as an immutable audit trail and must not be mistaken for current state.
          identity_asset_id="$(printf '%s\n' "$published_identity_asset_ids" | sed -n '1p')"
          [ -n "$identity_asset_id" ] || identity_asset_id="$(printf '%s\n' "$identity_asset_ids" | sed -n '1p')"
          if [ -n "$identity_asset_id" ]; then
            gh api -H 'Accept: application/octet-stream' "repos/${GITHUB_REPOSITORY}/releases/assets/${identity_asset_id}" > "$identity_file"
          fi
          printf 'tag_sha=%s\nmain_sha=%s\ncompare_status=%s\nidentity_file=%s\n' "$tag_sha" "$main_sha" "$compare_status" "$identity_file" >> "$GITHUB_OUTPUT"

      - name: Setup Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: zulu
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-disabled: true

      - name: Patch Changelog
        if: ${{ github.event.release.body != '' }}
        env:
          CHANGELOG: ${{ github.event.release.body }}
        run: |
          set -euo pipefail
          release_note="$RUNNER_TEMP/release_note.txt"
          printf '%s\n' "$CHANGELOG" > "$release_note"
          ./gradlew patchChangelog -PbuildVersion="$RELEASE_VERSION" --release-note-file="$release_note"

      - name: Build exact release artifact
        id: artifact
        run: |
          set -euo pipefail
          ./gradlew buildPlugin -PbuildVersion="$RELEASE_VERSION"
          shopt -s nullglob
          artifacts=(./build/distributions/*.zip)
          [ "${#artifacts[@]}" -eq 1 ] || { echo "::error::Expected one plugin distribution, found ${#artifacts[@]}."; exit 1; }
          printf 'path=%s\nname=%s\n' "${artifacts[0]}" "$(basename "${artifacts[0]}")" >> "$GITHUB_OUTPUT"

      # This is a local dry-run only: it reads the built archive and the API-resolved
      # immutable source identity, and writes a pending lock manifest under RUNNER_TEMP.
      - name: Release provenance preflight (dry-run)
        id: preflight
        env:
          PREFLIGHT_ARTIFACT_NAME: ${{ steps.artifact.outputs.name }}
          PREFLIGHT_ARTIFACT_PATH: ${{ steps.artifact.outputs.path }}
          PREFLIGHT_IDENTITY_FILE: ${{ steps.source.outputs.identity_file }}
          PREFLIGHT_MAIN_SHA: ${{ steps.source.outputs.main_sha }}
          PREFLIGHT_TAG_SHA: ${{ steps.source.outputs.tag_sha }}
          PREFLIGHT_COMPARE_STATUS: ${{ steps.source.outputs.compare_status }}
        run: |
          set -euo pipefail
          release_json="$RUNNER_TEMP/release.json"
          artifact_name="$PREFLIGHT_ARTIFACT_NAME"
          artifact_present=false
          artifact_asset_ids="$(jq -r --arg name "$artifact_name" '.assets[]? | select(.name == $name) | .id' "$release_json")"
          [ "$(printf '%s\n' "$artifact_asset_ids" | sed '/^$/d' | wc -l | tr -d ' ')" -le 1 ] || { echo "::error::Multiple release artifacts have the same name."; exit 1; }
          existing_artifact_sha256=""
          artifact_asset_id="$(printf '%s\n' "$artifact_asset_ids" | sed -n '1p')"
          if [ -n "$artifact_asset_id" ]; then
            artifact_present=true
            gh api -H 'Accept: application/octet-stream' "repos/${GITHUB_REPOSITORY}/releases/assets/${artifact_asset_id}" > "$RUNNER_TEMP/existing-release-artifact.zip"
            existing_artifact_sha256="$(sha256sum "$RUNNER_TEMP/existing-release-artifact.zip" | awk '{print $1}')"
          fi
          existing="$PREFLIGHT_IDENTITY_FILE"
          args=(
            --dry-run
            --tag "$RELEASE_VERSION"
            --main-sha "$PREFLIGHT_MAIN_SHA"
            --tag-sha "$PREFLIGHT_TAG_SHA"
            --compare-status "$PREFLIGHT_COMPARE_STATUS"
            --artifact "$PREFLIGHT_ARTIFACT_PATH"
            --artifact-present "$artifact_present"
            --existing-artifact-sha256 "$existing_artifact_sha256"
            --output-manifest "$RUNNER_TEMP/markflow-release-identity.json"
            --github-output "$GITHUB_OUTPUT"
          )
          if [ -s "$existing" ]; then
            args+=(--existing-identity "$existing")
          fi
          bash .github/scripts/release-preflight.sh "${args[@]}"

      - name: Verify publication credentials
        if: ${{ steps.preflight.outputs.publish == 'true' }}
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          [ -n "${PUBLISH_TOKEN:-}" ] || missing+=(PUBLISH_TOKEN)
          [ -n "${CERTIFICATE_CHAIN:-}" ] || missing+=(CERTIFICATE_CHAIN)
          [ -n "${PRIVATE_KEY:-}" ] || missing+=(PRIVATE_KEY)
          [ -n "${PRIVATE_KEY_PASSWORD:-}" ] || missing+=(PRIVATE_KEY_PASSWORD)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Publication aborted before any Marketplace call; missing: ${missing[*]}"
            exit 1
          fi

      # A pending identity asset is a publication lock. If this run fails after the
      # lock, reruns stop instead of guessing whether Marketplace publication happened.
      - name: Lock release identity before publication
        if: ${{ steps.preflight.outputs.publish == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$RELEASE_VERSION" "$RUNNER_TEMP/markflow-release-identity.json"

      - name: Publish Plugin
        if: ${{ steps.preflight.outputs.publish == 'true' }}
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
          CERTIFICATE_CHAIN: ${{ secrets.CERTIFICATE_CHAIN }}
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          PRIVATE_KEY_PASSWORD: ${{ secrets.PRIVATE_KEY_PASSWORD }}
        run: ./gradlew publishPlugin -PbuildVersion="$RELEASE_VERSION"

      - name: Upload Release Asset
        if: ${{ steps.preflight.outputs.publish == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ARTIFACT_PATH: ${{ steps.artifact.outputs.path }}
        run: gh release upload "$RELEASE_VERSION" "$RELEASE_ARTIFACT_PATH"

      - name: Mark publication complete
        if: ${{ steps.preflight.outputs.publish == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          jq '.publication_state = "published"' "$RUNNER_TEMP/markflow-release-identity.json" > "$RUNNER_TEMP/markflow-release-published.json"
          gh release upload "$RELEASE_VERSION" "$RUNNER_TEMP/markflow-release-published.json"

      # Changelog PR creation remains release-only and is idempotent for a rerun that
      # already created the deterministic branch/PR. It never runs during CI validation.
      - name: Create Pull Request
        if: ${{ github.event.release.body != '' && steps.preflight.outputs.publish == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          branch="changelog-update-$RELEASE_VERSION"
          existing_prs="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --state open --json number --jq 'length')"
          if [ "$existing_prs" -gt 0 ]; then
            echo "Changelog PR $branch already exists; leaving it unchanged."
            exit 0
          fi
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          if git diff --quiet; then echo "Changelog already up to date; nothing to propose."; exit 0; fi
          git checkout -b "$branch"
          git commit -am "docs: changelog update - $RELEASE_VERSION"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$branch"
          gh pr create --title "docs: changelog update - $RELEASE_VERSION" --body "Patched CHANGELOG.md for the $RELEASE_VERSION release." --label "type:docs" --label "area:docs" --base main --head "$branch"
