            src/main/kotlin/com/algorist/markflow/editor/native/NativeHostResourceProjection.kt
            src/main/kotlin/com/algorist/markflow/editor/native/NativeHostResourcePresentationController.kt
            src/main/kotlin/com/algorist/markflow/trust/ExternalNavigationPolicy.kt
            src/main/kotlin/com/algorist/markflow/trust/NativeLocalImageResolver.kt
          )
          if grep -En 'MarkFlowWebviewResourceManager|SourceNativeLocalImageCapability|JBCef|com\.intellij\.ui\.jcef|127\.0\.0\.1|__markflow_source_image__' "${files[@]}"; then
            echo 'native host-resource implementation depends on forbidden browser/JCEF/loopback capability surface' >&2
            exit 1
          fi

      - name: Start virtual display
        shell: bash
        run: |
          set -euo pipefail
          Xvfb :99 -screen 0 1920x1080x24 >"$RUNNER_TEMP/markflow-native-host-resources-xvfb.log" 2>&1 &
