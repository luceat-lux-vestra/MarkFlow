              raise SystemExit(f"unexpected evidence schema: {evidence.get('schemaVersion')}")
          if evidence.get('selectedSurface') != 'PLATFORM_TEXT_EDITOR_HOST_RESOURCES':
              raise SystemExit(f"unexpected selected surface: {evidence.get('selectedSurface')}")
          if evidence.get('verdict') != 'PASS':
              raise SystemExit(f"native host resources verdict is not PASS: {evidence.get('verdict')}")

          required = {
              'jcef-plugin-absent-host-resource-path',
              'authoritative-document-fixture',
              'platform-text-editor-selected',
              'host-resource-projection-contract',
              'valid-and-failed-local-image-runtime',
              'caret-selection-exact-source-reveal',
              'explicit-host-navigation-allow-deny',
              'split-editor-presentation-isolation',
              'hostile-local-path-and-media-policy',
              'document-move-and-reopen-context',
              'stale-image-result-rejected',
              'repeated-create-dispose-ownership',
              'final-source-and-lifecycle-stability',
          }
          cases = evidence.get('cases') or []
          by_id = {case.get('id'): case for case in cases}
          if len(by_id) != len(cases):
              raise SystemExit('duplicate native host-resource evidence case ids')
          if set(by_id) != required:
              raise SystemExit(
                  f"host-resource case contract mismatch: missing={sorted(required - set(by_id))}, "
                  f"unexpected={sorted(set(by_id) - required)}"
              )
          failed = sorted(case_id for case_id in required if by_id[case_id].get('outcome') != 'PASS')
          if failed:
              raise SystemExit(f'native host-resource required cases failed: {failed}')

          jcef = str(by_id['jcef-plugin-absent-host-resource-path'].get('detail', ''))
          if 'jcefClassPresent=false' not in jcef or 'jcefSupported=false' not in jcef:
              raise SystemExit(f'JCEF-disabled host-resource proof incomplete: {jcef}')
          images = str(by_id['valid-and-failed-local-image-runtime'].get('detail', ''))
          if 'pngJpegDecoded=4' not in images or 'sourceFallback=true' not in images:
              raise SystemExit(f'local image success/failure runtime proof incomplete: {images}')
          hostile = str(by_id['hostile-local-path-and-media-policy'].get('detail', ''))
          for marker in ('symlinkEscapeRejected=true', 'mediaMismatchRejected=true', 'oversizeRejected=true'):
              if marker not in hostile:
                  raise SystemExit(f'hostile local-image proof missing {marker}: {hostile}')
          navigation = str(by_id['explicit-host-navigation-allow-deny'].get('detail', ''))
          for marker in ('httpAccepted=1', 'implicitGestureRejected=true', 'javascriptRejected=true', 'relativeRejected=true'):
              if marker not in navigation:
                  raise SystemExit(f'navigation proof missing {marker}: {navigation}')
          moved = str(by_id['document-move-and-reopen-context'].get('detail', ''))
          for marker in ('oldContextRevoked=true', 'movedContextResolved=true', 'reopenedNativeOwner=true'):
              if marker not in moved:
                  raise SystemExit(f'move/reopen proof missing {marker}: {moved}')
          stale = str(by_id['stale-image-result-rejected'].get('detail', ''))
          if 'staleOverwrite=false' not in stale:
              raise SystemExit(f'stale image proof incomplete: {stale}')
          final = str(by_id['final-source-and-lifecycle-stability'].get('detail', ''))
          if 'controllers=0' not in final or 'editors=0' not in final or 'sourceStable=true' not in final:
              raise SystemExit(f'final ownership/source proof incomplete: {final}')

          print(f"Native host resources verdict: {evidence['verdict']}")
          print(f"IDE build: {evidence.get('ideBuild')}")
          for case_id in sorted(required):
              print(f"{case_id}: {by_id[case_id].get('outcome')}")
          PY

      - name: Upload native host resources evidence
