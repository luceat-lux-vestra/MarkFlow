          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('build/native-host-resources-probe/evidence.json')
          if not path.is_file():
              raise SystemExit('native host resources probe did not produce evidence.json')

          evidence = json.loads(path.read_text(encoding='utf-8'))
