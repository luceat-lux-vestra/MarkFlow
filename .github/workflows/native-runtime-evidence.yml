              'case-insensitive-multi-collision-reservation': ('caseInsensitiveReservation=true', 'sameBasenameMulti=true', 'suffixes=-2,-3', 'overwrite=false', 'preexistingBytesStable=true'),
          }
          gesture_cases = gesture.get('cases') or []
          gesture_by_id = {case.get('id'): case for case in gesture_cases}
          if set(gesture_by_id) != set(gesture_required):
              raise SystemExit(f'gesture hardening case contract mismatch: {gesture_by_id}')
          for case_id, markers in gesture_required.items():
              case = gesture_by_id[case_id]
              if case.get('outcome') != 'PASS':
                  raise SystemExit(f'gesture hardening case failed: {case_id}: {case}')
              detail = str(case.get('detail', ''))
              missing = [marker for marker in markers if marker not in detail]
              if missing:
                  raise SystemExit(f'{case_id} missing gesture markers {missing}: {detail}')

          race_path = Path('build/native-image-import-probe/destination-race.json')
          if not race_path.is_file():
              raise SystemExit('destination race probe did not produce destination-race.json')
          race = json.loads(race_path.read_text(encoding='utf-8'))
          if race.get('schemaVersion') != 1 or race.get('verdict') != 'PASS':
              raise SystemExit(f'destination race verdict is not PASS: {race}')
          race_cases = race.get('cases') or []
          if len(race_cases) != 1 or race_cases[0].get('id') != 'case-insensitive-post-preflight-collision':
              raise SystemExit(f'destination race case contract mismatch: {race_cases}')
          race_case = race_cases[0]
          if race_case.get('outcome') != 'PASS':
              raise SystemExit(f'destination race case failed: {race_case}')
          race_detail = str(race_case.get('detail', ''))
          race_markers = (
              'raceInjected=true',
              'caseInsensitiveRecheck=true',
              'copyRejected=true',
              'sourceStable=true',
              'competingFilePreserved=true',
              'operationFileCreated=false',
          )
          missing = [marker for marker in race_markers if marker not in race_detail]
          if missing:
              raise SystemExit(f'destination race case missing markers {missing}: {race_detail}')

          hardening_path = Path('build/native-image-import-probe/transaction-hardening.json')
          if not hardening_path.is_file():
              raise SystemExit('transaction hardening probe did not produce transaction-hardening.json')
          hardening = json.loads(hardening_path.read_text(encoding='utf-8'))
          if hardening.get('schemaVersion') != 1 or hardening.get('verdict') != 'PASS':
              raise SystemExit(f'transaction hardening verdict is not PASS: {hardening}')
          hardening_required = {
              'vfs-visible-collision-reservation': ('vfsVisibleCollision=true', 'suffix=-2', 'overwrite=false', 'preexistingBytesStable=true'),
              'post-commit-ui-failure-does-not-rollback': ('postCommitFailureResultSuccess=true', 'sourceReferencePresent=true', 'assetPersists=true', 'rollbackAfterCommit=false'),
              'listener-pce-after-commit-preserves-transaction': ('pcePropagated=true', 'sourceCommitted=true', 'assetPersists=true', 'rollbackAfterObservedCommit=false'),
              'precommit-pce-propagates-after-cleanup': ('copyPcePropagated=true', 'copyRollbackComplete=true', 'sourcePcePropagated=true', 'sourceRollbackComplete=true', 'sourceStable=true'),
              'preexisting-assets-directory-preserved-on-rollback': ('preexistingDirectoryPreserved=true', 'operationAssetRemoved=true', 'sourceStable=true'),
              'document-path-change-boundary': ('sameParentRenameAllowed=true', 'crossParentMoveRejected=true', 'rollbackOnMove=true', 'sourceStableOnMove=true'),
          }
          hardening_cases = hardening.get('cases') or []
          hardening_by_id = {case.get('id'): case for case in hardening_cases}
          if set(hardening_by_id) != set(hardening_required):
              raise SystemExit(f'transaction hardening case contract mismatch: {hardening_by_id}')
          for case_id, markers in hardening_required.items():
              case = hardening_by_id[case_id]
              if case.get('outcome') != 'PASS':
                  raise SystemExit(f'transaction hardening case failed: {case_id}: {case}')
              detail = str(case.get('detail', ''))
              missing = [marker for marker in markers if marker not in detail]
              if missing:
                  raise SystemExit(f'{case_id} missing hardening markers {missing}: {detail}')

          print(f"Native image import verdict: {evidence['verdict']}")
          print(f"IDE build: {evidence.get('ideBuild')}")
          for case_id in sorted(required):
              print(f"{case_id}: {by_id[case_id].get('outcome')} :: {by_id[case_id].get('detail')}")
          print(f"Gesture hardening verdict: {gesture['verdict']}")
          for case_id in sorted(gesture_required):
              print(f"{case_id}: {gesture_by_id[case_id].get('outcome')} :: {gesture_by_id[case_id].get('detail')}")
          print(f"Destination race verdict: {race['verdict']}")
          print(f"case-insensitive-post-preflight-collision: {race_case.get('outcome')} :: {race_case.get('detail')}")
          print(f"Transaction hardening verdict: {hardening['verdict']}")
          for case_id in sorted(hardening_required):
              print(f"{case_id}: {hardening_by_id[case_id].get('outcome')} :: {hardening_by_id[case_id].get('detail')}")
          PY

      - name: Upload native image import evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-image-import-evidence
          path: |
            build/native-image-import-probe/evidence.json
            build/native-image-import-probe/gesture-hardening.json
            build/native-image-import-probe/destination-race.json
            build/native-image-import-probe/transaction-hardening.json
            .intellijPlatform/sandbox/**/idea.log
            ${{ runner.temp }}/markflow-native-image-import-xvfb.log
          if-no-files-found: warn

  native_projection:
    needs: target
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Real IntelliJ native projection probe
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - name: Fetch Sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.target.outputs.source_sha }}
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: zulu
          java-version: 25


      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      - name: Start virtual display
        shell: bash
        run: |
          set -euo pipefail
          Xvfb :99 -screen 0 1920x1080x24 >"$RUNNER_TEMP/markflow-native-projection-xvfb.log" 2>&1 &
          printf 'DISPLAY=:99\n' >> "$GITHUB_ENV"

      - name: Run real IntelliJ native projection probe with JCEF disabled
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=15s 8m ./gradlew runIdeForNativeProjectionProbe --stacktrace

      - name: Validate native projection evidence completeness
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('build/native-projection-probe/evidence.json')
          if not path.is_file():
              raise SystemExit('native projection probe did not produce evidence.json')

          evidence = json.loads(path.read_text(encoding='utf-8'))
          if evidence.get('schemaVersion') != 2:
              raise SystemExit(f"unexpected evidence schema: {evidence.get('schemaVersion')}")
          if evidence.get('selectedShell') != 'PLATFORM_TEXT_EDITOR_AUGMENTATION':
              raise SystemExit(f"unexpected selected shell: {evidence.get('selectedShell')}")
          if evidence.get('parserStrategy') != 'JETBRAINS_BUNDLED_MARKDOWN':
              raise SystemExit(f"unexpected parser strategy: {evidence.get('parserStrategy')}")
          if evidence.get('jcefSupported') is not False:
              raise SystemExit(f"JCEF-disabled proof was not actually disabled: {evidence.get('jcefSupported')}")
          if evidence.get('verdict') != 'PASS':
              raise SystemExit(f"native projection proof verdict is not PASS: {evidence.get('verdict')}")

          required = {
              'jcef-disabled-projection-path',
              'authoritative-document-fixture',
              'platform-text-and-markdown-coexistence',
              'attach-no-edit-source-stability',
              'parser-proven-projection-plan',
              'inline-and-block-native-presentation',
              'caret-and-selection-exact-source-reveal',
              'stale-plan-rejected-before-apply',
              'document-change-refresh',
              'config-stale-plan-rejected-before-apply',
              'typed-degradation-falls-back-to-source',
              'split-editor-presentation-isolation',
              'malformed-unsupported-source-degrades-safely',
              'refresh-recreate-dispose-source-stability',
              'final-lifecycle-ownership',
          }
          cases = evidence.get('cases') or []
          by_id = {case.get('id'): case for case in cases}
          if len(by_id) != len(cases):
              raise SystemExit('duplicate native projection evidence case ids')
          if set(by_id) != required:
              raise SystemExit(
                  f"native projection case contract mismatch: missing={sorted(required - set(by_id))}, "
                  f"unexpected={sorted(set(by_id) - required)}"
              )
          failed = sorted(case_id for case_id in required if by_id[case_id].get('outcome') != 'PASS')
          if failed:
              raise SystemExit(f'native projection required cases failed: {failed}')

          fixture_detail = str(by_id['authoritative-document-fixture'].get('detail', ''))
          if 'projectDefault=false' not in fixture_detail or 'insideProject=true' not in fixture_detail:
              raise SystemExit(f'native projection proof did not run inside a real opened project: {fixture_detail}')
          stale_detail = str(by_id['stale-plan-rejected-before-apply'].get('detail', ''))
          if 'staleRejected=true' not in stale_detail:
              raise SystemExit(f'source-stale projection was not proven rejected: {stale_detail}')
          config_stale_detail = str(by_id['config-stale-plan-rejected-before-apply'].get('detail', ''))
          if 'configStaleRejected=true' not in config_stale_detail or 'recoveredGeneration=2' not in config_stale_detail:
              raise SystemExit(f'config-stale projection contract incomplete: {config_stale_detail}')
          degraded_detail = str(by_id['typed-degradation-falls-back-to-source'].get('detail', ''))
          if 'exactSourceFallback=true' not in degraded_detail or 'recovered=true' not in degraded_detail:
              raise SystemExit(f'typed degradation/recovery contract incomplete: {degraded_detail}')
          presentation_detail = str(by_id['inline-and-block-native-presentation'].get('detail', ''))
          if 'taskRows=2' not in presentation_detail or 'checkedTasks=1' not in presentation_detail:
              raise SystemExit(f'native task-list presentation evidence incomplete: {presentation_detail}')
          reveal_detail = str(by_id['caret-and-selection-exact-source-reveal'].get('detail', ''))
          if 'multicaretSelectionReveal=true' not in reveal_detail:
              raise SystemExit(f'multicaret source-reveal evidence incomplete: {reveal_detail}')
          lifecycle_detail = str(by_id['final-lifecycle-ownership'].get('detail', ''))
          if 'controllers=0' not in lifecycle_detail or 'editors=0' not in lifecycle_detail:
              raise SystemExit(f'projection lifecycle cleanup incomplete: {lifecycle_detail}')

          parity_path = Path('build/native-projection-probe/parity.json')
          if not parity_path.is_file():
              raise SystemExit('#152 native Markdown parity probe did not produce parity.json')
          parity = json.loads(parity_path.read_text(encoding='utf-8'))
          if parity.get('schemaVersion') != 1:
              raise SystemExit(f"unexpected parity schema: {parity.get('schemaVersion')}")
          if parity.get('verdict') != 'PASS':
              raise SystemExit(f"native Markdown parity verdict is not PASS: {parity.get('verdict')}")
          parity_required = {
              'fidelity-corpus-runtime-mapping',
              'raw-html-safe-runtime',
              'raw-html-hostile-degraded-runtime',
              'ordinary-parser-table-boundary',
              'ordinary-native-presentation-source-neutral',
              'ordinary-accessibility-source-fallback',
              'table-native-presentation-source-neutral',
              'table-caret-selection-and-end-boundary-reveal',
              'table-mouse-inlay-reveal',
              'table-accessibility-source-fallback',
              'rapid-edit-caret-regeneration',
              'large-representative-document-baseline',
          }
          parity_cases = parity.get('cases') or []
          parity_by_id = {case.get('id'): case for case in parity_cases}
          if len(parity_by_id) != len(parity_cases):
              raise SystemExit('duplicate native Markdown parity case ids')
          if set(parity_by_id) != parity_required:
              raise SystemExit(
                  f"native Markdown parity case contract mismatch: missing={sorted(parity_required - set(parity_by_id))}, "
                  f"unexpected={sorted(set(parity_by_id) - parity_required)}"
              )
          parity_failed = sorted(
              case_id for case_id in parity_required if parity_by_id[case_id].get('outcome') != 'PASS'
          )
          if parity_failed:
              raise SystemExit(f'native Markdown parity required cases failed: {parity_failed}')

          marker_contract = {
              'fidelity-corpus-runtime-mapping': (
                  'fixtures=13', 'exactIdentity=true', 'rangesInBounds=true', 'imageBoundary=true'
              ),
              'raw-html-safe-runtime': ('fragments=2', 'safe=2', 'rasterized=2', 'sourceStable=true'),
              'raw-html-hostile-degraded-runtime': ('blocked=', 'exactSourceFallback=true', 'sourceStable=true'),
              'ordinary-parser-table-boundary': ('allKinds=true', 'linkSyntax=true', 'halfOpenBoundary=true'),
              'ordinary-native-presentation-source-neutral': (
                  'listBlocks=true', 'quoteBlock=true', 'emphasisItalic=true', 'strongBold=true',
                  'strikethroughEffect=true', 'inlineCodeSemantic=true', 'inlineCodeReveal=true',
                  'indentedCodeBlock=true', 'linkHyperlink=true', 'linkConceal=true',
                  'boundaryReveal=true', 'sourceStable=true'
              ),
              'ordinary-accessibility-source-fallback': (
                  'sourceFallback=true', 'folds=0', 'highlighters=0', 'sourceStable=true', 'stampStable=true'
              ),
              'table-native-presentation-source-neutral': ('inlays=1', 'folds=2', 'sourceStable=true'),
              'table-caret-selection-and-end-boundary-reveal': ('caretReveal=true', 'selectionReveal=true', 'endBoundaryInactive=true'),
              'table-mouse-inlay-reveal': ('mouseEvent=true', 'mouseReveal=true', 'sourceStable=true'),
              'table-accessibility-source-fallback': ('sourceVisible=true', 'accessibilityFallback=1'),
              'rapid-edit-caret-regeneration': ('iterations=20', 'exactIdentity=true', 'caretMovement=true'),
              'large-representative-document-baseline': ('rangesInBounds=true', 'table=1'),
          }
          for case_id, markers in marker_contract.items():
              detail = str(parity_by_id[case_id].get('detail', ''))
              missing = [marker for marker in markers if marker not in detail]
              if missing:
                  raise SystemExit(f'{case_id} missing parity markers {missing}: {detail}')

          def metric(case_id, key):
              detail = str(parity_by_id[case_id].get('detail', ''))
              prefix = f"{key}="
              token = next((part for part in detail.split() if part.startswith(prefix)), None)
              if token is None:
                  raise SystemExit(f"{case_id} missing {key}: {detail}")
              return int(token[len(prefix):])

          rapid_ms = metric('rapid-edit-caret-regeneration', 'elapsedMs')
          if rapid_ms > 5000:
              raise SystemExit(f'rapid edit/caret projection latency {rapid_ms}ms exceeded 5000ms budget')
          large_ms = metric('large-representative-document-baseline', 'planElapsedMs')
          if large_ms > 3000:
              raise SystemExit(f'large projection planning latency {large_ms}ms exceeded 3000ms budget')

          print(f"Native projection verdict: {evidence['verdict']}")
          print(f"Selected shell: {evidence['selectedShell']}")
          print(f"Parser: {evidence['parserStrategy']}")
          print(f"IDE build: {evidence.get('ideBuild')}")
          for case_id in sorted(required):
              print(f"{case_id}: {by_id[case_id].get('outcome')}")
          print(f"Native Markdown parity verdict: {parity['verdict']}")
          for case_id in sorted(parity_required):
              print(f"parity/{case_id}: {parity_by_id[case_id].get('outcome')}")
          PY

      - name: Upload native projection evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-projection-evidence
          path: |
            build/native-projection-probe/evidence.json
            build/native-projection-probe/parity.json
            .intellijPlatform/sandbox/**/idea.log
            ${{ runner.temp }}/markflow-native-projection-xvfb.log
          if-no-files-found: warn

  no_jcef_native_editing:
    needs: target
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: No-JCEF native editing (${{ matrix.id }})
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: idea-2026.2.3
            platform_version: 2026.2.3
    steps:
      - name: Fetch Sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.target.outputs.source_sha }}
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: zulu
          java-version: 25


      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      - name: Start virtual display
        shell: bash
        run: |
          set -euo pipefail
          Xvfb :99 -screen 0 1920x1080x24 >"$RUNNER_TEMP/markflow-no-jcef-xvfb.log" 2>&1 &
          printf 'DISPLAY=:99\n' >> "$GITHUB_ENV"

      - name: Run real IntelliJ native editing probe with JCEF plugin disabled
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=15s 10m \
            ./gradlew runIdeForNoJcefNativeEditingProbe -PplatformVersion="${{ matrix.platform_version }}" --stacktrace

      - name: Validate no-JCEF evidence completeness
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('build/no-jcef-native-editing-probe/evidence.json')
          if not path.is_file():
              raise SystemExit('no-JCEF native editing probe did not produce evidence.json')

          evidence = json.loads(path.read_text(encoding='utf-8'))
          if evidence.get('schemaVersion') != 1:
              raise SystemExit(f"unexpected evidence schema: {evidence.get('schemaVersion')}")
          if evidence.get('selectedShell') != 'PLATFORM_TEXT_EDITOR_AUGMENTATION':
              raise SystemExit(f"unexpected selected shell: {evidence.get('selectedShell')}")
          if evidence.get('verdict') != 'PASS':
              raise SystemExit(f"no-JCEF proof verdict is not PASS: {evidence.get('verdict')}")

          required = {
              'jcef-plugin-class-absent',
              'real-project-authoritative-document',
              'platform-text-provider-owns-source',
              'optional-jcef-renderer-registrations-absent',
              'base-native-paste-extension-present',
              'settings-degrade-without-renderer',
              'authoritative-native-edit-undo-redo-save',
              'final-native-lifecycle',
          }
          cases = evidence.get('cases') or []
          by_id = {case.get('id'): case for case in cases}
          if len(by_id) != len(cases):
              raise SystemExit('duplicate no-JCEF evidence case ids')
          if set(by_id) != required:
              raise SystemExit(
                  f"no-JCEF case contract mismatch: missing={sorted(required - set(by_id))}, "
                  f"unexpected={sorted(set(by_id) - required)}"
              )
          failed = sorted(case_id for case_id in required if by_id[case_id].get('outcome') != 'PASS')
          if failed:
              raise SystemExit(f'no-JCEF required cases failed: {failed}')

          jcef_detail = str(by_id['jcef-plugin-class-absent'].get('detail', ''))
          if 'classPresent=false' not in jcef_detail or 'supported=false' not in jcef_detail:
              raise SystemExit(f'JCEF plugin was not actually absent from the MarkFlow classloader: {jcef_detail}')
          registration_detail = str(by_id['optional-jcef-renderer-registrations-absent'].get('detail', ''))
          registration_flags = (
              'temporaryProvider=false',
              'nativePresentationSettingsSinks=1',
              'rendererRuntimeFactories=0',
          )
          missing_registration_flags = [flag for flag in registration_flags if flag not in registration_detail]
          if missing_registration_flags:
              raise SystemExit(
                  f'no-JCEF production registration contract missing {missing_registration_flags}: {registration_detail}'
              )
          settings_detail = str(by_id['settings-degrade-without-renderer'].get('detail', ''))
          settings_flags = (
              'settingsAvailable=true',
              'themeAvailable=true',
              'nativePresentationSinkCount=1',
              'rendererRuntimeFactoryCount=0',
          )
          missing_settings_flags = [flag for flag in settings_flags if flag not in settings_detail]
          if missing_settings_flags:
              raise SystemExit(
                  f'no-JCEF settings degradation contract missing {missing_settings_flags}: {settings_detail}'
              )
          editing_detail = str(by_id['authoritative-native-edit-undo-redo-save'].get('detail', ''))
          for flag in ('sameDocument=true', 'dirty=true', 'undo=true', 'redo=true', 'save=true'):
              if flag not in editing_detail:
                  raise SystemExit(f'native source-editing proof incomplete: {editing_detail}')
          lifecycle_detail = str(by_id['final-native-lifecycle'].get('detail', ''))
          if 'editors=0' not in lifecycle_detail:
              raise SystemExit(f'no-JCEF lifecycle cleanup incomplete: {lifecycle_detail}')

          print(f"No-JCEF native editing verdict: {evidence['verdict']}")
          print(f"IDE build: {evidence.get('ideBuild')}")
          for case_id in sorted(required):
              print(f"{case_id}: {by_id[case_id].get('outcome')}")
          PY

      - name: Reject hidden MarkFlow/JCEF class-loading failures
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t logs < <(find .intellijPlatform/sandbox -type f -name idea.log -print 2>/dev/null || true)
          if ((${#logs[@]} == 0)); then
            echo 'No idea.log found; evidence file remains the primary proof.'
            exit 0
          fi
          if grep -E 'PluginException.*com\.algorist\.markflow|Cannot load.*com\.algorist\.markflow|NoClassDefFoundError: com/intellij/ui/jcef' "${logs[@]}"; then
            echo 'Hidden MarkFlow/JCEF class-loading failure detected.' >&2
            exit 1
          fi

      - name: Upload no-JCEF evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: no-jcef-native-editing-evidence-${{ matrix.id }}
          path: |
            build/no-jcef-native-editing-probe/evidence.json
            .intellijPlatform/sandbox/**/idea.log
            .intellijPlatform/sandbox/**/bg-wa/**
            ${{ runner.temp }}/markflow-no-jcef-xvfb.log
          if-no-files-found: warn
