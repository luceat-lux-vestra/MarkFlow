              'context-rejections-and-multicaret',
              'hostile-authority-and-symlink-rejections',
              'vfs-and-source-failure-rollback',
              'rollback-failure-orphan-diagnostic',
              'undo-redo-assets-persist',
              'reopen-rename-and-host-presentation-feed',
              'final-lifecycle-stability',
          }
          cases = evidence.get('cases') or []
          by_id = {case.get('id'): case for case in cases}
