# Repository-owned replacement for GitHub-managed Automatic Dependency Submission (Gradle).
# Managed Automatic Dependency Submission must remain disabled while this publisher is active.
name: Gradle Dependency Submission

on:
  push:
    branches: [main]
    paths:
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - '.github/workflows/dependency-submission.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: custom-gradle-dependency-submission-${{ github.ref }}
  cancel-in-progress: true

jobs:
  submitGraph:
    name: Submit Gradle dependency graph
    if: ${{ github.repository == 'luceat-lux-vestra/MarkFlow' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout exact protected main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Verify exact protected checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Setup supported Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: zulu
          java-version: 25

      - name: Generate and submit exact main dependency graph
        uses: gradle/actions/dependency-submission@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: true
          dependency-graph: generate-and-submit
          dependency-graph-continue-on-failure: false

      - name: Verify submitted graph coverage and provenance
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/trusted-dependency-submission-validation.py verify-main \
            --dir dependency-graph-reports \
            --head "$GITHUB_SHA" \
            --version-catalog gradle/libs.versions.toml
