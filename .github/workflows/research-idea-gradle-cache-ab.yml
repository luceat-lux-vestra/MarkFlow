# lifecycle-owner: MarkFlow #457 / R2A #92
# lifecycle-retire: delete after the bounded IDEA Gradle-platform cache A/B evidence is recorded
name: Research IDEA Gradle Cache A/B

on:
  pull_request:
    paths:
      - '.github/workflows/research-idea-gradle-cache-ab.yml'

permissions:
  contents: read

concurrency:
  group: research-idea-gradle-cache-ab-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  STARTER_PLATFORM_VERSION: '2026.2.3'
  STARTER_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
  STARTER_SUITES: >-
    com.algorist.markflow.e2e.MarkFlowStarterSharedJcefDerivedContentTest|
    com.algorist.markflow.e2e.MarkFlowStarterDifferentialManifestTest|
    com.algorist.markflow.e2e.MarkFlowStarterHeadingRobotTest

jobs:
  package-and-seed:
    name: Package exact plugin and seed research IDEA cache
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    outputs:
      cache-key: ${{ steps.cache-key.outputs.key }}
    steps:
      - name: Fetch exact research source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.STARTER_SOURCE_SHA }}
          persist-credentials: false

      - name: Verify exact source checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$STARTER_SOURCE_SHA"

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: zulu
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      - name: Build exact plugin artifact once
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew buildPlugin -PplatformVersion="$STARTER_PLATFORM_VERSION" --stacktrace

          mapfile -t archives < <(find build/distributions -maxdepth 1 -type f -name '*.zip' -print | sort)
          if [ "${#archives[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one plugin distribution, found ${#archives[@]}"
            exit 1
          fi

          artifact="${archives[0]}"
          archive_name="$(basename "$artifact")"
          digest="$(sha256sum "$artifact" | awk '{print $1}')"
          mkdir -p build/e2e-package
          cp "$artifact" build/e2e-package/plugin.zip
          {
            echo "source_sha=$STARTER_SOURCE_SHA"
            echo "plugin_archive=$archive_name"
            echo "plugin_sha256=$digest"
            echo "platform_version=$STARTER_PLATFORM_VERSION"
            echo "scenario_sets=derived-content"
          } > build/e2e-package/manifest.txt

      - name: Stage only IDEA Gradle-platform cache material
        id: stage-cache
        shell: bash
        run: |
          set -euo pipefail
          overlay="$GITHUB_WORKSPACE/build/research-idea-gradle-cache/home"
          rm -rf "$overlay"
          mkdir -p "$overlay"

          module_dir="$HOME/.gradle/caches/modules-2/files-2.1/idea/idea/$STARTER_PLATFORM_VERSION"
          if [ ! -d "$module_dir" ]; then
            echo "::error::IDEA module cache missing after buildPlugin: $module_dir"
            exit 1
          fi
          module_rel="${module_dir#"$HOME/.gradle/"}"
          mkdir -p "$overlay/$(dirname "$module_rel")"
          cp -a "$module_dir" "$overlay/$(dirname "$module_rel")/"

          mapfile -d '' -t transformed_dirs < <(
            find "$HOME/.gradle/caches" -type d \
              -path "*/transforms/*/transformed/idea-${STARTER_PLATFORM_VERSION}-aarch64" \
              -print0
          )
          if [ "${#transformed_dirs[@]}" -eq 0 ]; then
            echo "::error::No transformed IDEA $STARTER_PLATFORM_VERSION ARM64 cache directory found"
            exit 1
          fi

          declare -A copied=()
          for transformed in "${transformed_dirs[@]}"; do
            transform_root="$(dirname "$(dirname "$transformed")")"
            if [ -n "${copied[$transform_root]:-}" ]; then
              continue
            fi
            copied["$transform_root"]=1
            rel="${transform_root#"$HOME/.gradle/"}"
            mkdir -p "$overlay/$(dirname "$rel")"
            cp -a "$transform_root" "$overlay/$(dirname "$rel")/"
          done

          bytes="$(du -sb "$overlay" | awk '{print $1}')"
          files="$(find "$overlay" -type f | wc -l | tr -d ' ')"
          printf 'overlay_bytes=%s\noverlay_files=%s\ntransform_roots=%s\n' \
            "$bytes" "$files" "${#copied[@]}" | tee build/research-idea-gradle-cache/producer-metrics.txt

      - name: Compute exact research cache key
        id: cache-key
        shell: bash
        run: |
          set -euo pipefail
          harness_sha="$(sha256sum .github/workflows/research-idea-gradle-cache-ab.yml | awk '{print $1}')"
          wrapper_sha="$(sha256sum gradle/wrapper/gradle-wrapper.properties | awk '{print $1}')"
          key="r2a92-idea-gradle-${RUNNER_OS}-${RUNNER_ARCH}-${STARTER_PLATFORM_VERSION}-${wrapper_sha}-${harness_sha}-${STARTER_SOURCE_SHA}"
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "cache_key=$key" >> build/research-idea-gradle-cache/producer-metrics.txt

      - name: Start research cache save timer
        shell: bash
        run: echo "RESEARCH_CACHE_SAVE_START_MS=$(date +%s%3N)" >> "$GITHUB_ENV"

      - name: Save isolated IDEA Gradle-platform cache
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build/research-idea-gradle-cache/home
          key: ${{ steps.cache-key.outputs.key }}

      - name: Record research cache save duration
        shell: bash
        run: |
          set -euo pipefail
          end_ms="$(date +%s%3N)"
          echo "cache_save_ms=$((end_ms - RESEARCH_CACHE_SAVE_START_MS))" >> build/research-idea-gradle-cache/producer-metrics.txt

      - name: Upload exact plugin artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: research-idea-cache-plugin-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 7
          path: build/e2e-package

      - name: Upload producer metrics
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: research-idea-cache-producer-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 7
          path: build/research-idea-gradle-cache/producer-metrics.txt

  derived-content-ab:
    needs: [package-and-seed]
    name: Derived content ${{ matrix.arm }} replica ${{ matrix.replica }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        arm: [control, warm]
        replica: [1, 2]
    steps:
      - name: Fetch exact research source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ env.STARTER_SOURCE_SHA }}
          persist-credentials: false

      - name: Verify exact source checkout
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$STARTER_SOURCE_SHA"

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: zulu
          java-version: 25

      - name: Setup Gradle production-equivalent baseline
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      - name: Install ARM64 Skiko EGL runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1
          ldconfig -p | grep -F libEGL.so.1

      - name: Download exact plugin artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: research-idea-cache-plugin-${{ github.run_id }}
          path: build/e2e-package

      - name: Restore and verify packaged plugin identity
        shell: bash
        run: |
          set -euo pipefail
          manifest="build/e2e-package/manifest.txt"
          [ -f "$manifest" ]
          [ -f build/e2e-package/plugin.zip ]

          value() { sed -n "s/^$1=//p" "$manifest"; }
          source_sha="$(value source_sha)"
          archive_name="$(value plugin_archive)"
          expected_digest="$(value plugin_sha256)"
          platform_version="$(value platform_version)"
          scenario_sets="$(value scenario_sets)"

          [ "$source_sha" = "$STARTER_SOURCE_SHA" ]
          [ "$platform_version" = "$STARTER_PLATFORM_VERSION" ]
          [[ "$scenario_sets" == *"derived-content"* ]]
          [[ "$expected_digest" =~ ^[0-9a-f]{64}$ ]]
          actual_digest="$(sha256sum build/e2e-package/plugin.zip | awk '{print $1}')"
          [ "$actual_digest" = "$expected_digest" ]

          mkdir -p build/distributions
          cp build/e2e-package/plugin.zip "build/distributions/$archive_name"
          echo "E2E_PLUGIN_PATH=$GITHUB_WORKSPACE/build/distributions/$archive_name" >> "$GITHUB_ENV"
          echo "E2E_PLUGIN_SHA256=$expected_digest" >> "$GITHUB_ENV"

      - name: Remove only IDEA 2026.2.3 Gradle-platform material
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$HOME/.gradle/caches/modules-2/files-2.1/idea/idea/$STARTER_PLATFORM_VERSION"

          mapfile -d '' -t transformed_dirs < <(
            find "$HOME/.gradle/caches" -type d \
              -path "*/transforms/*/transformed/idea-${STARTER_PLATFORM_VERSION}-aarch64" \
              -print0 2>/dev/null || true
          )
          declare -A removed=()
          for transformed in "${transformed_dirs[@]}"; do
            transform_root="$(dirname "$(dirname "$transformed")")"
            if [ -z "${removed[$transform_root]:-}" ]; then
              removed["$transform_root"]=1
              rm -rf "$transform_root"
            fi
          done
          echo "removed_transform_roots=${#removed[@]}" | tee "$RUNNER_TEMP/research-idea-cache-prep.txt"

      - name: Start research cache restore timer
        if: matrix.arm == 'warm'
        shell: bash
        run: echo "RESEARCH_CACHE_RESTORE_START_MS=$(date +%s%3N)" >> "$GITHUB_ENV"

      - name: Restore isolated IDEA Gradle-platform cache
        if: matrix.arm == 'warm'
        id: idea-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: build/research-idea-gradle-cache/home
          key: ${{ needs.package-and-seed.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Apply research cache overlay
        if: matrix.arm == 'warm'
        shell: bash
        run: |
          set -euo pipefail
          restore_end_ms="$(date +%s%3N)"
          overlay="build/research-idea-gradle-cache/home"
          [ -d "$overlay" ]
          apply_start_ms="$(date +%s%3N)"
          cp -a "$overlay"/. "$HOME/.gradle/"
          apply_end_ms="$(date +%s%3N)"
          {
            echo "cache_hit=${{ steps.idea-cache.outputs.cache-hit }}"
            echo "cache_restore_ms=$((restore_end_ms - RESEARCH_CACHE_RESTORE_START_MS))"
            echo "overlay_apply_ms=$((apply_end_ms - apply_start_ms))"
            echo "overlay_bytes=$(du -sb "$overlay" | awk '{print $1}')"
          } >> "$RUNNER_TEMP/research-idea-cache-prep.txt"

      - name: Record control cache metrics
        if: matrix.arm == 'control'
        shell: bash
        run: |
          {
            echo "cache_hit=not-restored"
            echo "cache_restore_ms=0"
            echo "overlay_apply_ms=0"
            echo "overlay_bytes=0"
          } >> "$RUNNER_TEMP/research-idea-cache-prep.txt"

      - name: Install pinned sandboxed JCEF AppArmor profile
        shell: bash
        env:
          STARTER_SHARD: derived-content
        run: |
          set -euo pipefail
          bash .github/scripts/install-starter-jcef-apparmor.sh --self-test
          bash .github/scripts/install-starter-jcef-apparmor.sh

      - name: Start virtual display
        shell: bash
        run: |
          set -euo pipefail
          Xvfb :99 -screen 0 1920x1080x24 >"$RUNNER_TEMP/research-idea-cache-xvfb.log" 2>&1 &
          printf 'DISPLAY=:99\n' >> "$GITHUB_ENV"

      - name: Run derived-content Starter shard and record metrics
        shell: bash
        env:
          STARTER_SHARD: derived-content
        run: |
          set -euo pipefail
          python3 .github/scripts/check-starter-driver-diagnostics.py --self-test

          pass_dir="build/e2e-evidence/research-${{ matrix.arm }}-${{ matrix.replica }}"
          marker="$RUNNER_TEMP/research-idea-cache-start"
          gradle_log="$RUNNER_TEMP/research-idea-cache-gradle.log"
          mkdir -p "$pass_dir"
          touch "$marker"

          IFS='|' read -r -a suites <<< "$STARTER_SUITES"
          gradle_args=(
            integrationTest
            -x buildPlugin
            -PplatformVersion="$STARTER_PLATFORM_VERSION"
            -PstarterPackagedPlugin=true
            --stacktrace
          )
          diagnostics_args=()
          for suite in "${suites[@]}"; do
            gradle_args+=(--tests "$suite")
            diagnostics_args+=(--required-suite "$suite")
          done

          started_ms="$(date +%s%3N)"
          set +e
          timeout --signal=TERM --kill-after=30s 24m ./gradlew "${gradle_args[@]}" 2>&1 | tee "$gradle_log"
          test_status="${PIPESTATUS[0]}"
          set -e
          ended_ms="$(date +%s%3N)"

          if [ -d build/test-results/integrationTest ]; then
            cp -R build/test-results/integrationTest "$pass_dir/test-results"
          fi
          if [ -d build/reports/tests/integrationTest ]; then
            cp -R build/reports/tests/integrationTest "$pass_dir/test-report"
          fi

          while IFS= read -r -d '' log; do
            log_dir="$(dirname "$log")"
            relative="${log_dir#./}"
            destination="$pass_dir/logs/$relative"
            mkdir -p "$destination"
            cp -R "$log_dir"/. "$destination/"
          done < <(
            find out/ide-tests build/idea-sandbox .intellijPlatform/sandbox \
              -type f -name idea.log -newer "$marker" -print0 2>/dev/null || true
          )

          diagnostics_status=0
          set +e
          python3 .github/scripts/check-starter-driver-diagnostics.py \
            --root "$pass_dir" \
            --output "$pass_dir/diagnostics.json" \
            "${diagnostics_args[@]}"
          diagnostics_status=$?
          set -e

          actual_digest="$(sha256sum "$E2E_PLUGIN_PATH" | awk '{print $1}')"
          [ "$actual_digest" = "$E2E_PLUGIN_SHA256" ]

          metrics="$pass_dir/metrics.txt"
          cp "$RUNNER_TEMP/research-idea-cache-prep.txt" "$metrics"
          {
            echo "arm=${{ matrix.arm }}"
            echo "replica=${{ matrix.replica }}"
            echo "source_sha=$STARTER_SOURCE_SHA"
            echo "platform_version=$STARTER_PLATFORM_VERSION"
            echo "runner_arch=$RUNNER_ARCH"
            echo "gradle_wall_ms=$((ended_ms - started_ms))"
            echo "gradle_direct_idea_downloads=$(grep -Fc "Downloading https://download.jetbrains.com/idea/idea-${STARTER_PLATFORM_VERSION}-aarch64.tar.gz to $HOME/.gradle/.tmp/" "$gradle_log" || true)"
            echo "gradle_idea_extracts=$(grep -Fc "[org.jetbrains.intellij.platform] Extracting archive" "$gradle_log" || true)"
            echo "starter_installer_downloads=$(grep -Ec "Downloading https://download.jetbrains.com/idea/idea-${STARTER_PLATFORM_VERSION}-aarch64.tar.gz to .*/out/ide-tests/installers/" "$gradle_log" || true)"
            echo "plugin_sha256=$actual_digest"
          } >> "$metrics"

          cp "$gradle_log" "$pass_dir/gradle.log"

          if [ "$test_status" -ne 0 ]; then
            echo "Derived-content research arm failed with status $test_status" >&2
            exit "$test_status"
          fi
          if [ "$diagnostics_status" -ne 0 ]; then
            echo "Derived-content diagnostics failed" >&2
            exit "$diagnostics_status"
          fi

      - name: Upload A/B evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: research-idea-cache-${{ matrix.arm }}-${{ matrix.replica }}-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            build/e2e-evidence/**
            ${{ runner.temp }}/research-idea-cache-xvfb.log
