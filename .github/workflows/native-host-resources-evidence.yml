name: Native Host Resources Evidence

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/native-host-resources-evidence.yml'
      - 'build.gradle.kts'
      - 'gradle.properties'
      - 'src/main/resources/META-INF/plugin.xml'
      - 'src/main/kotlin/com/algorist/markflow/editor/native/**'
      - 'src/main/kotlin/com/algorist/markflow/trust/**'
      - 'src/test/kotlin/com/algorist/markflow/editor/native/**'
      - 'src/test/kotlin/com/algorist/markflow/trust/**'
      - 'docs/architecture/native-host-resources.md'
  pull_request:
    paths:
      - '.github/workflows/native-host-resources-evidence.yml'
      - 'build.gradle.kts'
      - 'gradle.properties'
      - 'src/main/resources/META-INF/plugin.xml'
      - 'src/main/kotlin/com/algorist/markflow/editor/native/**'
      - 'src/main/kotlin/com/algorist/markflow/trust/**'
      - 'src/test/kotlin/com/algorist/markflow/editor/native/**'
      - 'src/test/kotlin/com/algorist/markflow/trust/**'
      - 'docs/architecture/native-host-resources.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-host-resources-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: Real IntelliJ native host resources probe
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          large-packages: false

      - name: Fetch Sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: zulu
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: true

      - name: Assert native host-resource package has no browser-realm capability dependency
        shell: bash
        run: |
          set -euo pipefail
          files=(
            src/main/kotlin/com/algorist/markflow/editor/native/NativeHostResourceProjection.kt
            src/main/kotlin/com/algorist/markflow/editor/native/NativeHostResourcePresentationController.kt
            src/main/kotlin/com/algorist/markflow/trust/ExternalNavigationPolicy.kt
            src/main/kotlin/com/algorist/markflow/trust/NativeLocalImageResolver.kt
          )
          if grep -En 'MarkFlowWebviewResourceManager|SourceNativeLocalImageCapability|JBCef|com\.intellij\.ui\.jcef|127\.0\.0\.1|__markflow_source_image__' "${files[@]}"; then
            echo 'native host-resource implementation depends on forbidden browser/JCEF/loopback capability surface' >&2
            exit 1
          fi

      - name: Start virtual display
        shell: bash
        run: |
          set -euo pipefail
          Xvfb :99 -screen 0 1920x1080x24 >"$RUNNER_TEMP/markflow-native-host-resources-xvfb.log" 2>&1 &
          printf 'DISPLAY=:99\n' >> "$GITHUB_ENV"

      - name: Run real IntelliJ native host resources probe with JCEF plugin disabled
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=15s 8m ./gradlew runIdeForNativeHostResourcesProbe --stacktrace

      - name: Validate native host resources evidence completeness
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('build/native-host-resources-probe/evidence.json')
          if not path.is_file():
              raise SystemExit('native host resources probe did not produce evidence.json')

          evidence = json.loads(path.read_text(encoding='utf-8'))
          if evidence.get('schemaVersion') != 1:
              raise SystemExit(f"unexpected evidence schema: {evidence.get('schemaVersion')}")
          if evidence.get('selectedSurface') != 'PLATFORM_TEXT_EDITOR_HOST_RESOURCES':
              raise SystemExit(f"unexpected selected surface: {evidence.get('selectedSurface')}")
          if evidence.get('verdict') != 'PASS':
              raise SystemExit(f"native host resources verdict is not PASS: {evidence.get('verdict')}")

          required = {
              'jcef-plugin-absent-host-resource-path',
              'authoritative-document-fixture',
              'platform-text-editor-selected',
              'host-resource-projection-contract',
              'valid-and-failed-local-image-runtime',
              'caret-selection-exact-source-reveal',
              'explicit-host-navigation-allow-deny',
              'split-editor-presentation-isolation',
              'hostile-local-path-and-media-policy',
              'document-move-and-reopen-context',
              'stale-image-result-rejected',
              'repeated-create-dispose-ownership',
              'final-source-and-lifecycle-stability',
          }
          cases = evidence.get('cases') or []
          by_id = {case.get('id'): case for case in cases}
          if len(by_id) != len(cases):
              raise SystemExit('duplicate native host-resource evidence case ids')
          if set(by_id) != required:
              raise SystemExit(
                  f"host-resource case contract mismatch: missing={sorted(required - set(by_id))}, "
                  f"unexpected={sorted(set(by_id) - required)}"
              )
          failed = sorted(case_id for case_id in required if by_id[case_id].get('outcome') != 'PASS')
          if failed:
              raise SystemExit(f'native host-resource required cases failed: {failed}')

          jcef = str(by_id['jcef-plugin-absent-host-resource-path'].get('detail', ''))
          if 'jcefClassPresent=false' not in jcef or 'jcefSupported=false' not in jcef:
              raise SystemExit(f'JCEF-disabled host-resource proof incomplete: {jcef}')
          images = str(by_id['valid-and-failed-local-image-runtime'].get('detail', ''))
          if 'pngJpegDecoded=4' not in images or 'sourceFallback=true' not in images:
              raise SystemExit(f'local image success/failure runtime proof incomplete: {images}')
          hostile = str(by_id['hostile-local-path-and-media-policy'].get('detail', ''))
          for marker in ('symlinkEscapeRejected=true', 'mediaMismatchRejected=true', 'oversizeRejected=true'):
              if marker not in hostile:
                  raise SystemExit(f'hostile local-image proof missing {marker}: {hostile}')
          navigation = str(by_id['explicit-host-navigation-allow-deny'].get('detail', ''))
          for marker in ('httpAccepted=1', 'implicitGestureRejected=true', 'javascriptRejected=true', 'relativeRejected=true'):
              if marker not in navigation:
                  raise SystemExit(f'navigation proof missing {marker}: {navigation}')
          moved = str(by_id['document-move-and-reopen-context'].get('detail', ''))
          for marker in ('oldContextRevoked=true', 'movedContextResolved=true', 'reopenedNativeOwner=true'):
              if marker not in moved:
                  raise SystemExit(f'move/reopen proof missing {marker}: {moved}')
          stale = str(by_id['stale-image-result-rejected'].get('detail', ''))
          if 'staleOverwrite=false' not in stale:
              raise SystemExit(f'stale image proof incomplete: {stale}')
          final = str(by_id['final-source-and-lifecycle-stability'].get('detail', ''))
          if 'controllers=0' not in final or 'editors=0' not in final or 'sourceStable=true' not in final:
              raise SystemExit(f'final ownership/source proof incomplete: {final}')

          print(f"Native host resources verdict: {evidence['verdict']}")
          print(f"IDE build: {evidence.get('ideBuild')}")
          for case_id in sorted(required):
              print(f"{case_id}: {by_id[case_id].get('outcome')}")
          PY

      - name: Upload native host resources evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: native-host-resources-evidence
          path: |
            build/native-host-resources-probe/evidence.json
            build/idea-sandbox/**/log/idea.log
            ${{ runner.temp }}/markflow-native-host-resources-xvfb.log
          if-no-files-found: warn
