name: PR Metadata Safety

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-metadata-safety-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  metadata-safety:
    name: PR Metadata Safety
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact PR head for squash-message policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Reject squash CI-skip directives
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body || '' }}
        run: python3 .github/scripts/check-squash-message-safety.py
