name: Normalize 155 Convergence

on:
  pull_request:
    paths:
      - '.github/workflows/normalize-155-convergence.yml'

permissions:
  contents: write

concurrency:
  group: normalize-155-convergence-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  normalize:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Normalize #155 source and settings convergence
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/run-normalize-155.py

      - name: Verify renderer and focused JVM regressions
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix webview test
          ./gradlew test \
            --tests com.algorist.markflow.settings.MarkFlowSettingsTest \
            --tests com.algorist.markflow.editor.native.NativeDerivedPresentationControllerTest \
            --stacktrace

      - name: Commit normalized implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Normalizer produced no implementation changes.' >&2
            exit 1
          fi
          if git diff --cached --name-only | grep -q '^\.github/workflows/'; then
            echo 'Normalizer attempted to modify a workflow file.' >&2
            exit 1
          fi
          git commit -m 'refactor(leap): converge presentation settings and renderer policy'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
