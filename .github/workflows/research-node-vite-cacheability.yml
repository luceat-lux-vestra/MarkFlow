name: Research Node/Vite Cacheability

on:
  push:
    branches:
      - research/475-node-vite-phase-a

permissions:
  contents: read

concurrency:
  group: research-475-node-vite-b2-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: true

jobs:
  producer:
    name: B2 clean-node_modules producer
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    outputs:
      key: ${{ steps.cache-id.outputs.key }}
      node-modules-digest: ${{ steps.identity.outputs.digest }}
    steps:
      - name: Check out exact research HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: zulu
          java-version: 25

      - name: Restore Gradle state read-only
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      - name: Compute exact B2 cache identity
        id: cache-id
        shell: bash
        run: |
          set -euo pipefail
          node_version="$(tr -d '\r\n' < .nvmrc)"
          lock_sha="$(sha256sum webview/package-lock.json | awk '{print $1}')"
          [ "$node_version" = "26.10.0" ]
          [ "$RUNNER_ARCH" = "ARM64" ]
          key="markflow-node-modules-b2-${RUNNER_OS}-${RUNNER_ARCH}-node-${node_version}-npm-11.19.1-lock-${lock_sha}-head-${GITHUB_SHA}-run-${GITHUB_RUN_ID}"
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "B2 cache key: $key"

      - name: Produce clean node_modules with real npm ci
        env:
          REPLICA: producer
          npm_config_cache: ${{ runner.temp }}/markflow-npm-b2-producer-cache
        run: .github/scripts/research-node-vite-cache-b2.sh producer

      - name: Export clean node_modules digest
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          digest="$(awk -F '\t' '$1=="node_modules_clean.digest"{print $2}' build/reports/node-vite-cache-b2/summary.tsv)"
          [ -n "$digest" ]
          [ ! -d webview/node_modules/.vite ]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Clean node_modules digest: $digest"

      - name: Save exact clean node_modules cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: webview/node_modules
          key: ${{ steps.cache-id.outputs.key }}

      - name: Upload B2 producer evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: node-vite-b2-producer
          path: build/reports/node-vite-cache-b2
          if-no-files-found: error
          retention-days: 7

  cold:
    name: B2 cold control ${{ matrix.replica }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2]
    steps:
      - name: Check out exact research HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: zulu
          java-version: 25

      - name: Restore Gradle state read-only
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      - name: Install native ARM64 Chromium for webview acceptance
        shell: bash
        run: |
          set -euo pipefail
          [ "$(uname -m)" = "aarch64" ] && [ "$RUNNER_ARCH" = "ARM64" ]
          sudo apt-get update
          sudo apt-get install -y chromium-browser
          /snap/bin/chromium --version

      - name: Run cold B2 consumer
        env:
          REPLICA: ${{ matrix.replica }}
          CHROME_BIN: /snap/bin/chromium
          npm_config_cache: ${{ runner.temp }}/markflow-npm-b2-cold-cache
        run: .github/scripts/research-node-vite-cache-b2.sh cold

      - name: Upload cold B2 evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: node-vite-b2-cold-${{ matrix.replica }}
          path: build/reports/node-vite-cache-b2
          if-no-files-found: error
          retention-days: 7

  warm:
    name: B2 warm consumer ${{ matrix.replica }}
    needs: producer
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2]
    steps:
      - name: Check out exact research HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: zulu
          java-version: 25

      - name: Restore Gradle state read-only
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      - name: Restore exact clean node_modules cache
        id: restore-node-modules
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: webview/node_modules
          key: ${{ needs.producer.outputs.key }}
          fail-on-cache-miss: true

      - name: Require exact producer cache hit
        shell: bash
        env:
          CACHE_HIT: ${{ steps.restore-node-modules.outputs.cache-hit }}
        run: |
          set -euo pipefail
          [ "$CACHE_HIT" = "true" ] || {
            echo "::error::Exact B2 producer cache was not restored."
            exit 1
          }

      - name: Install native ARM64 Chromium for webview acceptance
        shell: bash
        run: |
          set -euo pipefail
          [ "$(uname -m)" = "aarch64" ] && [ "$RUNNER_ARCH" = "ARM64" ]
          sudo apt-get update
          sudo apt-get install -y chromium-browser
          /snap/bin/chromium --version

      - name: Run warm B2 consumer without npm ci
        env:
          REPLICA: ${{ matrix.replica }}
          CHROME_BIN: /snap/bin/chromium
          EXPECTED_NODE_MODULES_DIGEST: ${{ needs.producer.outputs.node-modules-digest }}
        run: .github/scripts/research-node-vite-cache-b2.sh warm

      - name: Upload warm B2 evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: node-vite-b2-warm-${{ matrix.replica }}
          path: build/reports/node-vite-cache-b2
          if-no-files-found: error
          retention-days: 7
