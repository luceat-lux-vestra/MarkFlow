name: Research Node/Vite Cacheability

on:
  push:
    branches:
      - research/475-node-vite-phase-a

permissions:
  contents: read

concurrency:
  group: research-475-node-vite-phase-a-${{ github.ref }}
  cancel-in-progress: false

jobs:
  phase-a:
    name: Phase A replica ${{ matrix.replica }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2]
    env:
      CI: true
      REPLICA: ${{ matrix.replica }}
    steps:
      - name: Check out exact research HEAD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: zulu
          java-version: 25

      - name: Restore Gradle state read-only
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      # Match the production ARM64 Test job prerequisite exactly: Mermaid browser
      # acceptance is mandatory and must fail closed rather than be skipped.
      - name: Install native ARM64 Chromium for webview acceptance
        shell: bash
        run: |
          set -euo pipefail
          [ "$(uname -m)" = "aarch64" ] && [ "$RUNNER_ARCH" = "ARM64" ]
          sudo apt-get update
          sudo apt-get install -y chromium-browser
          /snap/bin/chromium --version

      - name: Measure cold and same-job warm renderer tasks
        env:
          CHROME_BIN: /snap/bin/chromium
        run: .github/scripts/research-node-vite-cacheability.sh

      - name: Publish measurement summary
        if: ${{ always() }}
        run: |
          if [ -f build/reports/node-vite-cacheability/summary.tsv ]; then
            cat build/reports/node-vite-cacheability/summary.tsv
            {
              echo '### #475 Phase A replica ${{ matrix.replica }}'
              echo
              echo '\`\`\`text'
              cat build/reports/node-vite-cacheability/summary.tsv
              echo '\`\`\`'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Phase A evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: node-vite-phase-a-replica-${{ matrix.replica }}
          path: build/reports/node-vite-cacheability
          if-no-files-found: error
          retention-days: 7
