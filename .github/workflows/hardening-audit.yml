# Repository hardening checks. The required-context candidate stays staged until
# this job has been observed reliably on merged main and ordinary pull requests.
# Scheduled/manual audit is credential-less by default. Privileged live GitHub
# administration readback is an explicit opt-in boundary and is never inferred
# from a successful offline audit.

name: Hardening audit

on:
  push:
    branches: [ main ]
  pull_request:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hardening-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # This is the staged candidate context. It never receives a repository-admin
  # secret, so it is safe on pull requests and remains the default scheduled/
  # manual drift check for repository-owned policy and workflow state.
  audit:
    name: Hardening audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Fetch Sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.3

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: v1.7.12
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          GOBIN="$RUNNER_TEMP/bin" go install "github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_VERSION}"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Run actionlint across all workflows
        run: actionlint -color

      # The action has no Advanced Security upload or online audits. Its read-only
      # workflow token is only for the scanner invocation, never live administration.
      - name: Run zizmor across all workflows
        uses: zizmorcore/zizmor-action@70fb788f84895a7701f5643d103d587e460b5c99 # v0.6.3
        with:
          advanced-security: false
          online-audits: false
          token: ${{ github.token }}
          version: v1.30.0
          inputs: .github/workflows

      - name: Verify actionlint rejects invalid fixture
        id: actionlint-negative
        continue-on-error: true
        run: actionlint .github/fixtures/workflow-static-analysis/invalid-actionlint.yml

      - name: Enforce actionlint negative control
        if: ${{ always() }}
        env:
          ACTIONLINT_NEGATIVE_OUTCOME: ${{ steps.actionlint-negative.outcome }}
        run: |
          set -euo pipefail
          if [ "$ACTIONLINT_NEGATIVE_OUTCOME" != failure ]; then
            echo "::error::actionlint unexpectedly accepted the invalid workflow fixture."
            exit 1
          fi

      - name: Verify zizmor rejects unsafe fixture
        id: zizmor-negative
        continue-on-error: true
        uses: zizmorcore/zizmor-action@70fb788f84895a7701f5643d103d587e460b5c99 # v0.6.3
        with:
          advanced-security: false
          online-audits: false
          token: ${{ github.token }}
          version: v1.30.0
          inputs: .github/fixtures/workflow-static-analysis/unsafe-zizmor.yml

      - name: Enforce zizmor negative control
        if: ${{ always() }}
        env:
          ZIZMOR_NEGATIVE_OUTCOME: ${{ steps.zizmor-negative.outcome }}
        run: |
          set -euo pipefail
          if [ "$ZIZMOR_NEGATIVE_OUTCOME" != failure ]; then
            echo "::error::zizmor unexpectedly accepted the unsafe workflow fixture."
            exit 1
          fi

      - name: Run offline merge-gate audit
        run: bash .github/scripts/hardening-audit.sh --mode gate --no-network

      - name: Run release preflight fixtures
        run: bash .github/scripts/release-preflight-test.sh

  # Optional privileged readback. It is disabled unless a maintainer deliberately
  # opts in with repository variable HARDENING_LIVE_READBACK_ENABLED=true and
  # separately provisions the scoped credential. The repository does not require
  # either setting for normal PR, push, scheduled, or manual hardening audits.
  live-readback:
    name: Live hardening readback
    if: ${{ vars.HARDENING_LIVE_READBACK_ENABLED == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && (github.event_name == 'schedule' || github.ref_name == github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Fetch Sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Run authoritative live readback
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          HARDENING_AUDIT_TOKEN: ${{ secrets.HARDENING_AUDIT_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${HARDENING_AUDIT_TOKEN:-}" ]; then
            echo "::error::Privileged live readback was explicitly enabled but HARDENING_AUDIT_TOKEN is not provisioned."
            echo "::error::Disable HARDENING_LIVE_READBACK_ENABLED or provision a least-privilege repository-administration credential."
            exit 1
          fi
          bash .github/scripts/hardening-audit.sh --mode report
