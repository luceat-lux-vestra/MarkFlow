# Repository hardening gate. The always-present PR job is fully offline.
# Scheduled/manual runs perform live ruleset readback only when a deliberately
# provisioned repository-administration credential is available; absence of that
# credential is explicit and must never be reported as a successful live audit.

name: Hardening audit

on:
  push:
    branches: [ main ]
  pull_request:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hardening-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Hardening audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch Sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run merge-gate audit
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          HARDENING_AUDIT_TOKEN: ${{ secrets.HARDENING_AUDIT_TOKEN }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] || [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ -n "${HARDENING_AUDIT_TOKEN:-}" ]; then
              export GH_TOKEN="$HARDENING_AUDIT_TOKEN"
              bash .github/scripts/hardening-audit.sh --mode report
            else
              echo "::warning::HARDENING_AUDIT_TOKEN is not provisioned; live ruleset/label readback is explicitly skipped."
              bash .github/scripts/hardening-audit.sh --mode report --no-network
            fi
          else
            bash .github/scripts/hardening-audit.sh --mode gate --no-network
          fi
