# Repository hardening checks. Pull-request execution is deliberately scoped to
# hardening-sensitive repository inputs; scheduled/manual runs remain the complete
# credential-less drift audit. Privileged live GitHub administration readback remains
# an explicit opt-in boundary and is never inferred from a successful offline audit.

name: Hardening audit

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/**'
      - 'gradle/**'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.nvmrc'
      - 'webview/package.json'
      - 'webview/package-lock.json'
      - '.run/**'
      - 'GOVERNANCE.md'
      - 'docs/architecture/**'
      - 'docs/release/**'
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact trusted main commit SHA to audit; defaults to the dispatch ref.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: hardening-audit-${{ inputs.target_sha || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Hardening audit
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 20
    steps:
      - name: Validate dispatched target
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ inputs.target_sha || github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Recovery target is not an exact 40-hex commit SHA."; exit 1; }
          comparison="$(gh api "repos/$GITHUB_REPOSITORY/compare/$TARGET_SHA...$DEFAULT_BRANCH")"
          status="$(jq -r '.status // empty' <<<"$comparison")"
          base_sha="$(jq -r '.base_commit.sha // empty' <<<"$comparison")"
          merge_base_sha="$(jq -r '.merge_base_commit.sha // empty' <<<"$comparison")"
          if [[ "$base_sha" != "$TARGET_SHA" || "$merge_base_sha" != "$TARGET_SHA" || ( "$status" != "ahead" && "$status" != "identical" ) ]]; then
            echo "::error::Recovery target is not the current default branch or one of its ancestors."
            exit 1
          fi
          printf 'Validated main-history target: %s\n' "$TARGET_SHA"

      - name: Fetch Sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event_name == 'workflow_dispatch' && inputs.target_sha || github.sha }}
          persist-credentials: false

      - name: Verify squash message guard fixtures
        run: python3 .github/scripts/check-squash-message-safety.py --self-test

      - name: Verify issue metadata reconciliation
        run: node --test .github/scripts/issue-metadata.test.cjs .github/scripts/issue-metadata-workflow.test.cjs

      - name: Setup Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
          check-latest: true
          cache: false

      - name: Install actionlint
        working-directory: .github/tools/actionlint
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          go build -mod=mod -o "$RUNNER_TEMP/bin/actionlint" github.com/rhysd/actionlint/cmd/actionlint
          go version -m "$RUNNER_TEMP/bin/actionlint"
          "$RUNNER_TEMP/bin/actionlint" -version
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Run actionlint across all workflows
        run: actionlint -color

      - name: Run zizmor across all workflows
        uses: zizmorcore/zizmor-action@1b4550e929643b8b26a62303c6bd64814271a4f1 # v0.9.2
        with:
          advanced-security: false
          online-audits: false
          token: ${{ github.token }}
          strict-collection: true
          fail-on-no-inputs: true
          annotations: false
          inputs: .github/workflows

      - name: Verify actionlint rejects invalid fixture
        id: actionlint-negative
        continue-on-error: true
        run: actionlint .github/fixtures/workflow-static-analysis/invalid-actionlint.yml

      - name: Enforce actionlint negative control
        if: ${{ always() }}
        env:
          ACTIONLINT_NEGATIVE_OUTCOME: ${{ steps.actionlint-negative.outcome }}
        run: |
          set -euo pipefail
          if [ "$ACTIONLINT_NEGATIVE_OUTCOME" != failure ]; then
            echo "::error::actionlint unexpectedly accepted the invalid workflow fixture."
            exit 1
          fi

      - name: Verify zizmor rejects unsafe fixture
        id: zizmor-negative
        continue-on-error: true
        uses: zizmorcore/zizmor-action@1b4550e929643b8b26a62303c6bd64814271a4f1 # v0.9.2
        with:
          advanced-security: false
          online-audits: false
          token: ${{ github.token }}
          strict-collection: true
          fail-on-no-inputs: true
          annotations: false
          inputs: .github/fixtures/workflow-static-analysis/unsafe-zizmor.yml

      - name: Enforce zizmor negative control
        if: ${{ always() }}
        env:
          ZIZMOR_NEGATIVE_OUTCOME: ${{ steps.zizmor-negative.outcome }}
        run: |
          set -euo pipefail
          if [ "$ZIZMOR_NEGATIVE_OUTCOME" != failure ]; then
            echo "::error::zizmor unexpectedly accepted the unsafe workflow fixture."
            exit 1
          fi

      - name: Run offline merge-gate audit
        run: bash .github/scripts/hardening-audit.sh --mode gate --no-network

      - name: Verify repository hardening contract
        run: bash .github/scripts/repository-hardening-contract.sh

      - name: Verify coordinated toolchain declarations and regression fixtures
        run: python3 .github/scripts/check-toolchain-lifecycle.py --self-test

      - name: Check upstream toolchain targets
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: python3 .github/scripts/check-toolchain-lifecycle.py --upstream

      - name: Verify protected-main Gradle cache seed guards
        run: bash .github/scripts/check-gradle-cache-seed.sh

      - name: Verify dependency submission cutover guards
        run: bash .github/scripts/check-dependency-submission.sh

      - name: Run release preflight fixtures
        run: bash .github/scripts/release-preflight-test.sh

      - name: Verify release candidate SARIF policy fixtures
        run: python3 .github/scripts/release-codeql-verdict.py --self-test

      - name: Verify Marketplace exact-SHA CodeQL evidence controls
        run: python3 .github/scripts/release-codeql-gate.py --self-test

      - name: Verify Marketplace exact-SHA Qodana evidence controls
        run: python3 .github/scripts/release-qodana-gate.py --self-test

  live-readback:
    name: Live hardening readback
    if: ${{ vars.HARDENING_LIVE_READBACK_ENABLED == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && (github.event_name == 'schedule' || (github.ref_name == github.event.repository.default_branch && inputs.target_sha == '')) }}
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Fetch Sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Run authoritative live readback
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          HARDENING_AUDIT_TOKEN: ${{ secrets.HARDENING_AUDIT_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${HARDENING_AUDIT_TOKEN:-}" ]; then
            echo "::error::Privileged live readback was explicitly enabled but HARDENING_AUDIT_TOKEN is not provisioned."
            echo "::error::Disable HARDENING_LIVE_READBACK_ENABLED or provision a least-privilege repository-administration credential."
            exit 1
          fi
          bash .github/scripts/hardening-audit.sh --mode report
