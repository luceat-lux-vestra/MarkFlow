# Read-only repository hardening gate.  The job is always present on ordinary
# pull requests; the live settings report runs only on a scheduled dispatch.

name: Hardening audit

on:
  push:
    branches: [ main ]
  pull_request:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hardening-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Hardening audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch Sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run merge-gate audit
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "schedule" ] || [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            bash .github/scripts/hardening-audit.sh --mode report
          else
            bash .github/scripts/hardening-audit.sh --mode gate --no-network
          fi
