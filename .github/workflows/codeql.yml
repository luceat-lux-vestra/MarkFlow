name: CodeQL
run-name: CodeQL source ${{ inputs.candidate_sha || github.sha }}

on:
  # Intentionally no PR/push CodeQL: repeat scans were a development-CI bottleneck.
  # Exact-main weekly/manual evidence remains required for new Marketplace publication.
  # Manually scan an exact protected-main ancestor SHA without publishing.
  # A successful run is evidence only: it does not prevent manual GitHub Release creation.
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: 'Exact 40-character protected-main ancestor SHA for release-candidate preflight'
        required: true
        type: string
  # Default-branch alerts are refreshed weekly, not on each main merge.
  # When run on the exact current main SHA, scheduled SARIF also becomes
  # release-candidate evidence after the same fail-closed verdict as dispatch.
  schedule:
    - cron: '41 3 * * 3'

permissions: {}

concurrency:
  group: codeql-${{ inputs.candidate_sha || github.sha }}
  cancel-in-progress: false

jobs:
  scan-guard:
    name: CodeQL schedule guard
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      should_scan: ${{ steps.decide.outputs.should_scan }}
    steps:
      - name: Decide whether full CodeQL is required
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then
            echo "should_scan=true" >> "$GITHUB_OUTPUT"
            echo "Explicit candidate scan: always run full CodeQL."
            exit 0
          fi

          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Scheduled source is not an immutable SHA."
            exit 1
          }

          runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/codeql.yml/runs?event=schedule&status=success&branch=main&per_page=100")"
          jq -e --arg sha "$GITHUB_SHA" --argjson current "$GITHUB_RUN_ID" '
            .workflow_runs
            | any(
                .id != $current
                and .head_sha == $sha
                and .head_branch == "main"
                and .path == ".github/workflows/codeql.yml"
              )
          ' <<<"$runs" >/dev/null && {
            echo "should_scan=false" >> "$GITHUB_OUTPUT"
            echo "Protected main SHA $GITHUB_SHA already has a successful scheduled CodeQL run; skipping unchanged full scan."
            exit 0
          }

          echo "should_scan=true" >> "$GITHUB_OUTPUT"
          echo "No successful scheduled CodeQL run exists for protected main SHA $GITHUB_SHA; running full scan."

  analyze:
    needs: scan-guard
    if: needs.scan-guard.outputs.should_scan == 'true'
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none
          # Kotlin 2.4.20 is supported in CodeQL CLI 2.27.1+.
          - language: java-kotlin
            build-mode: manual
    env:
      EXPECTED_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.sha }}
    steps:
      - name: Validate release-evidence source before checkout
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Candidate must be an exact immutable commit SHA"; exit 1; }
          [ "$GITHUB_REF" = "refs/heads/main" ] || { echo "::error::Release evidence must originate from protected main"; exit 1; }
          if [ "$GITHUB_EVENT_NAME" = schedule ]; then
            [ "$GITHUB_SHA" = "$EXPECTED_SHA" ] || { echo "::error::Scheduled event SHA mismatch"; exit 1; }
          fi
          case "$GITHUB_EVENT_NAME" in
            workflow_dispatch|schedule) ;;
            *) echo "::error::Untrusted release-evidence event"; exit 1 ;;
          esac
          remote_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          [[ "$remote_main" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Invalid protected main SHA"; exit 1; }
          compare="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${EXPECTED_SHA}...${remote_main}")"
          jq -e --arg sha "$EXPECTED_SHA" '
            (.status == "ahead" or .status == "identical") and
            .base_commit.sha == $sha and .merge_base_commit.sha == $sha
          ' <<<"$compare" >/dev/null || { echo "::error::Candidate is not in protected main history"; exit 1; }
          echo "Release candidate source verified: $EXPECTED_SHA"

      - name: Fetch exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 0

      - name: Verify exact checkout
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Verify protected-main ancestry
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$EXPECTED_SHA" FETCH_HEAD

      - name: Record analyzed source
        env:
          CODEQL_LANGUAGE: ${{ matrix.language }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path
          sha = os.environ["EXPECTED_SHA"]
          checkout = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if sha != checkout:
              raise SystemExit("Analyzed checkout differs from selected SHA")
          doc = {"schema": 1, "candidate_sha": sha, "checkout_sha": checkout,
                 "event_sha": os.environ["GITHUB_SHA"],
                 "run_id": int(os.environ["GITHUB_RUN_ID"]),
                 "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
                 "language": os.environ["CODEQL_LANGUAGE"]}
          Path(os.environ["RUNNER_TEMP"], "source-identity.json").write_text(
              json.dumps(doc, sort_keys=True), encoding="utf-8")
          PY

      - name: Setup Java for Kotlin CodeQL
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: zulu
          java-version: '25'

      - name: Setup Gradle for Kotlin CodeQL
        if: matrix.language == 'java-kotlin'
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Compile Kotlin for CodeQL
        if: matrix.language == 'java-kotlin'
        # CodeQL manual extraction requires an actual traced Kotlin compiler process.
        # A restored Gradle build-cache output can make the scanner appear green
        # without extracting production Kotlin; force both compilation tasks.
        run: ./gradlew --no-daemon --no-build-cache --rerun-tasks compileKotlin compileTestKotlin -Dorg.gradle.jvmargs=-Xmx3g

      - name: Analyze
        id: analyze
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: "/language:${{ matrix.language }}"
          # Scheduled scans continue uploading main alerts. Only manually dispatched
          # candidate scans suppress alert upload to avoid misattribution.
          upload: ${{ github.event_name == 'workflow_dispatch' && 'never' || 'always' }}
          output: ${{ runner.temp }}/release-codeql-${{ matrix.language }}

      - name: Retain exact candidate SARIF
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-codeql-${{ env.EXPECTED_SHA }}-${{ matrix.language }}
          path: ${{ steps.analyze.outputs.sarif-output }}
          if-no-files-found: error
          retention-days: 90

      - name: Retain verified source provenance
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-source-${{ env.EXPECTED_SHA }}-${{ matrix.language }}
          path: ${{ runner.temp }}/source-identity.json
          if-no-files-found: error
          retention-days: 90

      - name: Enforce candidate security verdict
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        env:
          SARIF_DIR: ${{ steps.analyze.outputs.sarif-output }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 .github/scripts/release-codeql-verdict.py \
            --sarif-dir "$SARIF_DIR" \
            --language "${{ matrix.language }}" \
            --candidate-sha "$EXPECTED_SHA"
          echo "Original SARIF validated for $EXPECTED_SHA."

      - name: Verify protected-main ancestry after analysis
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$EXPECTED_SHA" ]
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$EXPECTED_SHA" FETCH_HEAD
