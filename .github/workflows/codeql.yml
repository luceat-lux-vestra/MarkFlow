name: CodeQL

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Manually scan an exact reviewed, current main SHA before any release is created.
  # A successful run is evidence only: it does not prevent manual GitHub Release creation.
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: 'Exact 40-character main HEAD SHA for release-candidate security preflight'
        required: true
        type: string
  # Default-branch alerts are refreshed weekly, not on each main merge.
  # When run on the exact current main SHA, scheduled SARIF also becomes
  # release-candidate evidence after the same fail-closed verdict as dispatch.
  schedule:
    - cron: '41 3 * * 3'

permissions: {}

concurrency:
  group: codeql-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none
          # Kotlin 2.4.20 is supported in CodeQL CLI 2.27.1+.
          - language: java-kotlin
            build-mode: manual
    env:
      EXPECTED_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_sha || github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Validate release-evidence source before checkout
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Candidate must be an exact immutable commit SHA"; exit 1; }
          [ "$GITHUB_REF" = "refs/heads/main" ] || { echo "::error::Release evidence must originate from protected main"; exit 1; }
          [ "$GITHUB_SHA" = "$EXPECTED_SHA" ] || { echo "::error::Event SHA must match selected candidate"; exit 1; }
          case "$GITHUB_EVENT_NAME" in
            workflow_dispatch|schedule) ;;
            *) echo "::error::Untrusted release-evidence event"; exit 1 ;;
          esac
          remote_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          [ "$remote_main" = "$EXPECTED_SHA" ] || { echo "::error::Stale candidate: current protected main does not match"; exit 1; }
          echo "Release candidate source verified: $EXPECTED_SHA"

      - name: Fetch exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.EXPECTED_SHA }}

      - name: Verify exact checkout
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Setup Java for Kotlin CodeQL
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: zulu
          java-version: '25'

      - name: Setup Gradle for Kotlin CodeQL
        if: matrix.language == 'java-kotlin'
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Compile Kotlin for CodeQL
        if: matrix.language == 'java-kotlin'
        # CodeQL manual extraction requires an actual traced Kotlin compiler process.
        # A restored Gradle build-cache output can make the scanner appear green
        # without extracting production Kotlin; force both compilation tasks.
        run: ./gradlew --no-daemon --no-build-cache --rerun-tasks compileKotlin compileTestKotlin -Dorg.gradle.jvmargs=-Xmx3g

      - name: Analyze
        id: analyze
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: "/language:${{ matrix.language }}"
          # Scheduled scans continue uploading main alerts. Only manually dispatched
          # candidate scans suppress alert upload to avoid misattribution.
          upload: ${{ github.event_name == 'workflow_dispatch' && 'never' || 'always' }}
          output: ${{ runner.temp }}/release-codeql-${{ matrix.language }}

      - name: Retain exact candidate SARIF
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-codeql-${{ env.EXPECTED_SHA }}-${{ matrix.language }}
          path: ${{ steps.analyze.outputs.sarif-output }}
          if-no-files-found: error
          retention-days: 90

      - name: Enforce candidate security verdict
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        env:
          SARIF_DIR: ${{ steps.analyze.outputs.sarif-output }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 .github/scripts/release-codeql-verdict.py \
            --sarif-dir "$SARIF_DIR" \
            --language "${{ matrix.language }}" \
            --candidate-sha "$EXPECTED_SHA"
          # A moving main invalidates this workflow's freshness claim.
          remote_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          [ "$remote_main" = "$EXPECTED_SHA" ] || { echo "::error::main moved during candidate scan; evidence is stale"; exit 1; }
