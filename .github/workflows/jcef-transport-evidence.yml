name: JCEF Transport Evidence

on:
  pull_request:
    paths:
      - '.github/workflows/jcef-transport-evidence.yml'
      - 'build.gradle.kts'
      - 'src/main/kotlin/com/algorist/markflow/MarkFlowStartupActivity.kt'
      - 'src/main/kotlin/com/algorist/markflow/runtime/ApplicationExitCompat.kt'
      - 'src/main/kotlin/com/algorist/markflow/runtime/JcefSourceNativeRuntimeTransport.kt'
      - 'src/main/kotlin/com/algorist/markflow/runtime/JcefTransportEnvelopeProbe.kt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jcef-transport-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: Real JCEF envelope probe
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          large-packages: false

      - name: Fetch Sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6
        with:
          distribution: zulu
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: true

      - name: Start virtual display
        shell: bash
        run: |
          set -euo pipefail
          Xvfb :99 -screen 0 1920x1080x24 >"$RUNNER_TEMP/markflow-xvfb.log" 2>&1 &
          printf 'DISPLAY=:99\n' >> "$GITHUB_ENV"

      - name: Run real JCEF transport probe
        shell: bash
        run: |
          set -euo pipefail
          # Internal case timeouts bound payload callbacks. This outer watchdog also covers a probe
          # that never starts, an IDE that never opens the requested project, or shutdown failure.
          timeout --signal=TERM --kill-after=15s 8m ./gradlew runIdeForJcefTransportProbe --stacktrace

      - name: Validate evidence completeness
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('build/jcef-transport-probe/evidence.json')
          if not path.is_file():
              raise SystemExit('JCEF probe did not produce evidence.json')

          evidence = json.loads(path.read_text(encoding='utf-8'))
          if evidence.get('schemaVersion') != 1:
              raise SystemExit(f"unexpected evidence schema: {evidence.get('schemaVersion')}")
          if evidence.get('cutoverAuthorized') is not False:
              raise SystemExit('evidence runner must never authorize production cutover')
          if evidence.get('baselineTransportCount') != evidence.get('finalTransportCount'):
              raise SystemExit('JCEF transport live-instance count did not return to baseline')

          cases = evidence.get('cases') or []
          expected = {
              'request-ascii-64k',
              'request-complex-64k',
              'request-ascii-1m',
              'request-ascii-4m',
              'response-ascii-4m',
              'host-injection-complex-4m',
              'request-oversize',
              'response-oversize',
              'host-injection-oversize',
              'handler-rejection',
              'late-after-dispose',
              'repeated-create-dispose',
          }
          by_id = {case.get('id'): case for case in cases}
          missing = sorted(expected - by_id.keys())
          if missing:
              raise SystemExit(f'missing probe cases: {missing}')

          incomplete = [
              case for case in cases
              if case.get('outcome') in {'TIMEOUT', 'INCOMPLETE'}
          ]
          if incomplete or evidence.get('verdict') == 'INCOMPLETE':
              raise SystemExit(f'incomplete JCEF evidence: {incomplete}')

          verdict = evidence.get('verdict')
          if verdict not in {'COMPLETE_REQUIRED_ENVELOPE_PASS', 'COMPLETE_CUTOVER_BLOCKED'}:
              raise SystemExit(f'unrecognized verdict: {verdict}')

          print(f"JCEF evidence verdict: {verdict}")
          print(f"IDE build: {evidence.get('ideBuild')}")
          print(f"OS: {evidence.get('osName')} {evidence.get('osVersion')} {evidence.get('osArch')}")
          for case in cases:
              print(f"{case.get('id')}: {case.get('outcome')} ({case.get('payloadUtf16Units')} UTF-16 units)")
          if verdict == 'COMPLETE_CUTOVER_BLOCKED':
              print('::warning::Real JCEF evidence is complete but the current transport does not satisfy the required envelope; production cutover remains blocked.')
          PY

      - name: Upload JCEF evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: jcef-transport-evidence
          path: |
            build/jcef-transport-probe/evidence.json
            build/idea-sandbox/**/log/idea.log
            ${{ runner.temp }}/markflow-xvfb.log
          if-no-files-found: warn
