name: MarkFlow 451 Shared JCEF Experiment (temporary)

# Deliberately branch-only and never a required PR/Merge Gate component.
# Remove this temporary workflow before merging any production change.
on:
  push:
    branches:
      - ci/451-shared-jcef-lifecycle-experiment

permissions:
  contents: read

concurrency:
  group: starter-shared-jcef-experiment-${{ github.ref }}
  cancel-in-progress: true

env:
  STARTER_SOURCE_SHA: ${{ github.sha }}
  STARTER_PLATFORM_VERSION: '2026.2.3'
  STARTER_SHARD: derived-content

jobs:
  package:
    name: Exact plugin package for paired A/B
    if: github.repository == 'luceat-lux-vestra/MarkFlow'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - name: Checkout exact pushed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Assert exact head and expected ARM64 runner
        shell: bash
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$STARTER_SOURCE_SHA" ] || {
            echo "::error::Candidate HEAD drift"; exit 1;
          }
          [ "$RUNNER_OS" = Linux ] && [ "$RUNNER_ARCH" = ARM64 ] && [ "$(uname -m)" = aarch64 ]

      - name: Setup Java 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: zulu
          java-version: 25

      - name: Setup read-only Gradle cache
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      - name: Build exact plugin artifact once
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew buildPlugin -PplatformVersion="$STARTER_PLATFORM_VERSION" --stacktrace
          mapfile -t archives < <(find build/distributions -maxdepth 1 -type f -name '*.zip' -print | sort)
          [ "${#archives[@]}" -eq 1 ] || {
            echo "::error::Expected exactly one plugin ZIP"; exit 1;
          }
          archive="${archives[0]}"
          archive_name="$(basename "$archive")"
          digest="$(sha256sum "$archive" | awk '{print $1}')"
          [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
          mkdir -p build/e2e-package
          cp "$archive" build/e2e-package/plugin.zip
          {
            echo "source_sha=$STARTER_SOURCE_SHA"
            echo "plugin_archive=$archive_name"
            echo "plugin_sha256=$digest"
            echo "platform_version=$STARTER_PLATFORM_VERSION"
            echo "experiment=starter-shared-jcef-paired-ab"
          } | tee build/e2e-package/manifest.txt

      - name: Upload one exact package for all six samples
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: markflow-451-ab-plugin-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: |
            build/e2e-package/plugin.zip
            build/e2e-package/manifest.txt
  shared-jcef:
    needs: [package]
    name: Paired A/B (${{ matrix.mode }}-${{ matrix.sample }})
    if: github.repository == 'luceat-lux-vestra/MarkFlow'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        mode: [isolated, shared]
        sample: [1, 2, 3]
    env:
      MEASUREMENT_MODE: ${{ matrix.mode }}
      MEASUREMENT_SAMPLE: ${{ matrix.sample }}
    steps:
      - name: Checkout exact pushed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Assert exact head and expected ARM64 runner
        shell: bash
        run: |
          set -euo pipefail
          [ "$(git rev-parse HEAD)" = "$STARTER_SOURCE_SHA" ] || {
            echo "::error::Candidate HEAD drift"; exit 1;
          }
          [ "$RUNNER_OS" = Linux ] && [ "$RUNNER_ARCH" = ARM64 ] && [ "$(uname -m)" = aarch64 ]

      - name: Setup Java 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: zulu
          java-version: 25

      - name: Setup read-only Gradle cache
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      - name: Download the one exact package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: markflow-451-ab-plugin-${{ github.run_id }}
          path: build/e2e-package

      - name: Restore and verify exact package identity
        shell: bash
        run: |
          set -euo pipefail
          manifest=build/e2e-package/manifest.txt
          [ -f "$manifest" ] && [ -f build/e2e-package/plugin.zip ]
          manifest_value() {
            sed -n "s/^$1=//p" "$manifest"
          }
          source_sha="$(manifest_value source_sha)"
          archive_name="$(manifest_value plugin_archive)"
          expected_digest="$(manifest_value plugin_sha256)"
          platform_version="$(manifest_value platform_version)"
          experiment="$(manifest_value experiment)"
          [ "$source_sha" = "$STARTER_SOURCE_SHA" ]
          [ "$platform_version" = "$STARTER_PLATFORM_VERSION" ]
          [ "$experiment" = starter-shared-jcef-paired-ab ]
          [[ "$expected_digest" =~ ^[0-9a-f]{64}$ ]]
          actual_digest="$(sha256sum build/e2e-package/plugin.zip | awk '{print $1}')"
          [ "$actual_digest" = "$expected_digest" ]
          mkdir -p build/distributions
          cp build/e2e-package/plugin.zip "build/distributions/$archive_name"
          echo "E2E_PLUGIN_PATH=build/distributions/$archive_name" >> "$GITHUB_ENV"
          echo "E2E_PLUGIN_SHA256=$expected_digest" >> "$GITHUB_ENV"
      - name: Install production-equivalent ARM64 EGL runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1
          ldconfig -p | grep -F libEGL.so.1

      - name: Install pinned derived-content JCEF AppArmor profile
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/install-starter-jcef-apparmor.sh --self-test
          bash .github/scripts/install-starter-jcef-apparmor.sh

      - name: Start matching derived-content Xvfb display
        shell: bash
        run: |
          set -euo pipefail
          Xvfb :99 -screen 0 1920x1080x24 >"$RUNNER_TEMP/markflow-451-xvfb.log" 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"

      - name: Run exact paired workload
        shell: bash
        run: |
          set -euo pipefail
          evidence="build/e2e-evidence/starter-shared-jcef-ab/${MEASUREMENT_MODE}-${MEASUREMENT_SAMPLE}"
          mkdir -p "$evidence"
          rm -rf build/test-results/integrationTest build/reports/tests/integrationTest

          gradle_args=(
            integrationTest
            -x buildPlugin
            -PplatformVersion="$STARTER_PLATFORM_VERSION"
            -PstarterPackagedPlugin=true
            --stacktrace
          )
          if [ "$MEASUREMENT_MODE" = isolated ]; then
            gradle_args+=(
              --tests 'com.algorist.markflow.e2e.MarkFlowStarterProductionWiringTest'
              --tests 'com.algorist.markflow.e2e.MarkFlowStarterDifferentialPreviewSmokeTest'
            )
          elif [ "$MEASUREMENT_MODE" = shared ]; then
            export MARKFLOW_SHARED_JCEF_EXPERIMENT=true
            gradle_args+=(
              --tests 'com.algorist.markflow.e2e.MarkFlowStarterSharedJcefExperimentTest'
            )
          else
            echo "::error::Unknown measurement mode: $MEASUREMENT_MODE"
            exit 1
          fi

          start_ns="$(date +%s%N)"
          set +e
          timeout --signal=TERM --kill-after=30s 24m \
            ./gradlew "${gradle_args[@]}" 2>&1 | tee "$evidence/gradle.log"
          test_status=${PIPESTATUS[0]}
          set -e
          end_ns="$(date +%s%N)"
          wall_ms=$(( (end_ns - start_ns) / 1000000 ))

          archive_hash="$(sha256sum "$E2E_PLUGIN_PATH" | awk '{print $1}')"
          [ "$archive_hash" = "$E2E_PLUGIN_SHA256" ] || {
            echo "::error::Measurement mutated packaged plugin"; exit 1;
          }
          {
            echo "schema=markflow-starter-shared-jcef-ab/v1"
            echo "source_head=$STARTER_SOURCE_SHA"
            echo "mode=$MEASUREMENT_MODE"
            echo "sample=$MEASUREMENT_SAMPLE"
            echo "plugin_sha256=$E2E_PLUGIN_SHA256"
            echo "gradle_wall_ms=$wall_ms"
            echo "gradle_exit=$test_status"
          } | tee "$evidence/measurement.txt"

          [ "$test_status" -eq 0 ] || {
            echo "::error::A/B workload failed with code $test_status"; exit "$test_status";
          }
      - name: Fail closed on shared opt-in evidence
        if: ${{ matrix.mode == 'shared' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os
          import xml.etree.ElementTree as ET
          evidence = Path('build/e2e-evidence/starter-shared-jcef-experiment')
          suite_name = 'com.algorist.markflow.e2e.MarkFlowStarterSharedJcefExperimentTest'
          xml = Path('build/test-results/integrationTest') / f'TEST-{suite_name}.xml'
          if not xml.is_file():
              raise SystemExit(f'ERROR: missing exact experiment JUnit XML: {xml}')
          suite = ET.parse(xml).getroot()
          if suite.attrib.get('name') != suite_name:
              raise SystemExit(f'ERROR: wrong test suite identity: {suite.attrib}')
          metrics = {k: int(suite.attrib.get(k, '-1')) for k in ('tests', 'failures', 'errors', 'skipped')}
          if metrics != {'tests': 1, 'failures': 0, 'errors': 0, 'skipped': 0}:
              raise SystemExit(f'ERROR: experiment did not actually execute and pass: {metrics}')
          result = evidence / 'experiment-result.txt'
          if not result.is_file():
              raise SystemExit('ERROR: missing experiment-result.txt (a skipped test is not proof)')
          fields = dict(line.split('=', 1) for line in result.read_text().splitlines() if '=' in line)
          expected = {
              'schema': 'markflow-starter-shared-jcef-experiment/v2',
              'source_head': os.environ['STARTER_SOURCE_SHA'],
              'opt_in_only': 'true',
              'authoritative': 'false',
              'last_phase': 'completed',
              'production_wiring_passed': 'true',
              'differential_preview_passed': 'true',
              'ide_launch_requests': '1',
              'active_ide_projects': '2',
              'separate_active_projects': 'true',
              'project_switches': '1',
              'same_ide_process': 'true',
          }
          for key, value in expected.items():
              if fields.get(key) != value:
                  raise SystemExit(f'ERROR: {key}: expected={value}, observed={fields.get(key)}')
          if not (evidence / 'lifecycle-timing.txt').is_file():
              raise SystemExit('ERROR: lifecycle timing evidence is missing')
          package = Path('build/e2e-package/manifest.txt')
          if f"source_sha={os.environ['STARTER_SOURCE_SHA']}" not in package.read_text():
              raise SystemExit('ERROR: package source identity missing or mismatched')
          print('MARKFLOW_SHARED_JCEF_EXPERIMENT PASS: actual run, assertions, one IDE launch, two active projects, exact source')
          PY

      - name: Fail closed on isolated baseline evidence
        if: ${{ matrix.mode == 'isolated' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os
          import xml.etree.ElementTree as ET
          suites = [
              'com.algorist.markflow.e2e.MarkFlowStarterProductionWiringTest',
              'com.algorist.markflow.e2e.MarkFlowStarterDifferentialPreviewSmokeTest',
          ]
          result_dir = Path('build/test-results/integrationTest')
          for suite_name in suites:
              xml = result_dir / f'TEST-{suite_name}.xml'
              if not xml.is_file():
                  raise SystemExit(f'ERROR: missing isolated JUnit XML: {xml}')
              suite = ET.parse(xml).getroot()
              metrics = {k: int(suite.attrib.get(k, '-1')) for k in ('tests','failures','errors','skipped')}
              if metrics != {'tests':1,'failures':0,'errors':0,'skipped':0}:
                  raise SystemExit(f'ERROR: isolated suite failed/skipped: {suite_name} {metrics}')
          timings = [
              Path('build/e2e-evidence/derived-content/production-wiring/lifecycle-timing.txt'),
              Path('build/e2e-evidence/derived-content/differential-preview-smoke/lifecycle-timing.txt'),
          ]
          for timing in timings:
              if not timing.is_file() or 'completed=true' not in timing.read_text():
                  raise SystemExit(f'ERROR: incomplete isolated lifecycle evidence: {timing}')
          measure = Path('build/e2e-evidence/starter-shared-jcef-ab') / (os.environ['MEASUREMENT_MODE'] + '-' + os.environ['MEASUREMENT_SAMPLE']) / 'measurement.txt'
          fields = dict(line.split('=',1) for line in measure.read_text().splitlines() if '=' in line)
          if fields.get('source_head') != os.environ['STARTER_SOURCE_SHA'] or fields.get('gradle_exit') != '0':
              raise SystemExit(f'ERROR: isolated measurement identity mismatch: {fields}')
          print('MARKFLOW_451_AB isolated PASS ' + str(fields))
          PY
      - name: Upload experimental evidence, including failures
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: markflow-451-ab-${{ matrix.mode }}-${{ matrix.sample }}-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            build/e2e-evidence/starter-shared-jcef-ab/**
            build/e2e-evidence/starter-shared-jcef-experiment/**
            build/e2e-evidence/derived-content/production-wiring/lifecycle-timing.txt
            build/e2e-evidence/derived-content/differential-preview-smoke/**
            build/test-results/integrationTest/**
            build/reports/tests/integrationTest/**
            build/e2e-package/manifest.txt
            out/ide-tests/**/log/**
            build/idea-sandbox/**/log/idea.log
            ${{ runner.temp }}/markflow-451-xvfb.log
