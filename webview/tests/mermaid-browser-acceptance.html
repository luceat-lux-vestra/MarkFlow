<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>MarkFlow Mermaid browser acceptance</title></head>
<body>
<output id="markflow-mermaid-test-output" data-status="pending">PENDING</output>
<script type="module">
  import mermaid from "mermaid";
  const output = document.getElementById("markflow-mermaid-test-output");
  try {
    const response = await fetch("/__markflow_mermaid_cases", {cache: "no-store"});
    if (!response.ok) throw new Error("Fixture endpoint failed: " + response.status);
    const sources = await response.json();
    mermaid.initialize({startOnLoad: false, securityLevel: "strict"});
    const passed = [];
    for (const [name, source] of Object.entries(sources)) {
      const parsed = await mermaid.parse(source, {suppressErrors: false});
      if (!parsed) throw new Error(name + ": parser returned no result");
      const result = await mermaid.render("markflow-acceptance-" + name, source);
      const documentSvg = new DOMParser().parseFromString(result.svg, "image/svg+xml");
      const svg = documentSvg.documentElement;
      if (svg.localName !== "svg" || documentSvg.querySelector("parsererror")) {
        throw new Error(name + ": invalid SVG");
      }
      if (name === "info") {
        // Mermaid 12.3.0 infoRenderer sets width=100%, max-width=400px
        // and renders a version label, but does not emit a viewBox.
        // Preserve the strict viewBox requirement for every other diagram.
        const version = svg.querySelector("text.version")?.textContent?.trim() ?? "";
        if (svg.getAttribute("width") !== "100%" ||
            !/max-width:\s*400px(?:;|$)/.test(svg.getAttribute("style") ?? "") ||
            !/^v12\.2\.0(?:-tiny)?$/.test(version)) {
          throw new Error("info: SVG lacks expected version label or upstream sizing attributes");
        }
      } else {
        const bounds = (svg.getAttribute("viewBox") ?? "").trim().split(/[\s,]+/).map(Number);
        if (bounds.length !== 4 || !Number.isFinite(bounds[2]) || !Number.isFinite(bounds[3]) ||
            bounds[2] <= 0 || bounds[3] <= 0) throw new Error(name + ": SVG has no positive viewBox");
      }
      passed.push(name);
    }
    const isolationResponse = await fetch("/__markflow_mermaid_failure_isolation", {cache: "no-store"});
    if (!isolationResponse.ok) throw new Error("Failure-isolation fixture endpoint failed: " + isolationResponse.status);
    const isolation = await isolationResponse.json();
    if (!Array.isArray(isolation) || isolation.length !== 3) {
      throw new Error("failure-isolation example must contain exactly three Mermaid blocks");
    }

    const first = await mermaid.render("markflow-failure-isolation-before", isolation[0]);
    const firstSvg = new DOMParser().parseFromString(first.svg, "image/svg+xml");
    if (firstSvg.documentElement.localName !== "svg" || firstSvg.querySelector("parsererror")) {
      throw new Error("failure-isolation first valid block did not render");
    }

    let middleFailed = false;
    try {
      await mermaid.render("markflow-failure-isolation-invalid", isolation[1]);
    } catch {
      middleFailed = true;
    }
    if (!middleFailed) {
      throw new Error("intentional invalid Mermaid block unexpectedly rendered successfully");
    }

    const third = await mermaid.render("markflow-failure-isolation-after", isolation[2]);
    const thirdSvg = new DOMParser().parseFromString(third.svg, "image/svg+xml");
    if (thirdSvg.documentElement.localName !== "svg" || thirdSvg.querySelector("parsererror")) {
      throw new Error("failure-isolation valid block after renderer failure did not recover");
    }

    output.textContent = "PASS:" + passed.join(",") + ";FAILURE_ISOLATION_PASS";
    output.dataset.status = "passed";
  } catch (error) {
    output.textContent = "FAIL:" + (error?.stack ?? error);
    output.dataset.status = "failed";
  }
</script>
</body>
</html>
