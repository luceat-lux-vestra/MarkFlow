<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MarkFlow Editor</title>
    <style>
      body, html {
        margin: 0;
        padding: 0;
        height: 100%;
        background-color: transparent;
      }

      /* 에디터가 화면을 꽉 채우도록 설정 */
      #app {
        height: 100vh;
        overflow-y: auto;
        padding: 20px;
        box-sizing: border-box;
      }

      /* Mermaid 에러 메시지 스타일 */
      .mermaid-error {
        color: #ef4444;
        font-size: 12px;
        padding: 10px;
        border: 1px dashed #ef4444;
      }
    </style>
</head>
<body>
<div id="app"></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
