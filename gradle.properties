# IntelliJ Platform Artifacts Repositories -> https://plugins.jetbrains.com/docs/intellij/intellij-artifacts.html

pluginGroup = com.algorist.markflow
pluginName = MarkFlow - Seamless WYSIWYG Markdown Editor (markdown and more)
pluginRepositoryUrl = https://github.com/luceat-lux-vestra/MarkFlow
# Ordinary validation builds use the deterministic `0.0.0-dev` fallback from build.gradle.kts.
# Release builds pass `-PbuildVersion=<SemVer-without-leading-v>`; the protected Git tag is
# `vMAJOR.MINOR.PATCH` and the published plugin version is the same value without the leading `v`.

# Supported build number ranges and IntelliJ Platform versions -> https://plugins.jetbrains.com/docs/intellij/build-number-ranges.html
pluginSinceBuild = 262

# IntelliJ Platform Properties -> https://plugins.jetbrains.com/docs/intellij/tools-gradle-intellij-plugin.html#configuration-intellij-extension
# Runtime-evidence workflows treat this file and gradle/** as platform/build baseline inputs; changing either invalidates their evidence.
platformVersion = 2026.2.2

# Plugin Dependencies -> https://plugins.jetbrains.com/docs/intellij/plugin-dependencies.html
# Example: platformPlugins = com.jetbrains.php:203.4449.22, org.intellij.scala:2023.3.27@EAP
platformPlugins =
# Example: platformBundledPlugins = com.intellij.java
# JCEF is a separate bundled plugin since 2026.2; it carries the com.intellij.ui.jcef.* API.
# The bundled Markdown plugin is an explicit #145 parser dependency; projection consumes immutable source snapshots only.
platformBundledPlugins = com.intellij.modules.jcef,org.intellij.plugins.markdown
# Example: platformBundledModules = intellij.spellchecker
platformBundledModules =

# IntelliJ Platform Gradle Plugin 2.19.x adds product-info bundled plugins/modules to the ordinary test classpath.
# Keep the plugin's documented default exclusions and additionally exclude the commercial Ultimate licensing module:
# MarkFlow does not depend on it, and IDEA 2026.2.2 currently exposes an unrelated broken Ultimate extension during
# project startup that otherwise turns every platform test into a TestLoggerAssertionError.
org.jetbrains.intellij.platform.testIdeBundledPluginsClasspathExcludes=com.intellij.openRewrite,com.intellij.ja,com.intellij.ko,com.intellij.zh,org.jetbrains.plugins.vue,com.intellij.modules.ultimate

# IntelliJ Platform Gradle Plugin 2.19.0 excludes Kotlin stdlib/coroutines already provided by the IDE from sandbox
# runtime classpaths by default. Pin that behavior explicitly so plugin/tooling updates cannot silently change it.
org.jetbrains.intellij.platform.useDefaultSandboxExclusions=true

# Gradle Releases -> https://github.com/gradle/gradle/releases
gradleVersion = 9.7.1

# Opt-out flag for bundling Kotlin standard library -> https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency = false

# Enable Gradle Configuration Cache -> https://docs.gradle.org/current/userguide/configuration_cache.html
# Keep configuration cache disabled until the broader MarkFlow build graph is explicitly proven compatible.
org.gradle.configuration-cache = false

# Enable Gradle Build Cache -> https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching = true
